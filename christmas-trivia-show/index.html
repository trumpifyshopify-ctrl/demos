function exact(o,keys){return o&&typeof o==='object'&&!Array.isArray(o)&&Object.keys(o).length===keys.length&&keys.every(k=>Object.hasOwn(o,k))}

function valid(s){
 if(!exact(s,['v','settings','bank','session'])||s.v!==1)throw Error('Unknown backup format or version.');
 const t=s.settings;if(!exact(t,['title','teams','count','seconds','stars'])||!str(t.title,80)||!teamsOK(t.teams)||![12,24,36].includes(t.count)||![0,20,40,60].includes(t.seconds)||typeof t.stars!=='boolean')throw Error('Invalid show settings.');
 if(!Array.isArray(s.bank)||s.bank.length!==60||!s.bank.every(qOK))throw Error('The question library is invalid.');
 const g=s.session;if(g===null)return true;
 if(!exact(g,['title','teams','deck','idx','revealed','committed','selected','remaining','ledger','seconds','stars'])||!str(g.title,80)||!teamsOK(g.teams)||![0,20,40,60].includes(g.seconds)||typeof g.stars!=='boolean'||!Array.isArray(g.deck)||![12,24,36].includes(g.deck.length)||!Number.isInteger(g.idx)||g.idx<0||g.idx>g.deck.length||typeof g.revealed!=='boolean'||typeof g.remaining!=='number'||!Number.isFinite(g.remaining)||g.remaining<0||g.remaining>g.seconds||!Array.isArray(g.ledger)||g.ledger.length!==g.idx)throw Error('Invalid live show.');
 const ids=g.teams.map(t=>t.id),chosen=a=>Array.isArray(a)&&new Set(a).size===a.length&&a.every(id=>ids.includes(id));
 if(!chosen(g.committed)||!chosen(g.selected)||(!g.revealed&&g.selected.length))throw Error('Invalid answer selections.');
 if(new Set(g.deck.map(q=>q.id)).size!==g.deck.length||!g.deck.every((q,i)=>{const n=DEFAULT_BANK.findIndex(x=>x.id===q.id);return n>=0&&qOK(q,n)&&q.round===Math.floor(i/(g.deck.length/6))}))throw Error('Invalid question deck.');
 let used=new Set();for(let i=0;i<g.ledger.length;i++){const l=g.ledger[i];if(!exact(l,['idx','qid','correct','committed','remaining'])||typeof l.remaining!=='number'||!Number.isFinite(l.remaining)||l.remaining<0||l.remaining>g.seconds||l.idx!==i||l.qid!==g.deck[i].id||!chosen(l.correct)||!chosen(l.committed)||(!g.stars&&l.committed.length)||l.committed.some(x=>used.has(x)))throw Error('Invalid scoring ledger.');l.committed.forEach(x=>used.add(x))}
 if((!g.stars&&g.committed.length)||g.committed.some(x=>used.has(x))||(g.idx===g.deck.length&&(g.revealed||g.committed.length||g.selected.length)))throw Error('Invalid star state.');
 return true;
}

function current(){return state.session&&state.session.deck[state.session.idx]}

function render(){document.body.className=(page==='live'?'live-body':'')+(tv?' tv':'');$('#topbar').hidden=page==='live';document.querySelectorAll('[data-nav]').forEach(b=>b.setAttribute('aria-current',b.dataset.nav===page?'page':'false'));const f={studio:studio,setup:setup,library:library,live:live,results:results,print:printScreen};$('#screen').innerHTML=(f[page]||studio)();updateClock();}
function heading(k,title,desc,actions=''){return `<div id="main" class="page-head"><div><div class="eyebrow">${k}</div><h1>${title}</h1><p class="muted">${desc}</p></div><div class="actions">${actions}</div></div>`}
function studio(){const g=state.session;return `<div class="page"><div id="main"></div>${g?`<section class="card saved row between"><div><div class="eyebrow">${finished()?'Your curtain call is ready':'Ready when you are'}</div><strong>${esc(g.title)}</strong><p class="small no-margin">${finished()?'Finished show':`Question ${g.idx+1} of ${g.deck.length}`} · ${g.teams.length} teams · saved on this browser</p></div>${btn(finished()?'View results':'Resume show','resume','primary')}</section>`:''}<section class="hero"><div><div class="eyebrow">Gather your people. Cue the wonder.</div><h1>A Christmas night<br>worth playing together.</h1><p>Turn the living room into a little winter theatre. Six playful rounds. One shared screen. A room full of bright ideas.</p><div class="actions">${btn('Set up my show <span aria-hidden="true">↗</span>','setup','primary')}${btn('Try a sample show','sample')}</div><p class="small">2–8 teams · ages 9+ · 12, 24 or 36 questions · works offline</p></div><div class="hero-art">${stageArt()}</div></section><section class="rule-strip" aria-label="Quick start"><div class="rule"><span class="num">01</span><div><strong>Make your teams</strong><p>Choose names, a show length and a time limit.</p></div></div><div class="rule"><span class="num">02</span><div><strong>Think. Write. Reveal.</strong><p>Teams answer on paper. The host reveals and marks.</p></div></div><div class="rule"><span class="num">03</span><div><strong>Take a star-shaped chance</strong><p>Commit one star before a reveal to play for double points.</p></div></div></section><div class="row between hgap"><h2>Six rounds, six ways to shine.</h2><span class="pill">60 original questions</span></div><div class="round-grid">${ROUNDS.map((r,i)=>`<article class="round-tile"><div class="symbol" aria-hidden="true">${SYMBOLS[i]}</div><strong>${r}</strong><p>${ROUND_DESC[i]}</p></article>`).join('')}</div><footer class="footer"><span>One device. Real people. A little friendly competition.</span><span>Paper answers · no logins · no downloads needed to play</span></footer></div>`}
function setup(){let s=state.settings;return `<div class="page">${heading('The host studio','Make it your Christmas night.','A few small choices. A whole evening of good company.')}<form id="setup-form" novalidate><div class="cols"><section class="card"><h2>Your teams</h2><p class="muted">2–8 teams. Every team can earn 10 points per correct answer.</p><div class="setup-teams">${s.teams.map((t,i)=>`<div class="team-edit"><div><label for="emblem-${t.id}">Emblem</label><select id="emblem-${t.id}" data-emblem="${t.id}">${SYMBOLS.map((x,j)=>`<option value="${j}" ${j===t.emblem?'selected':''}>${x}</option>`).join('')}</select></div><div><label for="name-${t.id}">Team ${i+1} name <span class="counter">(60 max)</span></label><input id="name-${t.id}" data-team="${t.id}" value="${esc(t.name)}" maxlength="60" required autocomplete="off" aria-describedby="setup-error"></div>${btn('×','remove-team','','aria-label="Remove team '+(i+1)+'" data-id="'+t.id+'" '+(s.teams.length<=2?'disabled':''))}</div>`).join('')}</div><div class="actions hgap">${btn('+ Add team','add-team','',s.teams.length>=8?'disabled':'')}</div></section><div class="stack"><section class="card"><div class="field"><label for="show-title">Show title <span class="counter">(80 max)</span></label><input id="show-title" value="${esc(s.title)}" maxlength="80" required aria-describedby="setup-error"></div><div class="field"><label for="question-count">Show length</label><select id="question-count">${[[12,'12 questions · a little sparkle'],[24,'24 questions · a full gathering'],[36,'36 questions · make a night of it']].map(([v,t])=>`<option value="${v}" ${s.count===v?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label for="timer-seconds">Time per question</label><select id="timer-seconds">${[[20,'20 seconds · quick thinkers'],[40,'40 seconds · room to think'],[60,'60 seconds · take your time'],[0,'Untimed · your own pace']].map(([v,t])=>`<option value="${v}" ${s.seconds===v?'selected':''}>${t}</option>`).join('')}</select></div><label class="check"><input id="stars-option" type="checkbox" ${s.stars?'checked':''}>One double-points star per team</label><p class="small hgap">A star must be committed before the answer is revealed. A correct answer earns 20 points; a wrong answer earns zero. Either way, that star is used.</p></section><aside class="team-intro"><div class="eyebrow">The host's little checklist</div><p>Connect your laptop to the TV, hand out paper and pencils, and nominate a host. Everyone sees the same screen.</p><p class="small no-margin">The timer starts only when you press Start. No automatic reveals or question changes.</p></aside></div></div><p id="setup-error" class="error hgap" role="alert"></p><div class="row between"><p class="small no-margin">Changes save on this browser. Question edits apply to future shows.</p><button type="submit" class="primary">Create show <span aria-hidden="true">↗</span></button></div></form></div>`}
function readSetup(){const s=copy(state.settings);s.title=$('#show-title').value;document.querySelectorAll('[data-team]').forEach(el=>{const t=s.teams.find(t=>t.id===el.dataset.team);if(t)t.name=el.value});document.querySelectorAll('[data-emblem]').forEach(el=>{const t=s.teams.find(t=>t.id===el.dataset.emblem);if(t)t.emblem=Number(el.value)});s.count=Number($('#question-count').value);s.seconds=Number($('#timer-seconds').value);s.stars=$('#stars-option').checked;return s}
function setupError(s){if(!s.title.trim())return 'Give your show a title.';if(s.teams.some(t=>!t.name.trim()))return 'Every team needs a name.';if(new Set(s.teams.map(t=>t.name.trim().toLowerCase())).size!==s.teams.length)return 'Choose a different name for each team.';return ''}
function persistSetup(){const s=readSetup(),err=setupError(s);if(err){if($('#setup-error'))$('#setup-error').textContent=err;return false}s.title=s.title.trim();s.teams.forEach(t=>t.name=t.name.trim());state.settings=s;if($('#setup-error'))$('#setup-error').textContent='';save();return true}
function shuffled(a){const out=copy(a);for(let i=out.length-1;i>0;i--){const n=new Uint32Array(1);crypto.getRandomValues(n);const j=n[0]%(i+1);[out[i],out[j]]=[out[j],out[i]]}return out}
function start(sample=false){if(sample){state.settings={title:'The Mistlewick Christmas Night',teams:teamDefault(),count:12,seconds:40,stars:true}}const s=state.settings;state.session={title:s.title,teams:copy(s.teams),deck:ROUNDS.flatMap((_,r)=>shuffled(state.bank.filter(q=>q.round===r)).slice(0,s.count/6)),idx:0,revealed:false,committed:[],selected:[],remaining:s.seconds,ledger:[],seconds:s.seconds,stars:s.stars};save();go('live')}
function library(){const bank=state.bank.filter(q=>(libraryRound==='all'||q.round===Number(libraryRound))&&(q.q+' '+q.a+' '+q.e).toLowerCase().includes(librarySearch.toLowerCase()));return `<div class="page">${heading('The question cabinet','Good questions. Your own touches.','60 complete questions, with answers and explanations. Edits affect future shows.')}<div class="library-tools"><div><label for="question-search">Search questions and answers</label><input type="search" id="question-search" maxlength="100" value="${esc(librarySearch)}" placeholder="Try wreath, ribbon or snow…"></div><div><label for="round-filter">Round</label><select id="round-filter"><option value="all">All six rounds</option>${ROUNDS.map((r,i)=>`<option value="${i}" ${String(i)===libraryRound?'selected':''}>${r}</option>`).join('')}</select></div></div><p class="small" id="library-count">${bank.length} question${bank.length!==1?'s':''} shown · answers are visible in this editor</p><div id="library-list" class="question-grid">${bank.map(q=>questionItem(q)).join('')}</div>${bank.length?'':`<div class="empty"><h2>No questions found.</h2><p class="muted">Try another word or view all six rounds.</p>${btn('Clear search and filters','clear-search','primary')}</div>`}</div>`}
function questionItem(q){return `<article class="card question-item"><div class="eyebrow">${esc(q.id)} · ${ROUNDS[q.round]}</div><p class="qtext">${esc(q.q)}</p><div class="answer-preview"><strong class="gold">Answer: ${esc(q.a)}</strong><p class="muted no-margin">${esc(q.e)}</p></div><div class="actions">${btn('Edit question','edit-question','','data-id="'+q.id+'"')}${q.round===5?btn('View illustration','view-scene'):''}</div></article>`}
function live(){const g=state.session;if(!g)return studio();if(finished())return results();const q=current();return `<div class="stage-head"><div class="stage-brand" id="main">${esc(g.title)}</div><div class="actions">${btn(tv?'Standard view':'TV mode','tv','',innerWidth<1100?'disabled title="TV mode requires a wide window"':'')}${btn('Cover screen','cover')}${btn('Help','help')}${btn('Studio','studio')}</div></div><div class="stage-wrap"><div class="stage-meta"><div><div class="eyebrow">Round ${q.round+1} / 6 · ${ROUND_DESC[q.round]}</div><strong>${ROUNDS[q.round]}</strong></div><div class="stack" style="gap:5px"><div>Question ${g.idx+1} / ${g.deck.length}</div><div class="progress" aria-hidden="true">${ROUNDS.map((_,i)=>`<span class="${i<=q.round?'done':''}"></span>`).join('')}</div></div></div><div class="stage-layout"><article class="card paper question-card">${q.round===5?windowScene():''}<div class="eyebrow">${q.round===1?'True or false':q.round===3?'The letter lantern':q.round===4?'Work it out together':q.round===5?'Look at the scene':'Your next bright idea'}</div><h1>${esc(q.q)}</h1>${g.revealed?`<section class="answer"><div class="eyebrow">The answer</div><h2>${esc(q.a)}</h2><p>${esc(q.e)}</p></section>`:`<p class="muted no-margin">Talk it over. Write one answer per team.</p>`}</article><aside class="standings" aria-label="Teams and scores">${g.teams.map(t=>`<div class="team-score"><span class="emblem" aria-hidden="true" style="color:${TEAM_COLORS[t.emblem]}">${SYMBOLS[t.emblem]}</span><strong>${esc(t.name)}</strong><span class="points" aria-label="${score(t.id)} points">${score(t.id)}</span>${g.stars&&g.revealed?`<span class="star-state">${g.committed.includes(t.id)?'★ Committed · ×2':used(t.id)?'Star used':'Star saved'}</span>`:g.stars?btn(used(t.id)?'Star used':g.committed.includes(t.id)?'★ Star committed · ×2':'☆ Play double star','star','star-control',`aria-label="${used(t.id)?'Star used by':g.committed.includes(t.id)?'Cancel star for':'Play double star for'} ${esc(t.name)}" data-id="${t.id}" aria-pressed="${g.committed.includes(t.id)}" ${used(t.id)||g.revealed?'disabled':''}`):''}${g.revealed?`<label class="check score-check"><input data-correct="${t.id}" type="checkbox" aria-label="${esc(t.name)} correct" ${g.selected.includes(t.id)?'checked':''}>Correct</label>`:''}</div>`).join('')}</aside></div><p class="stage-note">${g.revealed?'Host: mark each team that answered correctly, then lock the score. Unmarked teams earn zero.':'Host: stars must be committed before the reveal. All teams can score; there is no fastest-finger rule.'}</p></div><footer class="stage-controls"><div class="clock"><svg class="timer-dial" viewBox="0 0 42 42" aria-hidden="true"><circle cx="21" cy="21" r="18" fill="none" stroke="#47665b" stroke-width="3"/><circle id="clock-circle" cx="21" cy="21" r="18" fill="none" stroke="#e4bb69" stroke-width="3" stroke-dasharray="113"/></svg><span class="clock-value" id="clock-value" aria-label="Seconds remaining">${g.seconds?Math.ceil(g.remaining):'∞'}</span>${btn('Start timer','timer','',g.revealed||!g.seconds?'disabled':'')}</div><div class="actions">${btn('Undo last score','undo','',g.ledger.length?'':'disabled')}${btn(g.revealed?'Answer revealed':'Reveal answer','reveal',g.revealed?'':'light',g.revealed?'disabled':'')}${btn(g.idx===g.deck.length-1?'Lock score & finish':'Lock score & next','next','primary',g.revealed?'':'disabled')}</div></footer>`}
function reveal(){const g=state.session;if(!g||finished()||g.revealed)return;pauseTimer();g.revealed=true;save();render();toast('Answer revealed. Mark the teams that answered correctly.');}
function lock(){const g=state.session;if(!g||finished()||!g.revealed)return;pauseTimer();g.ledger.push({idx:g.idx,qid:current().id,correct:copy(g.selected),committed:copy(g.committed),remaining:g.remaining});g.idx++;g.revealed=false;g.selected=[];g.committed=[];g.remaining=g.seconds;save();if(finished())go('results');else{render();$('#screen').focus({preventScroll:true});toast('Scores locked. Next question ready.')}}
function undo(){const g=state.session;if(!g||!g.ledger.length)return;pauseTimer();const l=g.ledger.pop();g.idx=l.idx;g.revealed=true;g.selected=copy(l.correct);g.committed=copy(l.committed);g.remaining=l.remaining;save();go('live');toast('Last score undone. Correct the marks and lock it again.');}
function winners(){const g=state.session;const max=Math.max(...g.teams.map(t=>score(t.id)));return g.teams.filter(t=>score(t.id)===max)}
function results(){if(!finished())return `<div class="page">${heading('The curtain call','Your winners are still in the making.','Finish the show to reveal the final ranking.',btn('Resume show','resume','primary'))}</div>`;const g=state.session,ws=winners(),ranks=[...g.teams].sort((a,b)=>score(b.id)-score(a.id));return `<div class="page"><section class="result-hero" id="main"><div class="crown" aria-hidden="true">✦</div><div class="eyebrow">The curtain call · ${esc(g.title)}</div><h1>${ws.map(t=>esc(t.name)).join(' & ')}${ws.length>1?' share the winter crown.':' takes the winter crown.'}</h1><p class="muted">${g.deck.length} questions. Six rounds. A room full of memories.</p><div class="rank-list">${ranks.map((t,i)=>`<div class="rank-row"><span>${1+ranks.filter(x=>score(x.id)>score(t.id)).length}</span><span class="emblem" aria-hidden="true" style="color:${TEAM_COLORS[t.emblem]}">${SYMBOLS[t.emblem]}</span><div><strong>${esc(t.name)}</strong><small style="display:block">${correctCount(t.id)} correct · ${used(t.id)?'star played':'star not played'}</small></div><b>${score(t.id)}</b></div>`).join('')}</div><div class="actions" style="justify-content:center">${btn('Print winner certificate','certificate','primary')}${btn('Undo last score','undo')}${btn('New show','new-show')}</div></section><h2 class="hgap">Every point, accounted for.</h2><div class="ledger">${g.ledger.map((l,i)=>`<div class="ledger-entry"><span class="gold">Q${i+1}</span><p>${esc(g.deck[i].q)}<br><span class="small">Answer: ${esc(g.deck[i].a)}</span></p><p class="small">${g.teams.map(t=>`${esc(t.name)}: ${l.correct.includes(t.id)?l.committed.includes(t.id)?20:10:0}${l.committed.includes(t.id)?' (star)':''}`).join('<br>')}</p></div>`).join('')}</div></div>`}
function printContent(type){const g=state.session,deck=g?g.deck:null,title=g?g.title:state.settings.title,n=deck?deck.length:state.settings.count,stars=g?g.stars:state.settings.stars;if(type==='certificate'){if(!finished())return '<p>Complete a show to unlock the winner certificate.</p>';return winners().map(t=>`<section class="paper-page"><div class="certificate"><p style="letter-spacing:4px">THE MISTLEWICK SHOW</p><h1>Winter Crown</h1><p>${winners().length>1?'Joint winner · ':''}Awarded with a roomful of applause to</p><h2>${esc(t.name)}</h2><p>${score(t.id)} points · ${g.deck.length} questions · ${g.teams.length} teams</p><p>${esc(g.title)}</p><p>Bright ideas. Good company. A Christmas to remember.</p></div></section>`).join('')}if(type==='key'){if(!deck)return '<p>Create a show to prepare its exact answer key.</p>';return `<h1>${esc(title)}</h1><p>HOST ANSWER KEY · Spoilers · ${n} questions</p>${deck.map((q,i)=>`<div class="answer-key-item"><h2>Q${i+1} · ${ROUNDS[q.round]}</h2><p>${esc(q.q)}</p><p><b>${esc(q.a)}</b> — ${esc(q.e)}</p>${i===deck.length-1?'<p class="print-foot">The Mistlewick Show · For the host only</p>':''}</div>`).join('')}`}return `<section class="answer-sheet"><h1>${esc(title)}</h1><p>TEAM: __________________________________</p><p>Write one answer per question. A correct answer earns 10 points${stars?", or 20 with your committed star":""}. The host records the score.</p><div class="sheetlines">${Array.from({length:n-2},(_,i)=>`<div class="sheetline">${i+1}. </div>`).join('')}</div><div class="sheet-tail"><div class="sheetlines">${[n-1,n].map(i=>`<div class="sheetline">${i}. </div>`).join('')}</div><p class="print-foot">${stars?"Our star question: ______ · ":""}Six rounds. One winter crown.</p></div></section>`}
function printScreen(){return `<div class="page">${heading('The finishing touches','Paper, keepsakes & peace of mind.','Print for the table. Keep a backup for another evening.')}<div class="row between" style="margin-bottom:25px"><div><label for="paper-size">Paper size</label><select id="paper-size" style="width:200px"><option value="A4" ${paper==='A4'?'selected':''}>A4</option><option value="Letter" ${paper==='Letter'?'selected':''}>US Letter</option></select></div><p class="small no-margin">Print opens your browser dialog.<br>Choose Save as PDF to make a PDF.</p></div><div class="print-grid"><section class="card"><div class="print-icon" aria-hidden="true">▤</div><h2>Team answer sheets</h2><p class="muted">${state.session?state.session.deck.length:state.settings.count} spaces. Hand out a copy to every team.</p>${btn('Print answer sheet','print-sheet','primary')}</section><section class="card"><div class="print-icon" aria-hidden="true">⌘</div><h2>The host's answer key</h2><p class="muted">The exact active deck, in show order. Contains all the answers.</p>${btn('Print host key','print-key','',state.session?'':'disabled')}</section><section class="card"><div class="print-icon" aria-hidden="true">✦</div><h2>A winter keepsake</h2><p class="muted">A winner certificate, with every tied winner included.</p>${btn('Print certificate','certificate','',finished()?'':'disabled')}</section></div><section class="card backup"><h2>Keep your show safe.</h2><p class="muted">Your settings, edited questions and show progress are saved on this browser. Backups let you move them to another device.</p><div class="actions">${btn('Download JSON backup','export','primary')}${btn('Reset all data','reset','danger')}</div><div class="file-label"><label for="import-file">Restore a JSON backup (maximum 300 KB)</label><input type="file" id="import-file" accept=".json,application/json"></div><p class="small hgap no-margin">Backups contain team names and answers. Keep them for the host. Public hosting publishes the default question bank in the source; it does not sync your saved show or make a private host channel. Moving or renaming a local file can change its storage area.</p></section><section class="hgap"><h2>A preview of the paper.</h2><p class="small">Preview: blank team answer sheet. The printed version omits all navigation.</p><div class="paper-preview">${printContent('sheet')}</div></section></div>`}
function showDialog(title,body,buttons='',callback=null){pauseTimer();opener=document.activeElement;onConfirm=callback;$('#dialog').innerHTML=`<div class="dialog-head"><h2 id="dialog-title">${title}</h2>${btn('×','close-dialog','','aria-label="Close dialog"')}</div>${body}<div class="dialog-actions">${buttons||btn('Close','close-dialog')}</div>`;$('#dialog').showModal()}
function closeDialog(){document.body.classList.remove('covered');$('#dialog').close();onConfirm=null;if(opener&&opener.isConnected)opener.focus()}
function confirmAction(title,body,action,label='Continue'){showDialog(title,`<p>${body}</p>`,btn('Cancel','close-dialog')+btn(label,'confirm','primary'),action)}
function help(){showDialog('Your little host handbook',`<div class="stack"><p>Connect one laptop to your TV and hand each team paper and a pencil. This is one shared screen, with no remote players or private host channel.</p><p><b>How to play:</b> read a question, start the optional timer, then reveal. Mark every team with a correct answer. Lock the score to move on. Correct = 10 points; a committed star doubles it to 20. Wrong = 0. A committed star is spent even if the answer is wrong.</p><p><b>Keyboard:</b> Space starts or pauses the timer. R reveals. N locks and advances after a reveal. Shortcuts pause while a dialog or text field has focus. Escape closes dialogs.</p><p><b>Host tools:</b> Undo restores the last score and all star choices. Cover screen conceals the stage. TV mode enlarges text. The timer pauses when you leave the tab or reload.</p><p><b>Saving:</b> changes stay on this browser. Use Print & backup to move a show. Offline content is limited to 60 questions, chosen without repeats within each show.</p></div>`)}
function editQuestion(id){const q=state.bank.find(q=>q.id===id);showDialog('Edit '+esc(id),`<p class="small">${ROUNDS[q.round]} · future shows only. Keep the original mechanic; illustration edits do not change the SVG.</p><form id="question-form" novalidate><div class="field"><label for="edit-q">Question (220 max)</label><textarea id="edit-q" maxlength="220" required>${esc(q.q)}</textarea></div><div class="field"><label for="edit-a">Accepted answer (120 max)</label><input id="edit-a" maxlength="120" value="${esc(q.a)}" required></div><div class="field"><label for="edit-e">Explanation (300 max)</label><textarea id="edit-e" maxlength="300" required>${esc(q.e)}</textarea></div><p class="error" id="edit-error" role="alert"></p><div class="actions">${btn('Reset this question','reset-question','','data-id="'+id+'"')}<button type="submit" class="primary">Save question</button></div><input type="hidden" id="edit-id" value="${id}"></form>`,btn('Cancel','close-dialog'))}
function preparePrint(type){pauseTimer();printType=type;$('#print-area').innerHTML=printContent(type);$('#paper-style').textContent=`@page {size:${paper};margin:15mm}`;window.print()}
function exportBackup(){pauseTimer();const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(b);const a=document.createElement('a');a.href=url;a.download='mistlewick-show-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup downloaded. Keep it for the host.');}
async function importBackup(file){if(!file)return;try{if(file.size>300000)throw Error('This file is larger than 300 KB.');const parsed=migrate(JSON.parse(await file.text()));confirmAction('Replace your saved show?','This valid backup will replace your settings, question library and current show. Download a backup first if you want to keep them.',()=>{state=copy(parsed);readLocked=false;$('#storage-warning').hidden=true;save();go('studio');toast('Backup restored. Your show is ready.');},'Restore backup')}catch(e){showDialog('Backup not imported',`<p>${esc(e instanceof SyntaxError?'This is not a valid JSON backup.':e.message)}</p><p>Your current show has not changed.</p>`)}finally{if($('#import-file'))$('#import-file').value=''}}
function act(action,el){switch(action){
 case'studio':go('studio');break;case'setup':go('setup');break;case'resume':go(finished()?'results':'live');break;
 case'sample':if(state.session)confirmAction('Replace the current show?','The sample creates a fresh 12-question show with four invented teams. Your current show will be replaced.',()=>start(true),'Start sample');else start(true);break;
 case'add-team':{if(!persistSetup())break;if(state.settings.teams.length<8){const teamIds=new Set(state.settings.teams.map(t=>t.id));let serial=Math.max(...state.settings.teams.map(t=>Number(t.id.slice(1))))+1;if(serial>999999)serial=1;while(teamIds.has('t'+serial))serial++;const id='t'+serial;let suffix=state.settings.teams.length+1;const occupied=new Set(state.settings.teams.map(t=>t.name.trim().toLowerCase()));while(occupied.has(('Team '+suffix).toLowerCase()))suffix++;state.settings.teams.push({id,name:'Team '+suffix,emblem:state.settings.teams.length});save();render()}break}
 case'remove-team':if(!persistSetup())break;if(state.settings.teams.length>2){state.settings.teams=state.settings.teams.filter(t=>t.id!==el.dataset.id);save();render()}break;
 case'clear-search':librarySearch='';libraryRound='all';render();$('#question-search').focus();break;
 case'edit-question':editQuestion(el.dataset.id);break;case'view-scene':showDialog('The winter window',windowScene()+`<p>${sceneDescription}</p>`);break;
 case'reset-question':{const id=el.dataset.id;closeDialog();confirmAction('Reset this question?','Replace your edits to this question with its original text? Active shows will keep their snapshot.',()=>{state.bank[state.bank.findIndex(q=>q.id===id)]=copy(DEFAULT_BANK.find(q=>q.id===id));save();render();toast('Original question restored.');},'Reset question');break}
 case'tv':pauseTimer();tv=innerWidth>=1100?!tv:false;render();break;case'help':help();break;
 case'cover':pauseTimer();showDialog('A little intermission',`<div class="cover-content"><div class="crown" aria-hidden="true">✦</div><h3>Stretch your legs.<br>The wonder will wait.</h3><p>The show is paused and covered.</p></div>`,btn('Return to the show','close-dialog','primary'));document.body.classList.add('covered');break;
 case'timer':toggleTimer();break;case'reveal':reveal();break;case'next':lock();break;case'undo':undo();break;
 case'star':{const g=state.session,id=el.dataset.id;if(g&&!g.revealed&&!used(id)&&g.stars){g.committed=g.committed.includes(id)?g.committed.filter(x=>x!==id):[...g.committed,id];save();render()}break}
 case'new-show':confirmAction('Make another Christmas memory?','This clears the finished show and returns to setup. Your team settings and edited questions stay.',()=>{state.session=null;save();go('setup')},'New show');break;
 case'print-sheet':preparePrint('sheet');break;case'print-key':if(state.session)confirmAction('Show the host answer key?','The print dialog will contain every answer in show order. If you mirror this screen, everyone may see the spoilers.',()=>preparePrint('key'),'Open answer key');break;
 case'certificate':if(finished())preparePrint('certificate');break;
 case'export':exportBackup();break;case'import':break;
 case'reset':confirmAction('Reset all data on this browser?','This removes your saved show, team settings and question edits. Download a JSON backup first to keep a copy.',()=>{pauseTimer();state=fresh();readLocked=false;$('#storage-warning').hidden=true;save();go('studio');toast('All data reset. A fresh studio is ready.');},'Reset all data');break;
 case'close-dialog':closeDialog();break;case'confirm':{const cb=onConfirm;closeDialog();if(cb)cb();break}
}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.nav){go(b.dataset.nav);return}if(b.dataset.action){e.preventDefault();act(b.dataset.action,b)}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='setup-form'){const s=readSetup(),err=setupError(s);$('#setup-error').textContent=err;if(err){$('#setup-error').scrollIntoView({block:'nearest'});return}s.title=s.title.trim();s.teams.forEach(t=>t.name=t.name.trim());state.settings=s;save();if(state.session)confirmAction('Replace your current show?','A fresh deck and scoreboard will replace your current show. Download a backup if you want to keep it.',()=>start(),'Create new show');else start()}if(e.target.id==='question-form'){const q=$('#edit-q').value.trim(),a=$('#edit-a').value.trim(),ex=$('#edit-e').value.trim();if(!q||!a||!ex){$('#edit-error').textContent='Question, answer and explanation are all required.';return}const item=state.bank.find(q=>q.id===$('#edit-id').value);item.q=q;item.a=a;item.e=ex;const savedId=item.id;save();closeDialog();render();const editOpener=document.querySelector(`[data-action="edit-question"][data-id="${savedId}"]`);if(editOpener)editOpener.focus({preventScroll:true});toast('Question saved for future shows.')}});
document.addEventListener('input',e=>{if(page==='setup'&&e.target.closest('#setup-form')){persistSetup()}if(e.target.id==='question-search'){librarySearch=e.target.value;const pos=e.target.selectionStart;render();$('#question-search').focus();$('#question-search').setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{if(page==='setup')persistSetup();if(e.target.id==='round-filter'){libraryRound=e.target.value;render()}if(e.target.dataset.correct){const g=state.session,id=e.target.dataset.correct;if(g&&g.revealed){g.selected=e.target.checked?[...new Set([...g.selected,id])]:g.selected.filter(x=>x!==id);save()}}if(e.target.id==='paper-size'){paper=e.target.value}if(e.target.id==='import-file')importBackup(e.target.files[0])});
$('#dialog').addEventListener('cancel',e=>{e.preventDefault();closeDialog()});
document.addEventListener('keydown',e=>{if(page!=='live'||$('#dialog').open||e.ctrlKey||e.metaKey||e.altKey||e.repeat||e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.code==='Space'){if(e.target.closest('button'))return;e.preventDefault();toggleTimer()}else if(e.key.toLowerCase()==='r'){e.preventDefault();reveal()}else if(e.key.toLowerCase()==='n'){e.preventDefault();lock()}});
window.addEventListener('resize',()=>{if(tv&&innerWidth<1100){tv=false;render()}const toggle=document.querySelector('[data-action="tv"]');if(toggle){toggle.disabled=innerWidth<1100;toggle.title=innerWidth<1100?'TV mode requires a wide window':''}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseTimer()});window.addEventListener('beforeunload',()=>pauseTimer());
render();
</script></body></html>
