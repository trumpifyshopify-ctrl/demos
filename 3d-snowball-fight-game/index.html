<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flurryfield</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="Flurryfield - a cosy 3D snowball-fight arena party game that plays offline in one file.">
<style>
:root{
  --ink:#1d2b4a; --paper:#fff8ee; --cream:#fff3dc; --blue:#2f6fd8; --blue2:#1b4fa8; --orange:#ff8a3d; --red:#e24b5a;
  --panel:rgba(255,248,238,.96); --shadow:0 10px 30px rgba(20,30,60,.25);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px); --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;width:100%;overflow:hidden;background:#0f1a33;color:var(--ink);font-family:"Trebuchet MS","Segoe UI",Verdana,system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;}
#ui{position:fixed;inset:0;pointer-events:none;overflow:hidden;}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;padding:calc(12px + var(--safe-t)) calc(12px + var(--safe-r)) calc(12px + var(--safe-b)) calc(12px + var(--safe-l));}
.hidden{display:none !important;}
.card{background:var(--panel);border-radius:22px;box-shadow:var(--shadow);padding:18px 22px;max-width:min(680px,94vw);max-height:calc(100vh - 24px - var(--safe-t) - var(--safe-b));overflow:auto;border:3px solid #fff;}
.card h2{margin:0 0 10px;font-size:clamp(20px,3.2vw,30px);color:var(--blue2);letter-spacing:.5px;}
.card p{margin:6px 0;line-height:1.35;font-size:clamp(14px,1.6vw,17px);}
.logo{font-size:clamp(44px,9vw,104px);font-weight:900;letter-spacing:2px;color:#fff;text-shadow:0 4px 0 #2f6fd8,0 8px 0 #1b4fa8,0 14px 30px rgba(0,20,60,.5);margin:0;line-height:1;transform:rotate(-3deg);}
.tagline{color:#fff;font-size:clamp(14px,2vw,20px);margin:10px 0 18px;text-shadow:0 2px 6px rgba(0,0,0,.5);font-weight:700;}
.menu{display:flex;flex-direction:column;gap:10px;align-items:stretch;min-width:min(300px,86vw);}
.btn{pointer-events:auto;cursor:pointer;border:0;border-radius:16px;padding:12px 22px;font:inherit;font-weight:800;font-size:clamp(15px,2vw,20px);color:#fff;background:linear-gradient(#3d82ee,#2358c0);box-shadow:0 5px 0 #173f8a,0 8px 18px rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s;text-align:center;letter-spacing:.3px;}
.btn:hover{transform:translateY(-1px);} .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #173f8a;}
.btn.warm{background:linear-gradient(#ffa052,#ef6b1a);box-shadow:0 5px 0 #a8450a,0 8px 18px rgba(0,0,0,.25);} .btn.warm:active{box-shadow:0 2px 0 #a8450a;}
.btn.soft{background:linear-gradient(#f7f3ea,#e4dccb);color:var(--ink);box-shadow:0 5px 0 #b9ae95,0 8px 18px rgba(0,0,0,.18);} .btn.soft:active{box-shadow:0 2px 0 #b9ae95;}
.btn.small{padding:8px 14px;font-size:14px;border-radius:12px;}
.btn.danger{background:linear-gradient(#f06a78,#c8323f);box-shadow:0 5px 0 #7d1d26;}
.btn:disabled{opacity:.5;cursor:default;}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;}
.credit{position:absolute;bottom:calc(8px + var(--safe-b));right:calc(12px + var(--safe-r));color:rgba(255,255,255,.75);font-size:12px;text-shadow:0 1px 3px rgba(0,0,0,.6);}
.version{position:absolute;bottom:calc(8px + var(--safe-b));left:calc(12px + var(--safe-l));color:rgba(255,255,255,.9);font-size:12px;text-shadow:0 1px 3px rgba(0,0,0,.6);}
.setting{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:7px 0;border-bottom:1px dashed #e2d9c7;font-size:15px;}
.setting:last-child{border-bottom:0;}
.setting input[type=range]{width:min(180px,40vw);}
.seg{display:inline-flex;border-radius:12px;overflow:hidden;border:2px solid var(--blue);}
.seg button{border:0;background:#fff;color:var(--blue2);font:inherit;font-weight:700;padding:6px 10px;cursor:pointer;font-size:13px;}
.seg button.on{background:var(--blue);color:#fff;}
.toggle{width:52px;height:28px;border-radius:14px;background:#cfc7b7;border:0;position:relative;cursor:pointer;}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s;}
.toggle.on{background:var(--blue);} .toggle.on::after{left:27px;}
/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;}
#score{position:absolute;top:calc(10px + var(--safe-t));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(20,30,60,.55);border-radius:18px;padding:6px 14px;color:#fff;font-weight:900;font-size:clamp(16px,2.4vw,26px);backdrop-filter:blur(4px);white-space:nowrap;}
#score .t{min-width:2.2em;text-align:center;padding:2px 8px;border-radius:10px;}
#score .clock{font-variant-numeric:tabular-nums;min-width:3.4em;text-align:center;}
#objective{position:absolute;top:calc(58px + var(--safe-t));left:50%;transform:translateX(-50%);color:#fff;font-weight:700;font-size:clamp(12px,1.6vw,16px);text-shadow:0 2px 4px rgba(0,0,0,.6);text-align:center;max-width:90vw;}
#ammo{position:absolute;left:calc(14px + var(--safe-l));bottom:calc(16px + var(--safe-b));display:flex;flex-direction:column;gap:6px;align-items:flex-start;}
#ammo .pips{display:flex;gap:5px;}
#ammo .pip{width:clamp(16px,2.4vw,24px);height:clamp(16px,2.4vw,24px);border-radius:50%;background:rgba(255,255,255,.25);border:2px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.4);}
#ammo .pip.on{background:#fff;}
#ammo .label{color:#fff;font-weight:800;font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.6);}
#frostbar{width:clamp(110px,16vw,170px);height:12px;border-radius:6px;background:rgba(255,255,255,.25);border:2px solid #fff;overflow:hidden;}
#frostbar div{height:100%;background:linear-gradient(90deg,#9fe3ff,#4fb8ff);width:0;transition:width .15s;}
#charge{position:absolute;left:50%;top:70%;transform:translate(-50%,0);width:120px;height:10px;border-radius:5px;background:rgba(0,0,0,.35);border:2px solid #fff;overflow:hidden;opacity:0;transition:opacity .1s;}
#charge div{height:100%;background:linear-gradient(90deg,#ffd37a,#ff8a3d);width:0;}
#hint{position:absolute;left:50%;bottom:calc(22% + var(--safe-b));transform:translateX(-50%);background:rgba(255,248,238,.95);color:var(--ink);padding:10px 16px;border-radius:14px;font-weight:700;font-size:clamp(13px,1.8vw,17px);box-shadow:var(--shadow);max-width:84vw;text-align:center;opacity:0;transition:opacity .25s;border:2px solid #fff;}
#hint.show{opacity:1;}
#toast{position:absolute;left:50%;top:30%;transform:translateX(-50%);color:#fff;font-weight:900;font-size:clamp(22px,4vw,44px);text-shadow:0 3px 0 #1b4fa8,0 6px 16px rgba(0,0,0,.6);opacity:0;transition:opacity .2s,transform .3s;white-space:normal;width:max-content;max-width:92vw;text-align:center;line-height:1.1;}
#toast.show{opacity:1;transform:translateX(-50%) scale(1.06);}
#bubbles{position:absolute;inset:0;overflow:hidden;}
.bubble{position:absolute;transform:translate(-50%,-100%);background:#fff;color:var(--ink);padding:5px 10px;border-radius:12px;font-weight:700;font-size:clamp(11px,1.4vw,15px);white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.3);transition:opacity .2s;}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0;}
.bubble.b1{background:#e9f4ff;}
#pausebtn{position:absolute;top:calc(10px + var(--safe-t));right:calc(10px + var(--safe-r));pointer-events:auto;width:44px;height:44px;border-radius:12px;border:2px solid #fff;background:rgba(20,30,60,.55);color:#fff;font-size:18px;font-weight:900;cursor:pointer;}
#mutebtn{position:absolute;top:calc(10px + var(--safe-t));right:calc(60px + var(--safe-r));pointer-events:auto;width:44px;height:44px;border-radius:12px;border:2px solid #fff;background:rgba(20,30,60,.55);color:#fff;font-size:17px;cursor:pointer;}
/* Touch */
#touch{position:absolute;inset:0;pointer-events:none;display:none;}
#stick{position:absolute;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.6);left:40px;bottom:calc(90px + var(--safe-b));display:none;}
#stick div{position:absolute;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.75);left:34px;top:34px;}
#tbtns{position:absolute;right:calc(14px + var(--safe-r));bottom:calc(96px + var(--safe-b));display:grid;grid-template-columns:repeat(2,64px);gap:12px;pointer-events:auto;}
.tbtn{width:64px;height:64px;border-radius:50%;border:3px solid #fff;background:rgba(47,111,216,.72);color:#fff;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.35);user-select:none;}
.tbtn.held{background:rgba(255,138,61,.9);}
.lefty #tbtns{right:auto;left:calc(14px + var(--safe-l));}
.lefty #ammo{left:auto;right:calc(14px + var(--safe-r));align-items:flex-end;}
/* results */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:10px 0;}
.stat{background:#fff;border-radius:12px;padding:8px 10px;text-align:center;border:2px solid #efe7d6;}
.stat b{display:block;font-size:22px;color:var(--blue2);} .stat span{font-size:12px;color:#5a6680;}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:12px 0 6px;height:120px;}
.podium div{width:90px;border-radius:10px 10px 0 0;color:#fff;font-weight:900;display:flex;align-items:flex-start;justify-content:center;padding-top:6px;font-size:14px;}
table.st{border-collapse:collapse;width:100%;font-size:13px;}
table.st td,table.st th{border-bottom:1px solid #e6dfd0;padding:4px 6px;text-align:left;}
table.st td.ok{color:#1c8a3a;font-weight:800;} table.st td.bad{color:#c62d3b;font-weight:800;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:8px 0;}
.item{background:#fff;border-radius:12px;padding:8px;border:2px solid #efe7d6;text-align:center;font-size:13px;cursor:pointer;pointer-events:auto;}
.item.on{border-color:var(--blue);background:#eaf2ff;} .item.locked{opacity:.75;}
.item .sw{width:100%;height:22px;border-radius:8px;margin-bottom:6px;border:2px solid #fff;box-shadow:inset 0 0 0 1px #ddd;}
.item b{display:block;font-size:13px;} .item small{color:#5a6680;font-size:12px;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.tabs button{border:2px solid var(--blue);background:#fff;color:var(--blue2);border-radius:10px;padding:5px 10px;font:inherit;font-weight:700;cursor:pointer;font-size:13px;}
.tabs button.on{background:var(--blue);color:#fff;}
kbd{background:#fff;border:1px solid #c9c1b0;border-bottom-width:3px;border-radius:6px;padding:1px 6px;font-size:13px;font-family:inherit;font-weight:800;}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;}
#vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 0 rgba(120,200,255,0);transition:box-shadow .3s;}
#coins{position:absolute;top:calc(12px + var(--safe-t));left:calc(14px + var(--safe-l));color:#fff;font-weight:900;text-shadow:0 2px 4px rgba(0,0,0,.6);font-size:16px;}
.coin{display:inline-block;width:14px;height:14px;border-radius:50%;background:radial-gradient(#ffe68a,#e3a200);vertical-align:-2px;margin-right:4px;border:1px solid #a87300;}
@media (max-width:640px){ .card{padding:12px 14px;border-radius:16px;} .stat b{font-size:18px;} .podium div{width:70px;} #stick{width:100px;height:100px;} #stick div{width:44px;height:44px;left:28px;top:28px;} #tbtns{grid-template-columns:repeat(2,56px);gap:10px;} .tbtn{width:56px;height:56px;font-size:12px;} }
@media (orientation:portrait){ #tbtns{bottom:calc(150px + var(--safe-b));} #stick{bottom:calc(150px + var(--safe-b));} #ammo{bottom:calc(18px + var(--safe-b));left:50%;transform:translateX(-50%);align-items:center;} .lefty #ammo{right:auto;left:50%;transform:translateX(-50%);align-items:center;} }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="ui">
  <div id="hud" class="hidden">
    <div id="coins"></div>
    <div id="score"><span class="t t0">0</span><span class="clock">3:00</span><span class="t t1">0</span></div>
    <div id="objective"></div>
    <button id="mutebtn" title="Mute (M)">&#9835;</button>
    <button id="pausebtn" title="Pause (Esc)">II</button>
    <div id="bubbles"></div>
    <div id="charge"><div></div></div>
    <div id="ammo"><div class="label" id="ammolabel">Snowballs</div><div class="pips"></div><div id="frostbar"><div></div></div></div>
    <div id="toast"></div>
    <div id="hint"></div>
    <div id="touch"><div id="stick"><div></div></div><div id="tbtns"></div></div>
  </div>
  <div id="flash"></div>
  <div id="vignette"></div>
  <div id="screens"></div>
</div>
<script>
'use strict';
// ============================================================================
// CONFIG - everything a maker wants to tweak lives here. Colours are "#rrggbb".
// ============================================================================
const CONFIG = {
  gameName: 'Flurryfield',                 // title shown on the logo and page
  tagline: 'The cosiest snowball fight on the mountain', // line under the logo
  saveKey: 'flurryfield.save',             // localStorage key prefix (version is appended)
  saveVersion: 2,                          // bump when the save layout changes; old saves migrate
  credit: { show: true, text: 'Made by Bramble Games' }, // small credit line in the menu; show:false hides it
  teams: {
    names: ['Bramble Bunch', 'Frostwhisker Crew'],        // team 0 is the hero team, team 1 the rivals
    colors: ['#2f6fd8', '#ff8a3d'],                       // team colours (coat/scarf accents, HUD)
    cbColors: ['#1f78ff', '#ffb000'],                     // colour-blind safe team colours
    patterns: [1, 2],                                      // coat pattern in colour-blind mode: 1 stripes, 2 dots
  },
  // Playable characters. Stats are multipliers on the base values below.
  characters: [
    { id: 'bramble', name: 'Bramble', species: 'red panda', desc: 'Chubby, cheerful, all-rounder.', body: '#c9552a', belly: '#f2d9b8', mask: '#fff2e4', ears: 1, tail: 1, throw: 1.0, speed: 1.0, scoop: 1.0, price: 0 },
    { id: 'pip',     name: 'Pip',     species: 'snow hare', desc: 'Quick feet, soft throws.',       body: '#e9eef5', belly: '#ffffff', mask: '#f6f8fc', ears: 2, tail: 0, throw: 0.88, speed: 1.15, scoop: 1.0, price: 120 },
    { id: 'moss',    name: 'Moss',    species: 'marmot',    desc: 'Big arm, slow boots, fast scoop.', body: '#8a6a44', belly: '#d9c39e', mask: '#e7d8bf', ears: 1, tail: 0, throw: 1.15, speed: 0.9, scoop: 1.25, price: 160 },
  ],
  // The hero's two teammates (bots) and the three rivals.
  teammates: [
    { name: 'Juniper', species: 'owl',      body: '#8c7a63', belly: '#eadcc3', mask: '#f3eadb', ears: 3, tail: 0, role: 'builder' },
    { name: 'Tansy',   species: 'hedgehog', body: '#6b5340', belly: '#d8c3a6', mask: '#e9dcc6', ears: 1, tail: 0, role: 'sneak' },
  ],
  rivals: [
    { name: 'Zephyr', species: 'snow fox', body: '#f4f6fa', belly: '#ffffff', mask: '#ffffff', ears: 2, tail: 1, role: 'thrower' },
    { name: 'Nimbus', species: 'snow fox', body: '#eef2f7', belly: '#ffffff', mask: '#ffffff', ears: 2, tail: 1, role: 'builder' },
    { name: 'Cinder', species: 'snow fox', body: '#f7f7f9', belly: '#ffffff', mask: '#ffffff', ears: 2, tail: 1, role: 'sneak' },
  ],
  rivalLook: { scarf: '#cfd6e0', earmuffs: '#dfe6f0' }, // silver scarves and earmuffs for the rivals
  // Cosmetic outfits bought with coins. type: hat | scarf | mittens | coat. color is the main tint.
  outfits: [
    { id: 'hat_bobble',  type: 'hat',     name: 'Striped Bobble',  color: '#2f6fd8', price: 0 },
    { id: 'hat_beanie',  type: 'hat',     name: 'Berry Beanie',    color: '#d94a6a', price: 60 },
    { id: 'hat_flap',    type: 'hat',     name: 'Earflap Hat',     color: '#6b8f3a', price: 90 },
    { id: 'hat_crown',   type: 'hat',     name: 'Icicle Crown',    color: '#9fe3ff', price: 220 },
    { id: 'scarf_stripe',type: 'scarf',   name: 'Candy Scarf',     color: '#ff6b6b', price: 0 },
    { id: 'scarf_plain', type: 'scarf',   name: 'Pine Scarf',      color: '#2f7a4a', price: 50 },
    { id: 'scarf_gold',  type: 'scarf',   name: 'Golden Scarf',    color: '#f2b53a', price: 140 },
    { id: 'mitt_red',    type: 'mittens', name: 'Cherry Mittens',  color: '#e24b5a', price: 0 },
    { id: 'mitt_mint',   type: 'mittens', name: 'Mint Mittens',    color: '#7fd8b5', price: 40 },
    { id: 'mitt_plum',   type: 'mittens', name: 'Plum Mittens',    color: '#8d4fa8', price: 70 },
    { id: 'coat_blue',   type: 'coat',    name: 'Puffy Blue Coat', color: '#2f6fd8', price: 0 },
    { id: 'coat_red',    type: 'coat',    name: 'Holly Red Coat',  color: '#d8343f', price: 110 },
    { id: 'coat_green',  type: 'coat',    name: 'Forest Coat',     color: '#2e8b57', price: 110 },
    { id: 'coat_purple', type: 'coat',    name: 'Twilight Coat',   color: '#6a4fb8', price: 180 },
  ],
  coins: { win: 40, loss: 15, perFreeze: 3, mvp: 20, cup: 120 }, // coin rewards
  // Arenas. Layouts are mirrored across x so both teams get the same cover.
  arenas: [
    { id: 'pond', name: 'Lantern Pond', mood: 'glassy', hazard: 'thinice',
      desc: 'A frozen pond ringed with skating lanterns. The middle is slippery and the centre ice is thin.',
      sky: ['#5c7fd6', '#dfe9ff'], fog: '#c6d6f5', snow: '#f4f7ff', ground: '#e9f0ff', ice: '#b9dcf5' },
    { id: 'forest', name: 'Whisperpine Woods', mood: 'woodsy', hazard: 'branches',
      desc: 'A pine forest with a sledding hill. Mind the snow that tumbles off the branches.',
      sky: ['#3f5f9f', '#cfe3ff'], fog: '#b9cde6', snow: '#f3f6fb', ground: '#e6edf7', ice: '#b9dcf5' },
    { id: 'square', name: 'Tinselbell Square', mood: 'festive', hazard: 'sled',
      desc: 'The town square with a giant tree and market stalls. A runaway sled slides across the lane.',
      sky: ['#2c3f7a', '#f7c9a2'], fog: '#c9b8d6', snow: '#f6f3fb', ground: '#ebe6f3', ice: '#b9dcf5' },
  ],
  modes: [
    { id: 'splat', name: 'Snow Splat', target: 15, desc: 'First team to 15 freezes, or the most when the whistle blows.' },
    { id: 'flag',  name: 'Flag Raid',  target: 3,  desc: 'Steal the rival flag from their fort and carry it home. Carriers are slower and cannot throw.' },
    { id: 'hill',  name: 'Cocoa Hill', target: 100, desc: 'Hold the hill around the cocoa stand. Points tick while only your team stands in it.' },
  ],
  match: { seconds: 180, teamSize: 3 },      // match length and players per team
  cup: [ // Snow Cup: 5 matches (arena index, mode index)
    { arena: 0, mode: 0 }, { arena: 1, mode: 1 }, { arena: 2, mode: 2 }, { arena: 1, mode: 0 }, { arena: 2, mode: 1 } ],
  player: {
    speed: 6.2,          // run speed in m/s
    accel: 22,           // how fast velocity reaches the target on snow (higher = snappier)
    iceAccel: 5,         // the same on ice (lower = more sliding)
    radius: 0.5,         // body radius for collisions
    hitHeight: 1.7,      // snowballs below this height can hit a player
    dodgeSpeed: 15,      // dodge roll speed
    dodgeTime: 0.32,     // dodge roll length in seconds
    dodgeSafe: 0.4,      // seconds of safety after starting a dodge
    dodgeCooldown: 1.4,  // seconds before the next dodge
    scoopTime: 0.45,     // seconds per snowball when scooping on fresh snow
    scoopClearedFactor: 2.2, // scooping is this many times slower on cleared ground
    maxAmmo: 5,          // ammo meter size
    frostToFreeze: 3,    // frost points before freezing
    frozenTime: 3.0,     // seconds as an ice block before respawning
    shieldTime: 2.0,     // seconds of shield after respawn
    meltDelay: 4.0,      // seconds out of trouble before frost starts melting
    meltRate: 0.25,      // frost points melted per second after that
    carrierSpeed: 0.82,  // speed factor while carrying a flag
  },
  snowball: {
    gravity: 20,         // gravity for snowballs (a touch heavy for a toy arc)
    quickSpeed: 15,      // speed of a tap throw
    chargeSpeed: 27,     // speed of a fully charged throw
    quickAngle: 0.22,    // elevation of a tap throw (radians)
    chargeAngle: 0.52,   // elevation of a full charge
    chargeTime: 0.9,     // seconds to reach a full charge
    radius: 0.2,         // snowball radius
    maxLife: 4,          // seconds before a lost snowball disappears
    maxActive: 48,       // pool size
  },
  wall: { cost: 2, hp: 4, width: 2.2, height: 0.95, depth: 0.5, perPlayer: 2, maxActive: 16 }, // packed snow walls
  giant: {
    startRadius: 0.55,   // radius when you begin rolling
    maxRadius: 2.1,      // the biggest a giant can get
    growPerMeter: 0.085,  // radius gained per metre rolled over fresh snow
    pushSlow: 0.62,      // speed loss at max size (0 = none)

function collideCircle(A,p,r,hMin){

const SAVE_KEY=CONFIG.saveKey+'.v'+CONFIG.saveVersion, SAVE_BACKUP=CONFIG.saveKey+'.backup';
function defaultSave(){ return { version:CONFIG.saveVersion, coins:0, unlocked:CONFIG.outfits.filter(o=>o.price===0).map(o=>o.id), chars:['bramble'], hero:'bramble',
  equipped:{hat:'hat_bobble',scarf:'scarf_stripe',mittens:'mitt_red',coat:'coat_blue'}, mates:{hat:'hat_beanie',scarf:'scarf_plain',mittens:'mitt_mint',coat:'coat_green'},
  settings:{music:0.6,effects:0.8,difficulty:1,aimAssist:CONFIG.aimAssist,shake:1,reducedMotion:false,colorBlind:false,quality:'auto',lefty:false}, tutorialDone:false, matches:0, wins:0, cupBest:0, targetsBest:0 }; }
function migrateSave(s){ // v1 saves had no characters list and stored outfits as a flat list
  if(!s||typeof s!=='object') throw new Error('bad save'); const d=defaultSave(); if(!s.version) s.version=1;
  if(s.version<2){ s.chars=s.chars||['bramble']; s.hero=s.hero||'bramble'; s.mates=s.mates||d.mates; if(Array.isArray(s.equipped)){ const eq=Object.assign({},d.equipped); for(const id of s.equipped){ const o=CONFIG.outfits.find(o=>o.id===id); if(o) eq[o.type]=id; } s.equipped=eq; } s.version=2; }
  for(const k in d){ if(s[k]===undefined) s[k]=d[k]; } for(const k in d.settings){ if(s.settings[k]===undefined) s.settings[k]=d.settings[k]; } if(typeof s.coins!=='number'||!(s.coins>=0)) s.coins=0; return s; }
function loadSave(storage){ storage=storage||window.localStorage; let raw=null; try{ raw=storage.getItem(SAVE_KEY)||storage.getItem(CONFIG.saveKey+'.v1'); }catch(e){} if(!raw) return {save:defaultSave(),fresh:true};
  try{ return {save:migrateSave(JSON.parse(raw)),fresh:false}; } catch(e){ try{ storage.setItem(SAVE_BACKUP,raw); }catch(_){} return {save:defaultSave(),fresh:true,corrupt:true}; } }
function writeSave(save,storage){ try{ (storage||window.localStorage).setItem(SAVE_KEY,JSON.stringify(save)); }catch(e){} }

// Input: keyboard + mouse, touch, gamepad -> one input struct per tick
// ============================================================================
class Input {
  constructor(canvas,R){ this.R=R; this.keys={}; this.mouse={x:0,y:0,down:false,rdown:false,active:false}; this.touch={stick:null,aim:null,btn:{}}; this.gp={on:false}; this.anyPress=null; this.lastKind='mouse'; this.hasTouch=false;
    const stickEl=document.getElementById('stick'); this.stickEl=stickEl; this.knob=stickEl.firstElementChild;
    window.addEventListener('keydown',e=>{ if(e.repeat) return; this.keys[e.code]=true; this.lastKind='key'; this.fire('key',e); if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault(); });
    window.addEventListener('keyup',e=>{ this.keys[e.code]=false; });

    window.addEventListener('mouseup',e=>{ if(e.button===0) this.mouse.down=false; if(e.button===2) this.mouse.rdown=false; });
    canvas.addEventListener('contextmenu',e=>e.preventDefault());
    const tb=document.getElementById('tbtns'); tb.innerHTML=''; for(const [id,label] of [['scoop','Scoop'],['dodge','Dodge'],['wall','Wall'],['roll','Roll']]){ const b=document.createElement('div'); b.className='tbtn'; b.textContent=label; b.dataset.id=id; tb.appendChild(b);
      const on=e=>{ e.preventDefault(); this.touch.btn[id]=true; b.classList.add('held'); this.hasTouch=true; this.lastKind='touch'; this.fire('pointer',e); }; const off=e=>{ e.preventDefault(); this.touch.btn[id]=false; b.classList.remove('held'); };
      b.addEventListener('touchstart',on,{passive:false}); b.addEventListener('touchend',off); b.addEventListener('touchcancel',off); b.addEventListener('mousedown',on); b.addEventListener('mouseup',off); b.addEventListener('mouseleave',off); }
    canvas.addEventListener('touchstart',e=>{ e.preventDefault(); this.hasTouch=true; this.lastKind='touch'; for(const t of e.changedTouches){ const left=this.lefty? t.clientX>window.innerWidth/2 : t.clientX<window.innerWidth/2; if(left&&!this.touch.stick){ this.touch.stick={id:t.identifier,x0:t.clientX,y0:t.clientY,x:t.clientX,y:t.clientY}; stickEl.style.display='block'; stickEl.style.left=(t.clientX-60)+'px'; stickEl.style.top=(t.clientY-60)+'px'; stickEl.style.bottom='auto'; } else if(!left&&!this.touch.aim){ this.touch.aim={id:t.identifier,x0:t.clientX,y0:t.clientY,x:t.clientX,y:t.clientY,t0:performance.now(),moved:false}; } } this.fire('pointer',e); },{passive:false});
    canvas.addEventListener('touchmove',e=>{ e.preventDefault(); for(const t of e.changedTouches){ const s=this.touch.stick, a=this.touch.aim; if(s&&t.identifier===s.id){ s.x=t.clientX; s.y=t.clientY; const dx=s.x-s.x0, dy=s.y-s.y0, l=Math.hypot(dx,dy), m=Math.min(l,46); this.knob.style.left=(34+(l?dx/l*m:0))+'px'; this.knob.style.top=(34+(l?dy/l*m:0))+'px'; } if(a&&t.identifier===a.id){ a.x=t.clientX; a.y=t.clientY; if(Math.hypot(a.x-a.x0,a.y-a.y0)>12) a.moved=true; } } },{passive:false});
    const tend=e=>{ for(const t of e.changedTouches){ const s=this.touch.stick, a=this.touch.aim; if(s&&t.identifier===s.id){ this.touch.stick=null; stickEl.style.display='none'; this.knob.style.left='34px'; this.knob.style.top='34px'; } if(a&&t.identifier===a.id){ this.touch.aim=null; this.touchRelease={moved:a.moved,dx:a.x-a.x0,dy:a.y-a.y0}; } } };
    canvas.addEventListener('touchend',tend); canvas.addEventListener('touchcancel',tend);
    window.addEventListener('gamepadconnected',()=>{ this.gp.on=true; }); this.cb={}; this.lefty=false; this.aimDir=[1,0]; this.aimAssist=0.5; this.heldThrow=false; this.tmp3=[0,0,0]; this.prevGp={};
  }
  on(ev,fn){ this.cb[ev]=fn; } fire(ev,e){ if(this.cb[ev]) this.cb[ev](e); if(this.cb.any) this.cb.any(e); }
  pollGamepad(){ let gp=null; try{ const pads=navigator.getGamepads?navigator.getGamepads():[]; for(const p of pads){ if(p&&p.connected!==false){ gp=p; break; } } }catch(e){} this.pad=gp; if(gp){ let active=false; for(let i=0;i<gp.buttons.length;i++){ const b=gp.buttons[i]; const pr=b&&(typeof b==='object'?b.pressed||b.value>0.3:b>0.3); if(pr&&!this.prevGp[i]){ active=true; this.fire('pad',{button:i}); } this.prevGp[i]=pr; } for(let i=0;i<4;i++) if(Math.abs(gp.axes[i]||0)>0.3) active=true; if(active) this.lastKind='pad'; } }

  // camera-relative screen direction -> world xz
  screenToWorldDir(dx,dy,out){ const v=this.R.view; let rx=v[0], rz=v[8], fx=-v[2], fz=-v[10]; let l=Math.hypot(rx,rz)||1; rx/=l; rz/=l; l=Math.hypot(fx,fz)||1; fx/=l; fz/=l; out[0]=rx*dx-fx*dy; out[1]=rz*dx-fz*dy; return out; }
  // build the hero's input for this tick
  read(hero,m,inp){ const k=this.keys; inp.mx=inp.mz=0; inp.throw=false; inp.dodge=false; inp.scoop=false; inp.wall=false; inp.roll=false; inp.aimValid=false; if(!hero) return inp;
    let dx=0, dy=0; if(k.KeyW||k.ArrowUp) dy-=1; if(k.KeyS||k.ArrowDown) dy+=1; if(k.KeyA||k.ArrowLeft) dx-=1; if(k.KeyD||k.ArrowRight) dx+=1;
    const gp=this.pad; if(gp){ const ax=gp.axes[0]||0, ay=gp.axes[1]||0; if(Math.hypot(ax,ay)>0.2){ dx=ax; dy=ay; } }
    const s=this.touch.stick; if(s){ const sx=(s.x-s.x0)/46, sy=(s.y-s.y0)/46; const l=Math.hypot(sx,sy); if(l>0.15){ dx=sx/Math.max(1,l); dy=sy/Math.max(1,l); } }
    if(dx||dy){ const w=this.screenToWorldDir(dx,dy,this.tmp3); inp.mx=w[0]; inp.mz=w[1]; }
    let assist=false;
    // aim: mouse ground point, gamepad right stick, or touch drag
    if(gp&&Math.hypot(gp.axes[2]||0,gp.axes[3]||0)>0.3){ const w=this.screenToWorldDir(gp.axes[2],gp.axes[3],this.tmp3); inp.ax=w[0]; inp.az=w[1]; inp.aimValid=true; assist=true; this.lastKind='pad'; }
    else if(this.touch.aim&&this.touch.aim.moved){ const a=this.touch.aim; const w=this.screenToWorldDir(a.x-a.x0,a.y-a.y0,this.tmp3); inp.ax=w[0]; inp.az=w[1]; inp.aimValid=true; assist=true; }
    else if(this.mouse.active&&this.lastKind==='mouse'){ const g=this.R.screenToGround(this.mouse.x,this.mouse.y,hero.y+0.5,this.tmp3); const ax=g[0]-hero.x, az=g[2]-hero.z; if(Math.hypot(ax,az)>0.3){ inp.ax=ax; inp.az=az; inp.aimValid=true; } }
    else if(gp&&(dx||dy)&&this.lastKind==='pad'){ inp.ax=inp.mx; inp.az=inp.mz; inp.aimValid=true; assist=true; }
    if(assist&&this.aimAssist>0&&m){ const l=Math.hypot(inp.ax,inp.az)||1; let bx=inp.ax/l, bz=inp.az/l, best=0.75; for(const q of m.players){ if(q.team===hero.team||!q.alive||q.frozen>0) continue; const qx=q.x-hero.x, qz=q.z-hero.z, ql=Math.hypot(qx,qz); if(ql<1||ql>22) continue; const dot=(qx*inp.ax+qz*inp.az)/(ql*l); if(dot>best){ best=dot; bx=qx/ql; bz=qz/ql; } } if(best>0.75){ const s=this.aimAssist*0.9; inp.ax=lerp(inp.ax/l,bx,s); inp.az=lerp(inp.az/l,bz,s); } }
    // buttons
    const padThrow=this.padBtn(7)||this.padBtn(5);
    inp.throw=this.mouse.down||padThrow||(!!this.touch.aim&&this.touch.aim.moved)||!!this.touchRelease;
    if(this.touchRelease){ const r=this.touchRelease; this.touchRelease=null; if(!r.moved){ inp.throw=true; this.quickTap=2; } else { inp.throw=false; } }
    if(this.quickTap>0){ this.quickTap--; inp.throw=this.quickTap>0; }
    inp.dodge=!!(k.Space||this.mouse.rdown||this.padBtn(0)||this.touch.btn.dodge);
    inp.scoop=!!(k.KeyF||this.padBtn(2)||this.touch.btn.scoop);
    inp.wall=!!(k.KeyE||this.padBtn(3)||this.touch.btn.wall);
    inp.roll=!!(k.KeyR||this.padBtn(1)||this.touch.btn.roll);
    return inp; }
}

    else { this.scene.build(m,alpha,dt,this); if(m&&(this.state==='match'||this.state==='practice'||this.state==='paused')&&m.players[0].human) this.scene.drawArc(m.players[0]); if(this.state==='tour'&&m) this.scene.drawArc(m.players[0]); }
    const sceneMs=performance.now()-ts2; const ts3=performance.now(); this.R.render(dt); const renderMs=performance.now()-ts3;

    this.audio.update(dt);

    const P=this.perf; P.n++; P.sim+=simMs; P.scene+=sceneMs; P.render+=renderMs; P.frame+=performance.now()-t0; this.perfSamples.push(performance.now()-t0); if(this.perfSamples.length>240) this.perfSamples.shift();

  perfReport(){ const P=this.perf; const n=Math.max(1,P.n); return {frames:P.n,simMs:+(P.sim/n).toFixed(2),sceneMs:+(P.scene/n).toFixed(2),renderMs:+(P.render/n).toFixed(2),frameMs:+(P.frame/n).toFixed(2),drawCalls:this.R.drawCalls,quality:this.effQuality()}; }

}
// ============================================================================
// ?selftest=1 : headless checks on the simulation (never the renderer)
// ============================================================================
Game.prototype.startSelftest=function(){ this.state='selftest'; this.hud.classList.add('hidden'); this.show(`<div class="card" style="min-width:min(760px,96vw)"><h2>Self test</h2><p id="stStatus">Running...</p><table class="st" id="stTable"><tr><th>Check</th><th>Result</th><th>Detail</th></tr></table><div class="row" id="stb" style="margin-top:10px"></div></div>`);
  this.st={rows:[],queue:[],i:0,done:false}; const st=this.st; const add=(name,fn)=>st.queue.push({name,fn});
  const sameDiff=[1,1];
  add('Same seed and inputs give the same match twice',()=>{ const a=runHeadless({arena:1,mode:0,seed:4242,diff:sameDiff,human:false},100).match; const b=runHeadless({arena:1,mode:0,seed:4242,diff:sameDiff,human:false},100).match; const sa=JSON.stringify([a.score,a.stats,a.players.map(p=>[p.x,p.z,p.frost])]), sb=JSON.stringify([b.score,b.stats,b.players.map(p=>[p.x,p.z,p.frost])]); return {ok:sa===sb,detail:`score ${a.score.join('-')} / ${b.score.join('-')}, ${a.tick} ticks`}; });
  for(let mo=0;mo<3;mo++) for(let ar=0;ar<3;ar++) add(`Balance: ${CONFIG.modes[mo].name} on ${CONFIG.arenas[ar].name} (equal bots, 10 seeded matches)`,()=>{ const w=[0,0,0]; let ended=0, valid=true; const play=(s)=>{ const r=runHeadless({arena:ar,mode:mo,seed:1000+s*31+mo*7+ar,diff:sameDiff,human:false}); const m=r.match; if(m.over) ended++; if(!(m.winner===-1||m.winner===0||m.winner===1)) valid=false; w[m.winner<0?2:m.winner]++; st.minRival=Math.min(st.minRival===undefined?1e9:st.minRival,r.minRival); if(r.inWall) st.inWall=true; };
      for(let s=0;s<10;s++) play(s); let n=10; const first=w.slice(); let ok=w[0]>=3&&w[0]<=7&&w[1]>=3&&w[1]<=7; let detail=`team wins ${w[0]} - ${w[1]}, draws ${w[2]}`;
      if(!ok){ // a fair coin lands outside 3-7 of 10 about 11% of the time: confirm with 20 more seeded matches (9-21 of 30 passes)
        for(let s=10;s<30;s++) play(s); n=30; ok=w[0]>=9&&w[0]<=21&&w[1]>=9&&w[1]<=21; detail=`first 10: ${first[0]} - ${first[1]} (draws ${first[2]}); confirmed over 30: ${w[0]} - ${w[1]}, draws ${w[2]}`; }
      st.endedAll=(st.endedAll===undefined?true:st.endedAll)&&ended===n&&valid; st.played=(st.played||0)+n; return {ok,detail}; });
  add('Bot hero team wins at least 4 of 10 on Normal',()=>{ let w=0; const play=s=>{ const m=runHeadless({arena:s%3,mode:0,seed:7000+s*17,diff:[1,1],human:true,heroBot:true}).match; if(m.winner===0) w++; }; for(let s=0;s<10;s++) play(s); if(w>=4) return {ok:true,detail:`${w} of 10`}; const first=w; for(let s=10;s<30;s++) play(s); return {ok:w>=12,detail:`first 10: ${first} of 10; confirmed over 30: ${w} of 30 (needs 12)`}; });
  add('Every match ends on time with a valid winner or a draw',()=>({ok:!!st.endedAll,detail:st.endedAll?`all ${st.played} balance matches ended with winner 0, 1 or draw`:'a match did not end or had an invalid winner'}));
  add('A giant grows with distance rolled and stops on cleared ground',()=>{ const m=new Match({arena:1,mode:0,seed:5,diff:sameDiff,human:true}); m.startDelay=0; m.started=true; const h=m.players[0]; h.x=-14; h.z=-10; h.aimx=1; h.aimz=0; for(const q of m.players){ if(q!==h){ q.alive=false; q.x=80; } } const inp=emptyInput(); inp.roll=true; inp.ax=1; inp.az=0; m.step(inp); inp.roll=false; inp.mx=1; const g=m.giants[0]; if(!g) return {ok:false,detail:'no giant started'}; const r0=g.r; for(let i=0;i<150;i++) m.step(inp); const r1=g.r; const d1=g.rolled;
    // teleport back to the start and roll the same cleared path again
    h.x=-14; h.z=-10; g.x=h.x+g.r+PC.radius+0.1; g.z=-10; for(let i=0;i<150;i++) m.step(inp); const r2=g.r; return {ok:r1>r0+0.1&&Math.abs(r2-r1)<0.05&&g.rolled>d1,detail:`radius ${r0.toFixed(2)} -> ${r1.toFixed(2)} after ${d1.toFixed(1)} m of fresh snow, then ${r2.toFixed(2)} after rolling the cleared path again`}; });
  add('No player respawns inside a wall or within a rival\'s throwing range',()=>({ok:!st.inWall&&st.minRival>7,detail:`closest rival at a respawn: ${st.minRival===undefined?'-':st.minRival.toFixed(1)+' m'} (quick throw reaches ${RANGE_TABLE[0].toFixed(1)} m); inside obstacle: ${st.inWall?'yes':'no'}`}));
  add('Pools never grow without limit over a full Snow Cup',()=>{ let peak={balls:0,walls:0,giants:0}; for(const c of CONFIG.cup){ const m=runHeadless({arena:c.arena,mode:c.mode,seed:31337,diff:[2,2],human:false}).match; for(const k in peak) peak[k]=Math.max(peak[k],m.poolPeak[k]); } return {ok:peak.balls<=SB.maxActive+2&&peak.walls<=WC.maxActive&&peak.giants<=GC.maxActive,detail:`peak snowballs ${peak.balls}/${SB.maxActive}, walls ${peak.walls}/${WC.maxActive}, giants ${peak.giants}/${GC.maxActive}`}; });
  add('Saves load and migrate (v1 -> v'+CONFIG.saveVersion+', corrupt save kept as backup)',()=>{ const mem={d:{},getItem(k){return this.d[k]===undefined?null:this.d[k];},setItem(k,v){this.d[k]=v;},removeItem(k){delete this.d[k];}}; mem.setItem(CONFIG.saveKey+'.v1',JSON.stringify({version:1,coins:77,equipped:['hat_beanie','coat_red'],unlocked:['hat_beanie','coat_red']})); const a=loadSave(mem).save; const okA=a.version===CONFIG.saveVersion&&a.coins===77&&a.equipped.hat==='hat_beanie'&&a.equipped.coat==='coat_red'&&a.chars.includes('bramble'); mem.setItem(SAVE_KEY,'{not json'); const b=loadSave(mem); const okB=b.corrupt&&b.save.coins===0&&mem.getItem(SAVE_BACKUP)==='{not json'; writeSave({version:CONFIG.saveVersion,coins:5},mem); const c=loadSave(mem).save; return {ok:okA&&okB&&c.coins===5&&c.settings&&c.settings.quality==='auto',detail:`migrated coins ${a.coins}, hat ${a.equipped.hat}; corrupt -> defaults with backup ${okB?'kept':'missing'}`}; });
};
Game.prototype.selftestTick=function(){ const st=this.st; if(st.done) return; if(st.i>=st.queue.length){ st.done=true; const pass=st.rows.filter(r=>r.ok).length; document.getElementById('stStatus').innerHTML=`<b>${pass===st.rows.length?'ALL PASSED':'FAILED'}</b>: ${pass} of ${st.rows.length} checks passed.`; document.getElementById('stb').appendChild(this.btn(this.T.back,'soft',()=>{ location.href=location.pathname; })); window.FLURRY_SELFTEST={done:true,pass,total:st.rows.length,rows:st.rows}; return; }
  const q=st.queue[st.i++]; let res; const t0=performance.now(); try{ res=q.fn(); }catch(e){ res={ok:false,detail:'error: '+(e&&e.message)}; } res.name=q.name; res.ms=Math.round(performance.now()-t0); st.rows.push(res); const tr=document.createElement('tr'); tr.innerHTML=`<td>${q.name}</td><td class="${res.ok?'ok':'bad'}">${res.ok?'PASS':'FAIL'}</td><td>${res.detail} <small>(${res.ms} ms)</small></td>`; document.getElementById('stTable').appendChild(tr); document.getElementById('stStatus').textContent=`Running ${st.i} / ${st.queue.length}...`; };

// ============================================================================
// ?tour=1 : a 60-second scripted showcase; any key or tap stops it. ?cover=1 : still hero shot.
// ============================================================================
Game.prototype.startTour=function(){ this.state='tour'; this.tour={t:0,step:-1}; this.tourInp=emptyInput(); this.hud.classList.add('hidden'); this.tourStart(0); };
Game.prototype.tourScene=function(arena,mode,seed){ this.match=new Match({arena,mode,seed,diff:[1,1],human:true}); const m=this.match; m.startDelay=0.01; m.players[0].shield=99; this.scene.setArena(m.A,this.scene.settings); this.scene.camMode='follow'; this.scene.snapCam=true; this.scene.slow=1; this.audio.setMood(CONFIG.arenas[arena].mood); this.hud.classList.remove('hidden'); this.updateTouchVisibility(); for(const [,b] of this.bubbles) b.remove(); this.bubbles.clear(); this.capturePrev(); document.getElementById('objective').textContent=CONFIG.modes[mode].desc; this.hide(); return m; };
const TOUR=[ // [start second, name]
  [0,'title'],[7,'charged'],[15,'freeze'],[22,'wall'],[30,'giant'],[40,'flag'],[48,'hill'],[54,'podium'],[60,'end'] ];
Game.prototype.tourStart=function(i){ const name=TOUR[i][1]; this.tour.step=i; this.tourStep=name; const S=this.scene; const inp=this.tourInp; Object.assign(inp,emptyInput());
  switch(name){
    case 'title': { this.state='tour'; this.bgMatch=new Match({arena:0,mode:0,seed:11,diff:[1,1],human:false}); this.bgMatch.startDelay=0.2; this.match=this.bgMatch; S.setArena(this.match.A,S.settings); S.camMode='orbit'; S.snapCam=true; this.audio.setMood('title'); this.show(`<h1 class="logo">${CONFIG.gameName}</h1><div class="tagline">${CONFIG.tagline}</div><div class="tagline" style="font-size:14px;opacity:.85">${this.T.tapToStart}</div>${this.creditHtml()}`); this.screen='tour'; break; }
    case 'charged': { const m=this.tourScene(0,0,21); const h=m.players[0]; h.x=-8; h.z=0; h.ammo=5; const r=m.players[3]; r.x=6; r.z=1; for(const q of m.players){ if(q!==h&&q!==r){ q.x=q.team===0?-16:16; q.z=(q.id%2?6:-6); } } this.tourCaption('Hold to charge a long throw'); break; }
    case 'freeze': { const m=this.match; const h=m.players[0]; h.ammo=5; const r=m.players[3]; r.frost=2; r.x=h.x+5.5; r.z=h.z; r.frozen=0; r.tourStill=true; r.vx=r.vz=0; this.tourCaption('Three frost points and they freeze!'); break; }
    case 'wall': { const m=this.match; const h=m.players[0]; h.ammo=5; h.aimx=1; h.aimz=0; this.tourCaption('Pack a snow wall - rivals can smash it'); break; }
    case 'giant': { const m=this.tourScene(1,0,33); const h=m.players[0]; h.x=-2.5; h.z=-1; h.aimx=1; h.aimz=0.1; for(const q of m.players){ if(q!==h){ q.x=q.team===0?-17:14; q.z=(q.id%3-1)*5; q.ammo=0; } } m.A.fresh.set(m.A.base); this.tourCaption('Roll a giant - it grows and rolls downhill on its own'); break; }
    case 'flag': { const m=this.tourScene(2,1,44); const h=m.players[0]; h.x=14; h.z=1.2; h.ammo=2; for(const q of m.players){ if(q!==h){ q.x=q.team===0?-10:-4; q.z=(q.id%3-1)*6; } } this.tourCaption('Flag Raid: steal the flag and run it home'); break; }
    case 'hill': { const m=this.tourScene(0,2,55); m.score[0]=92; m.score[1]=80; const h=m.players[0]; h.x=-2; h.z=0; for(const q of m.players){ if(q!==h){ q.x=q.team===0?-3:12; q.z=(q.id%3-1)*4; } } this.tourCaption('Cocoa Hill: hold the hill, points tick for the only team in it'); break; }
    case 'podium': { this.cup={i:5,wins:[3,2],results:[]}; this.showPodium(); this.scene.podiumZ=this.podium.z; this.state='tour'; const tap=document.createElement('div'); tap.className='tagline'; tap.style.cssText='position:absolute;bottom:calc(20px + var(--safe-b));left:50%;transform:translateX(-50%);font-size:14px'; tap.textContent=this.T.tapToStart; this.ui.firstElementChild.appendChild(tap); break; }
    case 'end': this.stopTour(); break;
  } };
Game.prototype.tourCaption=function(t){ this.toast(t,3.5); };
Game.prototype.tourInput=function(){ const inp=this.tourInp; const m=this.match; const name=this.tourStep; const h=m.players[0]; const t=this.tour.t-TOUR[this.tour.step][0]; inp.mx=inp.mz=0; inp.throw=false; inp.dodge=false; inp.scoop=false; inp.wall=false; inp.roll=false; inp.aimValid=true;
  const aimAt=(q)=>{ const dx=q.x-h.x, dz=q.z-h.z; const l=Math.hypot(dx,dz)||1; inp.ax=dx/l; inp.az=dz/l; };
  switch(name){
    case 'charged': { const r=m.players[3]; aimAt(r); if(t<1.2){ inp.mx=1; } else if(t<1.6) inp.scoop=true; else if(t<3.4) inp.throw=true; else if(t<4.6) inp.scoop=true; else if(t<6.2) inp.throw=true; break; }
    case 'freeze': { const r=m.players[3]; aimAt(r); if(t<0.5) inp.scoop=true; else if(t<0.55) inp.throw=true; else if(t>2.5&&t<2.55) inp.throw=true; else if(t>4.5) r.tourStill=false; break; }
    case 'wall': { inp.ax=1; inp.az=0; if(t<0.4) inp.scoop=true; else if(t<0.6) inp.wall=true; else if(t>1.5){ // rivals pelt the wall
      if(m.tick%40===0){ const w=m.walls.find(w=>w.alive); const r=m.players[4]; if(w&&r.alive){ r.x=w.x+7; r.z=w.z; r.ammo=5; const dx=w.x-r.x, dz=w.z-r.z, l=Math.hypot(dx,dz); r.aimx=dx/l; r.aimz=dz/l; m.throwBall(r,0.15); } } } if(t>2&&t<2.2) inp.dodge=true; if(t>3&&t<3.3) inp.mx=-0.5; break; }
    case 'giant': { if(t<0.3){ inp.ax=1; inp.az=0.1; } else if(t<0.5){ inp.roll=true; inp.ax=1; inp.az=0.1; } else if(t<6.5){ inp.mx=1; inp.mz=0.1; inp.ax=1; inp.az=0.1; } else if(t<6.7){ inp.roll=true; inp.ax=1; inp.az=0.1; } break; }
    case 'flag': { const f=m.flags[1]; if(h.carrying<0){ const dx=f.x-h.x, dz=f.z-h.z, l=Math.hypot(dx,dz)||1; inp.mx=dx/l; inp.mz=dz/l; inp.ax=dx/l; inp.az=dz/l; } else { const hx=m.A.flags[0][0], hz=m.A.flags[0][1]; const dx=hx-h.x, dz=hz-h.z, l=Math.hypot(dx,dz)||1; inp.mx=dx/l; inp.mz=dz/l; inp.ax=dx/l; inp.az=dz/l; if(t>3&&t<3.2) inp.dodge=true; } break; }
    case 'hill': { const hz=m.A.hillZone; const dx=hz.x-h.x, dz=hz.z-h.z, l=Math.hypot(dx,dz); if(l>1.5){ inp.mx=dx/l; inp.mz=dz/l; } const r=m.players[3]; aimAt(r); if(t>1.5&&m.tick%50<4&&h.ammo>0) inp.throw=true; else if(h.ammo<2) inp.scoop=true; break; }
  } return inp; };
Game.prototype.tourTick=function(dt){ const T=this.tour; T.t+=dt; const next=TOUR[T.step+1]; if(next&&T.t>=next[0]) this.tourStart(T.step+1); if(this.tourStep==='giant'&&this.match){ const g=this.match.giants[0]; if(g&&g.alive&&g.pusher<0){ this.scene.camMode='fixed'; this.scene.fixC=[g.x-9,7,g.z+6]; this.scene.fixT=[g.x+2,g.r,g.z]; } } };
Game.prototype.stopTour=function(){ this.tour=null; this.tourStep='stopped'; this.podium=null; this.hide(); this.bgMatch=null; this.showTitle(true); };
Game.prototype.startCover=function(){ this.state='cover'; const m=new Match({arena:2,mode:0,seed:77,diff:[1,1],human:true}); this.match=m; m.startDelay=0; m.started=true; this.scene.setArena(m.A,this.scene.settings); this.hud.classList.add('hidden');
  const h=m.players[0]; h.x=-1; h.z=-6; h.face=-0.6; h.aimx=0.57; h.aimz=-0.82; h.charge=0.85; h.ammo=5; const t1=m.players[1], t2=m.players[2]; t1.x=-4; t1.z=-8.5; t1.face=Math.PI; t1.aimx=-1; t1.aimz=0; t1.pushing=0; t2.x=-3.2; t2.z=-3; t2.face=-0.3; t2.scooping=true; t2.scoop=0.6; m.giants.push({x:-5.9,z:-8.5,y:0,vx:0,vz:0,r:1.2,pusher:1,lastPusher:1,team:0,alive:true,hp:5,rolled:0,spin:1,age:0,parked:false}); m.giants[0].y=m.A.height(-5.9,-8.5);
  const r=[m.players[3],m.players[4],m.players[5]]; r[0].x=3.5; r[0].z=-12.5; r[0].face=2.4; r[0].frost=2; r[1].x=2.8; r[1].z=-1.2; r[1].face=-2.5; r[1].frozen=2; r[2].x=-8; r[2].z=-11.5; r[2].face=0.6; r[2].charge=0.5; r[2].aimx=0.8; r[2].aimz=0.5;
  for(let i=0;i<3;i++) m.balls.push({x:0.2+i*0.9,y:2.1+i*0.2,z:-7.6-i*1.3,vx:6,vy:1,vz:-8,team:0,owner:0,charged:i===0,alive:true,life:3,sx:-1,sz:-6,charge:0.8});
  for(const p of m.players){ p.px=p.x; p.pz=p.z; p.y=m.A.height(p.x,p.z); } for(const b of m.balls){ b.px=b.x; b.py=b.y; b.pz=b.z; } m.giants[0].px=m.giants[0].x; m.giants[0].pz=m.giants[0].z;
  this.scene.camMode='fixed'; this.scene.fixC=[6.5,3.2,-9.5]; this.scene.fixT=[-1.5,1.2,-6]; this.scene.snapCam=true; this.scene.slow=0; this.acc=0;
  this.show(`<h1 class="logo" style="position:absolute;top:calc(6% + var(--safe-t));left:50%;transform:translateX(-50%) rotate(-3deg)">${CONFIG.gameName}</h1><div class="tagline" style="position:absolute;bottom:calc(8% + var(--safe-b));left:50%;transform:translateX(-50%);font-size:clamp(16px,2.6vw,30px)">${CONFIG.tagline}</div>`); this.screen='cover'; this.coverMatch=m; };
// cover: freeze the simulation but keep drawing
const _origFrame=Game.prototype.frame; Game.prototype.frame=function(now){ if(this.state==='cover'){ requestAnimationFrame(t=>this.frame(t)); const dt=0.016; this.updateCamera(dt,1); this.scene.updateParticles(dt); this.scene.build(this.match,1,dt,this); this.scene.drawArc(this.match.players[0]); this.R.render(dt); return; } _origFrame.call(this,now); };

window.addEventListener('load',()=>{ try{ window.FLURRY=new Game(); } catch(e){ document.getElementById('screens').innerHTML=`<div class="screen"><div class="card"><h2>Oh no, a snowdrift!</h2><p>This browser could not start WebGL2. Please try a current browser with hardware acceleration enabled.</p><p><small>${(e&&e.message)||e}</small></p></div></div>`; console.error(e); } });
