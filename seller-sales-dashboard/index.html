<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FAF4E6">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Thistle and Twine - Sales report</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23C0593A'/%3E%3Cpath d='M6 18c0-6 3-9 9-9 0 6-3 9-9 9z' fill='none' stroke='white' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{color-scheme:light;--bg:#FAF4E6;--card:#FFFDF8;--ink:#3B2F28;--muted:#6B5B50;--line:#E6DAC3;--soft:#F3EAD6;--terra:#C0593A;--terraText:#9A4023;--btn:#B04A2A;--btnText:#FFFFFF;--sage:#6F8F6B;--sageText:#4A6747;--focus:#9A4023;--good:#4A6747;--bad:#9A4023;--paper:#FFFFFF;--radius:14px;--hfont:Georgia,'Iowan Old Style','Palatino Linotype',Palatino,'Times New Roman',serif;--bfont:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1E1914;--card:#2A231C;--ink:#F3E9D6;--muted:#BFB09C;--line:#3F352A;--soft:#33291F;--terra:#E8946F;--terraText:#E8946F;--btn:#E8946F;--btnText:#1E1914;--sage:#A9C3A3;--sageText:#A9C3A3;--focus:#F2B896;--good:#A9C3A3;--bad:#F0A585;--paper:#2A231C}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--bfont);min-height:100vh;display:flex;flex-direction:column;overflow-wrap:anywhere}
h1,h2,h3{font-family:var(--hfont);font-weight:600;line-height:1.2;margin:0;letter-spacing:.005em}
h1{font-size:clamp(1.6rem,3.2vw,2.3rem)} h2{font-size:1.3rem} h3{font-size:1.08rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{width:100%;max-width:1180px;margin:0 auto;padding:0 20px}
main{flex:1;padding-bottom:28px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.muted{color:var(--muted)}
.small{font-size:.875rem}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:0 1px 2px rgba(59,47,40,.05)}
.card>h2,.card>.card-head h2{margin-bottom:2px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.stack>*+*{margin-top:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
/* buttons and fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-weight:600;font-size:.95rem;text-decoration:none;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--terra);background:var(--soft)}
.btn.primary{background:var(--btn);color:var(--btnText);border-color:var(--btn)}
.btn.primary:hover{filter:brightness(1.06);background:var(--btn)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--terraText)}
.btn.quiet:hover{background:var(--soft);border-color:var(--line)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{min-height:44px;padding:0 12px;font-size:.88rem}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--soft);border-color:var(--terra)}
.btn svg{width:18px;height:18px;flex:none}
.icon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
input[type=text],input[type=search],input[type=number],input[type=date],select,textarea{min-height:44px;width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}
textarea{min-height:110px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.85rem}
select{padding-right:8px}
label{font-weight:600;font-size:.92rem}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:500;min-height:44px;align-items:center}
.check input{width:22px;height:22px;accent-color:var(--btn);flex:none}
.radio{display:flex;gap:10px;align-items:center;min-height:44px;font-weight:500}
.radio input{width:20px;height:20px;accent-color:var(--btn);flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;background:var(--soft);border:1px solid var(--line);font-size:.85rem;font-weight:600}
.pill.terra{background:transparent;color:var(--terraText);border-color:var(--terra)}
/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{width:38px;height:38px;border-radius:11px;background:var(--terra);display:grid;place-items:center;flex:none}
.brand-mark svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brand h1{font-size:1.2rem}
.brand .sub{font-size:.8rem;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools select{width:auto;min-width:140px}
.menu{position:relative}
.menu>summary{list-style:none}
.menu>summary::-webkit-details-marker{display:none}
.menu-list{position:absolute;right:0;top:calc(100% + 6px);min-width:240px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:6px;box-shadow:0 10px 30px rgba(30,25,20,.18);z-index:30;display:flex;flex-direction:column}
.menu-list .btn{justify-content:flex-start;border-color:transparent;background:transparent}
.menu-list .btn:hover{background:var(--soft)}
/* drop screen */
.hero{padding:34px 0 10px;text-align:center}
.hero p.lead{max-width:640px;margin:10px auto 0;color:var(--muted);font-size:1.05rem}
.dropzone{margin:24px auto 0;max-width:760px;border:2px dashed var(--terra);border-radius:calc(var(--radius) + 6px);background:var(--card);padding:34px 22px;text-align:center;transition:background .15s,transform .15s}
.dropzone.over{background:var(--soft);transform:scale(1.01)}
.dropzone .bigicon{width:54px;height:54px;border-radius:50%;background:var(--soft);display:grid;place-items:center;margin:0 auto 12px;color:var(--terraText)}
.dropzone .bigicon svg{width:28px;height:28px}
.dropzone h2{margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.paste{max-width:760px;margin:18px auto 0;text-align:left}
.progress{height:12px;border-radius:99px;background:var(--soft);border:1px solid var(--line);overflow:hidden}
.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--terra),var(--sage));border-radius:99px;transition:width .12s}
.loading{max-width:760px;margin:20px auto 0}
.promises{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}
/* mapper */
.mapgrid{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:20px;align-items:start}
.fieldlist{display:grid;gap:14px}
.field{display:grid;gap:6px}
.field .lab{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.field .req{font-size:.75rem;color:var(--terraText);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.field .help{font-size:.82rem;color:var(--muted)}
.subopts{padding:10px 12px;border-radius:12px;background:var(--soft);border:1px solid var(--line);display:grid;gap:2px}
.reading{font-size:.88rem;color:var(--sageText);font-weight:600}
.callout{padding:12px 14px;border-radius:12px;border:1px solid var(--terra);background:var(--soft);font-size:.92rem}
.callout.ok{border-color:var(--sage)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--paper);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--soft);font-weight:700;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.asread{display:block;font-size:.75rem;color:var(--sageText);font-weight:600}
.tag{display:inline-block;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--btn);color:#fff;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
:root[data-theme="dark"] .tag{color:#1E1914}
td small.as{display:block;color:var(--sageText);font-weight:600;font-size:.74rem}
.previewcell{max-width:260px;white-space:pre-wrap}
/* banner */
.banner{background:var(--btn);color:#fff;border-radius:12px;padding:10px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-weight:600}
:root[data-theme="dark"] .banner{color:#1E1914}
.banner .btn{background:rgba(0,0,0,.18);border-color:rgba(255,255,255,.6);color:inherit;min-height:44px}
:root[data-theme="dark"] .banner{background:var(--terra)}
:root[data-theme="dark"] .banner .btn{background:rgba(255,255,255,.18);border-color:rgba(30,25,20,.5)}
.banner b{letter-spacing:.08em}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tile{padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .lab{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tile .val{font-family:var(--hfont);font-size:1.75rem;line-height:1.15;font-variant-numeric:tabular-nums;font-weight:600}
.tile .val.none{font-size:1.05rem;color:var(--muted);font-family:var(--bfont);font-weight:600;padding:6px 0}
.tile .chg{font-size:.84rem;font-weight:700;display:flex;align-items:center;gap:4px}
.tile .chg svg{width:15px;height:15px}
.chg.good{color:var(--good)} .chg.bad{color:var(--bad)} .chg.flat{color:var(--muted)}
.tile .desc{font-size:.78rem;color:var(--muted);line-height:1.35;margin-top:2px}
/* what changed */
.changed ol{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.changed li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.changed .dot{width:10px;height:10px;border-radius:50%;background:var(--terra);margin-top:.5em}
.changed li:nth-child(even) .dot{background:var(--sage)}
.changed .links{display:inline-flex;gap:14px;flex-wrap:wrap}
.linkbtn{background:none;border:0;padding:0;color:var(--terraText);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px;min-height:44px;font-size:.9rem}
/* goal */
.goalbar{height:22px;border-radius:99px;background:var(--soft);border:1px solid var(--line);overflow:hidden;margin:10px 0 8px}
.goalbar>i{display:block;height:100%;background:var(--terra);border-radius:99px}
.goalform{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:end;margin-top:12px}
.goalform select{min-width:110px}
/* charts */
.charts{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.charts .wide{grid-column:1/-1}
.chartbody{min-height:120px;position:relative}
.chartbody svg{display:block;width:100%;overflow:visible}
.chartbody [role=group]{outline-offset:4px}
.chart-sum{font-size:.88rem;color:var(--muted);margin:2px 0 8px}
.legend{display:flex;gap:14px;font-size:.82rem;color:var(--muted);flex-wrap:wrap;margin-bottom:4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.a{fill:var(--terra);background:var(--terra)} .b{fill:var(--sage);background:var(--sage)}
.axis{stroke:var(--line);stroke-width:1} .grid-l{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.tick{font-size:11px;fill:var(--muted);font-family:var(--bfont)}
.vlab{font-size:11px;fill:var(--ink);font-weight:600;font-family:var(--bfont)}
.bar-on{filter:brightness(1.12);stroke:var(--ink);stroke-width:1.5}
.cell-on{stroke:var(--ink);stroke-width:2}
.hit{fill:transparent;cursor:crosshair}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:10px;font-size:.84rem;line-height:1.35;max-width:260px;box-shadow:0 6px 18px rgba(0,0,0,.25);opacity:0;transition:opacity .08s}
#tip.on{opacity:1}
#tip b{display:block;font-family:var(--hfont);font-size:.95rem}
.split{display:grid;gap:10px}
.splitrow{display:grid;grid-template-columns:minmax(80px,1fr) 3fr auto;gap:10px;align-items:center;font-size:.9rem}
/* items */
.toolbar{display:grid;grid-template-columns:minmax(180px,1fr) auto auto auto;gap:10px;align-items:center;margin-bottom:10px}
th button.sort{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center;font-weight:700;min-height:44px;padding:0 2px}
th button.sort:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
th[aria-sort="ascending"] button::after{content:"\25B2";font-size:.6rem}
th[aria-sort="descending"] button::after{content:"\25BC";font-size:.6rem}
td.name button{all:unset;cursor:pointer;color:var(--terraText);font-weight:700;text-decoration:underline;text-underline-offset:3px;display:inline-flex;align-items:center;min-height:44px}
td.name button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.trend{font-weight:700}
.trend.up{color:var(--good)} .trend.down{color:var(--bad)} .trend.steady{color:var(--muted)}
.pager{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:10px;flex-wrap:wrap}
.chip{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;background:var(--soft);border:1px solid var(--terra);margin-bottom:10px;flex-wrap:wrap}
details.skip>summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
/* dialogs and toast */
dialog{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);color:var(--ink);padding:0;width:min(760px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(30,25,20,.55)}
dialog .dhead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}
dialog .dbody{padding:16px 20px 20px;overflow:auto;max-height:calc(90vh - 70px)}
dialog dl{margin:0;display:grid;gap:12px}
dialog dt{font-family:var(--hfont);font-weight:600}
dialog dd{margin:2px 0 0;color:var(--muted)}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:70;display:grid;gap:8px;width:min(560px,92vw)}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.warn{background:var(--btn);color:var(--btnText)}
footer.foot{border-top:1px solid var(--line);padding:16px 0 22px;font-size:.85rem;color:var(--muted);text-align:center}
#caption{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:14px 26px;border-radius:18px;font-family:var(--hfont);font-weight:600;line-height:1.25;text-align:center;max-width:min(1100px,92vw);box-shadow:0 12px 36px rgba(0,0,0,.35)}
.tour-hl{outline:4px solid var(--terra)!important;outline-offset:4px;border-radius:var(--radius);transition:outline-color .2s}
/* cover */
.cover{box-sizing:border-box;min-height:100vh;display:grid;grid-template-columns:5fr 7fr;gap:48px;align-items:center;padding:56px 64px;max-width:1920px;margin:0 auto;width:100%}
.cover h1{font-size:clamp(2.4rem,4.2vw,4rem);margin:14px 0 18px}
.cover .lead{font-size:1.3rem;color:var(--muted);max-width:30ch}
.cover .win{padding:22px;display:grid;gap:16px;box-shadow:0 24px 60px rgba(59,47,40,.18)}
.cover .tiles{grid-template-columns:repeat(4,1fr)}
.cover .tile .val{font-size:1.5rem}
.cover .lead~ul{list-style:none;padding:0;margin:26px 0 0;display:grid;gap:10px;font-size:1.1rem}
.cover .lead~ul li{display:flex;gap:10px;align-items:center}
.cover .lead~ul li::before{content:"";width:12px;height:12px;border-radius:4px;background:var(--sage)}
.cover .lead~ul li:nth-child(odd)::before{background:var(--terra)}
body.is-cover footer.foot{display:none}
body.is-cover main{padding-bottom:0}
.cover .win .tile .desc{display:none}
.cover .win .chartbody svg{max-height:230px}
.cover .changed ol{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:8px}
/* print sheet */
#sheet{display:none}
body.preview-sheet{background:#d9d0bd}
body.preview-sheet>:not(#sheet):not(#toasts):not(.sheetbar):not(#caption){display:none!important}
body.preview-sheet #sheet{display:block;margin:20px auto;width:min(210mm,96vw);background:#fff;color:#000;padding:12mm;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.sheetbar{display:none}
body.preview-sheet .sheetbar{display:flex;gap:10px;justify-content:center;padding:14px;flex-wrap:wrap;position:sticky;top:0;z-index:5;background:var(--bg)}
#sheet,#sheet *{color:#000;background:transparent}
#sheet{font:11pt/1.3 Georgia,'Times New Roman',serif}
#sheet h1{font-size:18pt;margin:0 0 2pt} #sheet h2{font-size:12.5pt;margin:7pt 0 3pt;border-bottom:1px solid #000;padding-bottom:2pt}
#sheet .meta{font-size:11pt}
#sheet .sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5pt}
#sheet .sbox{border:1px solid #000;padding:4pt 6pt}
#sheet .sbox b{display:block;font-size:13pt}
#sheet .sbox span{font-size:11pt}
#sheet table{font-size:11pt;border:0} #sheet th,#sheet td{padding:2pt 5pt;border-bottom:1px solid #999;background:transparent} #sheet th{border-bottom:1.5px solid #000}
#sheet ol{margin:0;padding-left:16pt} #sheet li{margin-bottom:1pt}
#sheet .sfoot{margin-top:6pt;border-top:1px solid #000;padding-top:4pt;font-size:11pt;display:flex;justify-content:space-between;gap:10pt;flex-wrap:wrap}
#sheet .tablewrap{border:0;border-radius:0;background:transparent}
#sheet .sfine{font-size:11pt;margin-top:3pt}
#sheet svg text{fill:#000;font-family:Georgia,serif}
@page{margin:11mm}
@media print{
  html,body{background:#fff!important}
  body>:not(#sheet){display:none!important}
  #sheet{display:block!important;margin:0!important;width:auto!important;padding:0!important;box-shadow:none!important}
}
/* responsive */
@media (max-width:1000px){.tiles{grid-template-columns:repeat(2,1fr)}.mapgrid{grid-template-columns:1fr}.cover{grid-template-columns:1fr}}
@media (max-width:899px){.charts{grid-template-columns:1fr}}
@media (max-width:699px){
  .topbar{position:static}
  .wrap{padding:0 14px}
  .grid2,.toolbar,.goalform{grid-template-columns:1fr}
  .tiles{gap:10px}.tile{padding:12px}.tile .val{font-size:1.45rem}
  .topbar .wrap{align-items:flex-start}
  .tools select{flex:1;min-width:0}
  .card{padding:16px}
  .menu-list{position:fixed;left:16px;right:16px;top:auto;min-width:0}
}
@media (max-width:340px){.tiles{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* items table: all twelve columns fit at 1366 px, one line per value, 44 px rows */
#itemsTable{font-size:.85rem}
#itemsTable th,#itemsTable td{padding:0 6px;vertical-align:middle;white-space:nowrap}
#itemsTable td.name{padding:0 6px;white-space:normal;min-width:150px;max-width:250px}
#itemsTable th{height:44px}
[hidden]{display:none!important}
td.nw{white-space:nowrap}
td.previewcell{min-width:110px}#prevWrap table{min-width:640px}.field select,.field input{align-self:start}

/* numbers and labels are never split in the middle (the page-wide overflow-wrap would do it) */
.tile .val,.tile .chg span,.tile .lab{overflow-wrap:normal}
.tile .chg span:first-of-type{white-space:nowrap}
#sheet,#sheet .sbox,#sheet .sbox *{overflow-wrap:normal}
#sheet td,#sheet th{overflow-wrap:break-word}
#sheet .sbox b,#sheet .sbox span{white-space:nowrap}
@media screen and (max-width:699px){
  body.preview-sheet #sheet{width:calc(100vw - 20px);padding:14px 12px;margin:10px auto}
  #sheet .sgrid{grid-template-columns:repeat(2,1fr)}
  #caption{left:16px;right:16px;bottom:16px;transform:none;max-width:none;font-size:24px!important;padding:10px 14px;border-radius:14px}

  /* ---------- the tour: a silent showcase on the sample data ---------- */
  async function runTour() {
    const mem = {}; S.store = TT.makeStore({ getItem: (k) => (k in mem ? mem[k] : null), setItem: (k, v) => { mem[k] = String(v); }, removeItem: (k) => { delete mem[k]; } });
    S.settings = TT.defaultSettings(); S.maps = {};
    const tour = { stopped: false }; window.__tour = tour;
    const cap = h('div', { id: 'caption', role: 'status', style: 'font-size:' + C.tour.captionPx + 'px', hidden: true });
    document.body.append(cap);
    const stop = (e) => { if (e && e.isTrusted === false) return; tour.stopped = true; cap.remove(); document.querySelectorAll('.tour-hl').forEach((n) => n.classList.remove('tour-hl')); window.removeEventListener('keydown', stop, true); window.removeEventListener('pointerdown', stop, true); };
    window.addEventListener('keydown', stop, true); window.addEventListener('pointerdown', stop, true);
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const wait = (ms) => new Promise((res) => { const t0 = performance.now(); const iv = setInterval(() => { if (tour.stopped || performance.now() - t0 >= ms) { clearInterval(iv); res(); } }, 40); });
    const say = (t) => { cap.textContent = t; cap.hidden = false; };
    const hl = (el) => { document.querySelectorAll('.tour-hl').forEach((n) => n.classList.remove('tour-hl')); if (el) el.classList.add('tour-hl'); };
    const phone = () => window.innerWidth < 700;
    const go = (el) => { if (!el) return; if (phone()) el.style.scrollMarginTop = '10px'; el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: phone() ? 'start' : 'center' }); };
    const st = C.tour.steps;
    S.screen = 'drop'; render();
    // 1 the file drop
    say(T('tour_drop')); hl($('#dropzone')); await wait(st.drop * 0.55); if (tour.stopped) return;
    say(T('tour_sample')); hl($('#sampleBtn')); await wait(st.drop * 0.45); if (tour.stopped) return;
    // 2 the mapper (the sample goes through the same route as a real file)
    hl(null);
    const csv = TT.sampleCsv(); S.sample = false;
    await ingest(csv, T('sample_name'), { fallback: false, t0: performance.now() });
    if (tour.stopped) return;
    say(T('tour_mapper')); hl($('.mapgrid')); await wait(st.mapper * 0.55); if (tour.stopped) return;
    say(T('tour_mapper2')); hl($('#prevWrap')); await wait(st.mapper * 0.45); if (tour.stopped) return;
    hl(null);
    await L_buildSample(); if (tour.stopped) return;
    window.scrollTo(0, 0);
    // 3 the top row
    say(T('tour_top')); go($('.tiles')); hl($('.tiles')); await wait(st.topRow); if (tour.stopped) return;
    // 4 what changed
    say(T('tour_changed')); go($('#changed')); hl($('#changed')); await wait(st.changed); if (tour.stopped) return;
    // 5 a chart hover
    hl(null); say(T('tour_hover')); go($('#chart_trend')); await wait(700); if (tour.stopped) return;
    const hits = [...document.querySelectorAll('#cb_trend .hit')];
    for (const k of [3, 6, 9, 11]) { const el = hits[Math.min(k, hits.length - 1)]; if (!el) continue; const r = el.getBoundingClientRect(); el.dispatchEvent(new MouseEvent('mousemove', { bubbles: true, clientX: r.left + r.width / 2, clientY: r.top + 90 })); await wait((st.hover - 700) / 4); if (tour.stopped) return; }
    hideTip(); hits.forEach((x) => x.dispatchEvent(new MouseEvent('mouseleave')));
    // 6 sorting and searching the items
    say(T('tour_items')); go($('#items')); hl($('#items')); await wait(st.items * 0.25); if (tour.stopped) return;
    const sortBtn = $('#itemsBody button[data-col="units"]'); if (sortBtn) sortBtn.click();
    await wait(st.items * 0.25); if (tour.stopped) return;
    const box = $('#itemSearch'); if (box) { for (const w of ['pr', 'pri', 'prin', 'print']) { box.value = w; box.dispatchEvent(new Event('input', { bubbles: true })); await wait(180); if (tour.stopped) return; } }
    await wait(st.items * 0.5 - 720); if (tour.stopped) return;
    if (box) { box.value = ''; box.dispatchEvent(new Event('input', { bubbles: true })); }
    // 7 the goal bar
    say(T('tour_goal')); go($('#goal')); hl($('#goal')); await wait(st.goal); if (tour.stopped) return;
    // 8 the print view
    hl(null); say(T('tour_print')); openSheet(); await wait(st.print); if (tour.stopped) return;
    closeSheet(); window.scrollTo(0, 0);
    // 9 light and dark
    say(T('tour_light')); setTheme('light'); await wait(st.themes * 0.3); if (tour.stopped) return;
    say(T('tour_dark')); setTheme('dark'); await wait(st.themes * 0.4); if (tour.stopped) return;
    say(T('tour_light')); setTheme('light'); await wait(st.themes * 0.3);
    stop(); tour.done = true;
  }
  async function L_buildSample() { await startBuild(); S.sample = true; S.sampleGoal = true; S.settings.goal = { metric: C.sample.goal.metric, amount: C.sample.goal.amount * Math.pow(10, S.ds.cur.digits) }; S.cache = null; render(); }

  /* ---------- the self test page ---------- */
  function runSelfTestPage() {
    buildShell(); S.store = TT.makeStore({ getItem: () => null, setItem() {}, removeItem() {} });
    const root = document.documentElement; const tokens = C.look.light; for (const k of Object.keys(tokens)) root.style.setProperty('--' + k, tokens[k]);
    root.dataset.theme = 'light';

      h('h2', { text: T('st_title') }), h('p', { id: 'stLine', class: res.rows.every((r) => r.ok) ? 'reading' : '', style: 'font-weight:700;font-size:1.1rem', text: line }),
      h('div', { class: 'tablewrap' }, h('table', { id: 'stTable' }, h('thead', null, h('tr', null, ['#', T('st_group'), T('st_test'), T('st_expected'), T('st_got'), T('st_result')].map((x) => h('th', { text: x })))),
        h('tbody', null, res.rows.map((r, i) => h('tr', { class: r.ok ? 'ok' : 'bad' }, h('td', { text: String(i + 1) }), h('td', { text: r.group }), h('td', { text: r.name }), h('td', { class: 'previewcell', text: r.expected }), h('td', { class: 'previewcell', text: r.got }), h('td', { text: r.ok ? 'PASS' : 'FAIL', style: 'font-weight:700;color:' + (r.ok ? 'var(--good)' : 'var(--bad)') }))))))));

  }

  /* ---------- boot ---------- */
  function boot() {
    document.title = C.shop.short + ' · ' + T('title_suffix');
    if (MODE === 'selftest') { runSelfTestPage(); return; }
    buildShell();
    // drag and drop anywhere on the page loads the file instead of letting the browser open it
    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('drop', (e) => { if (e.defaultPrevented) return; e.preventDefault(); const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (f) handleFile(f); });

    initSettings();
    if (MODE === 'cover') {
      S.settings.theme = qs.get('theme') === 'dark' ? 'dark' : 'light'; S.settings.period = C.defaultPeriod;
      S.store = TT.makeStore({ getItem: () => null, setItem() {}, removeItem() {} }); S.settings.remember = false;
      const r = TT.loadText(TT.sampleCsv(), { fileName: T('sample_name'), localeOrder: 'dmy' });
      S.ds = r.ds; S.sample = true; S.fmt = TT.makeFmt(TT.currencyDisplay(r.ds)); S.screen = 'dash'; S.cache = null;

  }
  window.__ttUI = { itemsTableDom, tilesDom, tableDom: tableEl, S, render, view, loadSampleNow, handleFile, handleText, openHelp, openSheet, closeSheet, setTheme, openItem, exportItems, exportMonths, exportMapping, exportSkipped, saveRows, forgetAll, persist, confirmBox, note };
