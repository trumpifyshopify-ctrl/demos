<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ff7a3d">
<title>Sizzlebury</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2b1d14;color:var(--dark);font-family:ui-rounded,"Arial Rounded MT Bold","Nunito","Varela Round","Segoe UI",system-ui,sans-serif;font-weight:700;user-select:none;-webkit-user-select:none;touch-action:none}
:root{--accent:#ff7a3d;--dark:#4a2c1a;--paper:#fff6e6;--u:clamp(11px,1.9vmin + 4px,20px)}
body{font-size:var(--u)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#game,#ui,#fxl{position:fixed;inset:0;overflow:hidden}
#game{pointer-events:none}#game.off{display:none}
#fxl{pointer-events:none;z-index:6}
#ui{z-index:8;pointer-events:none;display:flex;align-items:center;justify-content:center}
#ui>*{pointer-events:auto}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.btn{background:var(--accent);color:#fff;border-radius:999px;padding:.55em 1.3em;font-size:1.05em;box-shadow:0 .22em 0 #c2501c,0 .4em .7em rgba(60,25,5,.3);transition:transform .08s;white-space:nowrap;text-shadow:0 1px 0 rgba(120,50,10,.5)}
.btn:hover{transform:translateY(-1px) scale(1.03)}.btn:active{transform:translateY(.15em);box-shadow:0 .07em 0 #c2501c}
.btn.alt{background:var(--paper);color:var(--dark);box-shadow:0 .22em 0 #d8c3a0,0 .4em .7em rgba(60,25,5,.25);text-shadow:none}
.btn.sm{font-size:.85em;padding:.4em 1em}.btn[disabled]{filter:grayscale(.8);opacity:.6;cursor:default}
.btn.focus,.kfocus{outline:3px solid #2fb5a8;outline-offset:2px}
/* HUD */
#hud{position:absolute;left:0;right:0;top:0;display:flex;gap:.5em;align-items:center;padding:calc(.4em + env(safe-area-inset-top)) .6em .4em;pointer-events:none;flex-wrap:nowrap}
#hud>*{pointer-events:auto}
.pill{background:rgba(255,246,230,.95);border-radius:999px;padding:.3em .8em;box-shadow:0 .15em 0 rgba(74,44,26,.25);display:flex;align-items:center;gap:.4em;white-space:nowrap;min-height:2.2em}
#bPause{width:2.4em;height:2.4em;border-radius:50%;background:var(--paper);box-shadow:0 .15em 0 rgba(74,44,26,.25);font-size:1em;flex:none}
#hDay{flex:0 1 auto;overflow:hidden;text-overflow:ellipsis}
#hCoin{flex:1 1 9em;min-width:7em;max-width:17em;position:relative;overflow:hidden}
#hCoin .bar,#hTime .bar{position:absolute;left:0;top:0;bottom:0;background:#ffd98a;z-index:0;border-radius:999px 0 0 999px}
#hCoin.met .bar{background:#a6e39a}#hCoin>*:not(.bar),#hTime>*:not(.bar):not(.rz){position:relative;z-index:1}
.coin{display:inline-block;width:1.05em;height:1.05em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a8,#ffc928 55%,#d99a0c);box-shadow:0 0 0 .1em #b77a08;flex:none}
#hTime{flex:1 1 7em;min-width:5em;max-width:15em;position:relative;overflow:hidden;justify-content:center}
#hTime .bar{background:#bfe6fa}#hTime .rz{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,rgba(255,122,61,.55) 0 .35em,rgba(255,180,90,.55) .35em .7em);z-index:0}
#hTips{flex:none}
#combo{position:absolute;right:.7em;top:calc(3.6em + env(safe-area-inset-top));background:linear-gradient(#ffd23f,#ff7a1a);color:#fff;border-radius:1em;padding:.25em .8em;font-size:1.25em;text-shadow:0 1px 0 #a33c00;box-shadow:0 0 1em #ff9a2e;transform:scale(0);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
#combo.on{transform:scale(1)}#combo.bump{animation:bump .3s}
@keyframes bump{40%{transform:scale(1.35) rotate(-4deg)}}
#rushB{position:absolute;left:50%;top:40%;transform:translate(-50%,0) scale(0);background:var(--accent);color:#fff;font-size:1.9em;padding:.25em 1em;border-radius:999px;box-shadow:0 .2em 0 #c2501c,0 0 1.2em rgba(255,150,60,.8);white-space:nowrap;text-shadow:0 2px 0 #a33c00;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
#rushB.on{transform:translate(-50%,0) scale(1)}
#queue{position:absolute;left:50%;bottom:calc(.5em + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:.3em;background:rgba(74,44,26,.45);padding:.3em .5em;border-radius:999px}
#queue i{width:.7em;height:.7em;border-radius:50%;background:rgba(255,255,255,.35)}#queue i.on{background:#ffd23f;box-shadow:0 0 .4em #ffd23f}
#bUndo{position:absolute;right:.7em;bottom:calc(.6em + env(safe-area-inset-bottom));pointer-events:auto;display:none}
.lefty #bUndo{right:auto;left:.7em}#bUndo.on{display:block}
/* hotspots */
.spot{position:absolute;pointer-events:auto;border-radius:22%;cursor:pointer;touch-action:none}
.spot.cur{box-shadow:0 0 0 3px #fff,0 0 0 6px #2fb5a8;z-index:3}
.spot.hint::after{content:"";position:absolute;inset:-6px;border-radius:26%;border:4px solid #fff;box-shadow:0 0 0 3px var(--accent),0 0 1.2em #ffd23f;animation:pulse .8s infinite alternate}
@keyframes pulse{to{transform:scale(1.12);opacity:.75}}
.spot .ring{position:absolute;left:50%;top:50%;width:2.5em;height:2.5em;margin:-1.25em;border-radius:50%;display:none;-webkit-mask:radial-gradient(circle,transparent 52%,#000 54%);mask:radial-gradient(circle,transparent 52%,#000 54%);filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.spot .tag{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:1.25em;color:#fff;text-shadow:0 0 3px #000,0 1px 2px #000;display:none;line-height:1}
.spot .key{position:absolute;left:2px;bottom:2px;font-size:.7em;background:rgba(74,44,26,.8);color:#fff;border-radius:.4em;padding:0 .35em;display:none}
.keys .spot .key{display:block}
.spot .mk{position:absolute;right:2px;top:2px;font-size:.72em;background:#fff;color:#222;border:2px solid #222;border-radius:.4em;padding:0 .3em;display:none;line-height:1.2}
.spot .ico{position:absolute;left:50%;bottom:-.5em;width:1.7em;height:1.7em;margin-left:-.85em;background:#fff;border-radius:.45em;border:2px solid var(--dark);padding:1px;pointer-events:none;box-shadow:0 2px 3px rgba(0,0,0,.3)}.portrait .spot .ico{width:1.5em;height:1.5em;margin-left:-.75em}
#ghost{position:absolute;width:3em;height:3em;margin:-1.5em;pointer-events:none;display:none;z-index:9;filter:drop-shadow(0 4px 4px rgba(0,0,0,.4))}
/* order bubbles */
.bub{position:absolute;transform:translate(-50%,-100%) scale(0);transform-origin:50% 100%;background:#fff;border:3px solid var(--dark);border-radius:1em;padding:.3em .35em;display:flex;flex-direction:column;align-items:center;gap:.2em;transition:transform .18s cubic-bezier(.3,1.5,.5,1);box-shadow:0 .2em .5em rgba(40,20,5,.3);pointer-events:none}
.bub.on{transform:translate(-50%,-100%) scale(1)}
.bub::after{content:"";position:absolute;left:50%;bottom:-.62em;margin-left:-.45em;border:.45em solid transparent;border-top-color:var(--dark);border-bottom:0}
.bub.ok{border-color:#2f9e44;box-shadow:0 0 0 3px #b8f0b0,0 .2em .6em rgba(40,20,5,.3)}.bub.ok::after{border-top-color:#2f9e44}
.bub .top{display:flex;align-items:center;gap:.25em}
.bub .pr{width:2.1em;height:2.1em;border-radius:50%;position:relative;flex:none}
.bub .pr img{position:absolute;inset:.22em;width:calc(100% - .44em);height:calc(100% - .44em);border-radius:50%;background:#fff}
.bub .nm{font-size:.68em;max-width:7.5em;line-height:1.05;white-space:normal;text-align:left}
.bub .hearts{font-size:.62em;color:#e0457f;letter-spacing:.05em;white-space:nowrap}
.bub .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:.2em;max-width:11em}
.chip{display:flex;background:#fff1d6;border-radius:.5em;padding:.1em .15em;position:relative}
.chip.done{background:#c9f2c0}
.chip img{width:1.55em;height:1.55em;display:block}
.portrait .bub{padding:.2em;border-width:2px}.portrait .bub .chips{max-width:5.4em}.portrait .chip img{width:1.25em;height:1.25em}.portrait .bub .pr{width:1.8em;height:1.8em}.portrait .bub .nm{display:none}
.flt{position:absolute;transform:translate(-50%,-50%);font-size:1.4em;color:#fff;text-shadow:0 2px 0 var(--dark),0 0 4px var(--dark);animation:flt 1.1s ease-out forwards;white-space:nowrap;pointer-events:none}
.flt.heart{color:#ff5d96;font-size:1.8em}.flt.bad{color:#ffd0c4}
@keyframes flt{0%{opacity:0;margin-top:.4em}15%{opacity:1}100%{opacity:0;margin-top:-3em}}
.nomotion .flt{animation-duration:.8s}
#toast{position:fixed;left:50%;bottom:17%;transform:translate(-50%,1em);background:rgba(74,44,26,.92);color:#fff;border-radius:999px;padding:.4em 1.1em;z-index:7;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:92vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.95em}
#toast.on{opacity:1;transform:translate(-50%,0)}
#tut{position:fixed;left:50%;bottom:calc(2em + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(34em,92vw);background:var(--paper);border:3px solid var(--dark);border-radius:1em;padding:.5em .9em;z-index:7;display:none;text-align:center;box-shadow:0 .3em .8em rgba(40,20,5,.35);pointer-events:none;line-height:1.25}
#tut.on{display:block}
#tourTag{position:fixed;left:50%;bottom:.5em;transform:translateX(-50%);background:rgba(74,44,26,.8);color:#fff;border-radius:999px;padding:.25em .9em;font-size:.8em;z-index:12;display:none;white-space:nowrap;pointer-events:none}
/* screens */
.dim{position:absolute;inset:0;background:rgba(48,26,12,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.card{position:relative;background:var(--paper);border-radius:1.4em;padding:1em 1.2em;box-shadow:0 .5em 0 rgba(74,44,26,.35),0 1em 2.5em rgba(30,12,2,.45);max-width:min(46em,94vw);max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;gap:.6em;border:3px solid var(--dark)}
.card h2{margin:0;font-size:1.5em;text-align:center;color:var(--accent);text-shadow:0 2px 0 #fff,0 3px 0 rgba(74,44,26,.25)}
.card .body{overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:.2em;min-height:0}
.row{display:flex;gap:.6em;justify-content:center;flex-wrap:wrap;align-items:center}
.wide{width:min(46em,94vw)}
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:1em 0 1em 4vw;gap:.5em;pointer-events:none}
#title>*{pointer-events:auto}
#logo{font-size:clamp(34px,12vmin,120px);line-height:.95;margin:0;color:#fff7e0;letter-spacing:.01em;text-shadow:0 .05em 0 var(--accent),0 .1em 0 #c2501c,0 .16em 0 var(--dark),0 .22em .3em rgba(40,20,5,.5);white-space:nowrap;transform-origin:0 50%}
#logo span{display:inline-block;animation:siz 1.4s ease-in-out infinite}
@keyframes siz{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-.045em) rotate(-2deg)}50%{transform:translateY(.02em) rotate(1.5deg)}}
.nomotion #logo span{animation:none}
#tagl{font-size:1.05em;color:#fff;text-shadow:0 2px 0 var(--dark),0 0 6px rgba(40,20,5,.6);margin:.5em 0 .6em .2em}.portrait #tagl{text-align:center;margin:.6em 0 0}
#menu{display:flex;flex-direction:column;gap:.55em;align-items:stretch;min-width:13em}
#menu .btn{text-align:center}
#menu .two{display:flex;gap:.5em}#menu .two .btn{flex:1}
#credit{position:absolute;right:.8em;bottom:.5em;font-size:.72em;color:#fff;text-shadow:0 1px 2px #000;opacity:.9}
#title.in #logo{animation:logoIn .7s cubic-bezier(.3,1.5,.5,1) both}#title.in #menu,#title.in #tagl{animation:fadeUp .5s .3s both}
@keyframes logoIn{from{transform:scale(0) rotate(-8deg)}}@keyframes fadeUp{from{opacity:0;transform:translateY(1em)}}
.portrait #title{align-items:center;justify-content:space-between;padding:calc(1.6em + env(safe-area-inset-top)) 1em 2.4em}
.portrait #logo{transform-origin:50% 50%}.portrait #menu{display:grid;grid-template-columns:1fr 1fr;width:min(24em,92vw)}.portrait #menu .big{grid-column:1/3}.portrait #menu .two{display:contents}
.short #menu{display:grid;grid-template-columns:1fr 1fr;gap:.4em}.short #menu .big{grid-column:1/3}.short #menu .two{display:contents}.short #logo{font-size:clamp(30px,15vmin,80px)}
#cover{position:absolute;left:4vw;top:6vh;pointer-events:none}#cover #logo{font-size:clamp(40px,15vmin,150px)}#cover #tagl{font-size:clamp(14px,3.4vmin,34px)}
/* map */
.loc{background:#fff;border-radius:1em;padding:.5em .7em;margin-bottom:.6em;border:2px solid #ecd9b8}
.loc h3{margin:0 0 .3em;font-size:1em;display:flex;justify-content:space-between;gap:.5em;flex-wrap:wrap}.loc h3 small{font-weight:600;opacity:.7}
.days{display:grid;grid-template-columns:repeat(10,1fr);gap:.35em}
.portrait .days{grid-template-columns:repeat(5,1fr)}
.dayb{background:#ffe9c2;border-radius:.7em;padding:.25em 0 .15em;text-align:center;box-shadow:0 .15em 0 #e2c690;min-width:0}
.dayb b{display:block;font-size:1.1em}.dayb s{display:block;text-decoration:none;font-size:.62em;letter-spacing:-.05em;color:#d9b77c}.dayb s i{font-style:normal}.dayb s i.on{color:#ff9d00;text-shadow:0 0 2px #fff}
.dayb.lock{background:#e9e2d6;color:#aaa;box-shadow:none;cursor:default}.dayb.next{background:var(--accent);color:#fff;box-shadow:0 .15em 0 #c2501c;animation:pulse .9s infinite alternate}
.dayb.next s{color:#ffc9a8}
/* shop, book */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(13.5em,1fr));gap:.6em}
.it{background:#fff;border-radius:1em;padding:.55em .7em;border:2px solid #ecd9b8;display:flex;flex-direction:column;gap:.25em;font-size:.92em}
.it h4{margin:0;font-size:1.05em}.it p{margin:0;font-weight:600;font-size:.86em;opacity:.85;line-height:1.25}
.it .pips i{display:inline-block;width:1.1em;height:.5em;border-radius:.3em;background:#ecd9b8;margin-right:.2em}.it .pips i.on{background:#2fb5a8}
.it.bought{animation:bought .6s}@keyframes bought{30%{transform:scale(1.07);box-shadow:0 0 1.5em #ffd23f}}
.icons{display:flex;gap:.15em;flex-wrap:wrap;align-items:center}.icons img{width:1.7em;height:1.7em}.icons .plus{opacity:.5;margin:0 .1em}
.tabs{display:flex;gap:.4em;justify-content:center}.tabs .btn{font-size:.9em}
.hearts{color:#e0457f;letter-spacing:.1em}.hearts i{font-style:normal;color:#e6d5c0}
.face{width:2.6em;height:2.6em;border-radius:50%;background:#fff;border:2px solid #ecd9b8;flex:none}
/* settings */
.set{display:grid;grid-template-columns:1fr auto;gap:.5em .8em;align-items:center}
.set label{font-size:.95em}.seg{display:flex;gap:.25em;flex-wrap:wrap;justify-content:flex-end}.seg .btn{font-size:.8em;padding:.35em .8em}.seg .btn:not(.sel){background:#ecdcc0;color:var(--dark);box-shadow:0 .2em 0 #cdb991;text-shadow:none}
input[type=range]{width:9em;accent-color:var(--accent);touch-action:pan-x}
/* end card */
.stars{display:flex;justify-content:center;gap:.5em}.star{text-align:center;font-size:.72em;width:7em;line-height:1.1}
.star b{display:block;font-size:3.6em;line-height:1;color:#e3d3b8;transform:scale(.6);transition:transform .4s cubic-bezier(.3,1.8,.5,1),color .2s}
.star.on b{color:#ffb300;transform:scale(1);text-shadow:0 .05em 0 #c27a00,0 0 .3em #ffe38a}
.stats{display:grid;grid-template-columns:1fr auto;gap:.15em 1.5em;font-size:1.05em;margin:0 auto}.stats span:nth-child(even){text-align:right}
.conf{position:absolute;top:-10%;width:.7em;height:1em;animation:conf linear forwards;pointer-events:none;z-index:9}
@keyframes conf{to{transform:translateY(120vh) rotate(720deg)}}
.story{font-weight:600;line-height:1.35;text-align:center;font-size:1.02em}
.giftbox{font-size:1.1em;text-align:center;background:#fff;border-radius:.8em;padding:.5em;border:2px dashed var(--accent)}
table.st{border-collapse:collapse;font-size:.85em;width:100%}table.st td,table.st th{border-bottom:1px solid #e3d3b8;padding:.3em .5em;text-align:left;font-weight:600;vertical-align:top}
.pass{color:#2f9e44;font-weight:800}.fail{color:#d62828;font-weight:800}
#stPage{position:fixed;inset:0;overflow:auto;background:var(--paper);padding:1em;z-index:20;touch-action:pan-y;user-select:text;-webkit-user-select:text}
ul.how{margin:0;padding-left:1.2em;font-weight:600;line-height:1.35}ul.how li{margin-bottom:.4em}
.short .bub{padding:.2em .25em;border-width:2px}.short .bub .chips{max-width:6.2em}.short .chip img{width:1.3em;height:1.3em}.short .bub .pr{width:1.8em;height:1.8em}.short .bub .nm{font-size:.6em;max-width:6em}
body:not(.portrait) #tut{bottom:auto;left:.7em;top:calc(3.6em + env(safe-area-inset-top));transform:none;width:min(21em,40vw);text-align:left}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="game" class="off"><div id="spots"></div><div id="bubs"></div>
<div id="hud"><button id="bPause" aria-label="Pause">&#10074;&#10074;</button><div class="pill" id="hDay"></div><div class="pill" id="hCoin"><div class="bar" id="hCoinB"></div><i class="coin"></i><span id="hCoinT"></span></div><div class="pill" id="hTips"></div><div class="pill" id="hTime"><div class="bar" id="hTimeB"></div><div class="rz" id="hRz"></div><span id="hTimeT"></span></div></div>
<div id="combo"></div><div id="rushB"></div><div id="queue"></div><button id="bUndo" class="btn alt sm"></button><img id="ghost" alt=""></div>
<div id="fxl"></div><div id="tut"></div><div id="ui"></div><div id="toast"></div><div id="tourTag"></div>
<script>
"use strict";
// ============================================================================
// CONFIG - everything you may want to change lives in this one object.
// Times are in seconds, money is in coins, colours are 0xRRGGBB.
// ============================================================================
const CONFIG = {
  name: 'Sizzlebury',                 // game name shown on the title, the logo and the page tab
  tagline: 'A cosy food-truck cooking rush', // small line under the logo
  credit: { show: true, maker: 'Your Name Here' }, // optional credit line in the menu; show:false hides it
  saveKey: 'sizzlebury.save.v2',      // versioned localStorage key (bump the number when the save format changes)
  backupKey: 'sizzlebury.save.backup',// a corrupt save is copied here before a fresh one starts
  chef: {                             // the chef's look
    name: 'Chef Otto',                // chef name used in story texts
    species: 'otter',                 // only used in texts
    fur: 0x8a5a3c,                    // fur colour
    belly: 0xf0d9b5,                  // muzzle and belly colour
    bandana: 0xe8443a,                // bandana colour
    dots: 0xffffff,                   // polka-dot colour on the bandana
    apron: 0xfff4e0                   // apron colour
  },
  theme: {                            // truck and interface colours
    truck: 0xfff1d6,                  // truck body
    trim: 0x2fb5a8,                   // truck trim and wheels hubs
    awningA: 0xe8443a,                // awning stripe 1
    awningB: 0xfff7ea,                // awning stripe 2
    counter: 0xd9a066,                // wooden counter top
    steel: 0xb9c4cc,                  // cooker steel
    uiAccent: '#ff7a3d',              // buttons and highlights (CSS colour)
    uiDark: '#4a2c1a',                // text and outlines (CSS colour)
    uiPaper: '#fff6e6'                // cards and panels (CSS colour)
  },
  dayLength: 180,                     // length of one day in seconds
  rush: [0.40, 0.66],                 // the rush runs between these fractions of the day
  rushGap: 60,                        // customer gap during the rush, in percent of the normal gap
  windowSlots: 4,                     // customers that fit at the serving window
  actionTime: 0.2,                    // seconds the chef needs for one action
  queueMax: 4,                        // how many actions can wait in the action queue
  undoTime: 4,                        // seconds in which the last placed item can be undone
  friendMax: 5,                       // usual orders needed to fill a regular's friendship meter
  combo: { step: 2, cap: 5 },         // bonus coins per combo level, and the highest level that still adds
  mood: { happy: 60, okay: 30 },      // patience left (percent) for a happy face (full tip) and an okay face (half tip)
  ingredients: {                      // kind: griddle/fryer = cooked from raw, top = topping, drink = poured by the machine
    //  name: label, day: first story day it is unlocked, color: 3D and icon colour, mark: colour-blind letter
    //  cook: seconds until perfect, burn: seconds it stays perfect, on: what a topping needs on the plate first
    toast:      { name: 'Bread',        kind: 'griddle', day: 1,  color: 0xe9b872, mark: 'B', cook: 5,  burn: 8 },
    fishcake:   { name: 'Lake Cake',    kind: 'griddle', day: 11, color: 0xc98a4b, mark: 'L', cook: 7,  burn: 7 },
    fries:      { name: 'Fries',        kind: 'fryer',   day: 2,  color: 0xf6cf4f, mark: 'F', cook: 6,  burn: 9 },
