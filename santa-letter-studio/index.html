function renderItem(item,c,plan=state){const sheet=buildItem(item,c,plan);sheet.dataset.recipient=c.name.trim()||'little star';fitSheet(sheet);return sheet;}
let fitBench;
function fitSheet(sheet){
 if(!fitBench?.isConnected){fitBench=el('div');fitBench.id='fitBench';fitBench.setAttribute('aria-hidden','true');fitBench.style.cssText='position:fixed;left:-20000px;top:0;visibility:hidden;pointer-events:none;width:1000px';document.body.append(fitBench);}
 const parent=sheet.parentNode,next=sheet.nextSibling,transform=sheet.style.transform;sheet.style.transform='none';fitBench.append(sheet);
 let failed=true;for(let level=0;level<=6;level++){sheet.dataset.fit=String(Math.min(level,5));sheet.dataset.flow=level===6?'joined':'normal';if(!contentOverflow(sheet)){failed=false;break;}}
 const item=sheet.dataset.item,title=ITEMS.find(v=>v[0]===item)?.[1]||'Page';
 const shorten={letter:'hand-edited sentences, favourite things or proud moments',report:'proud moments, name or town/street',note:'name or pet’s name',food:'name',tags:'name',envelope:'name or town/street',certificate:'name'};
 sheet.dataset.fitWarning=failed?title+' for '+sheet.dataset.recipient+' is still too long at 12 pt. Please shorten '+shorten[item]+'.':'';
 if(parent)parent.insertBefore(sheet,next);else sheet.remove();sheet.style.transform=transform;
 return !failed;
}
function fitNotice(sheet){const n=el('p','fit-notice'+(sheet.dataset.fitWarning?' overflow-msg':''),sheet.dataset.fitWarning||'');n.setAttribute('role','status');n.setAttribute('aria-live','polite');n.hidden=!sheet.dataset.fitWarning;return n;}

 return makeChild({name:padded('Alexandrina Wintermere ',36),age:7,town:padded('Little Wittering-on-the-Marsh Riverside Road 5 ',65),pet:padded('Sir Fluffington Snowpaws ',36),pronouns,likes:padded('dinosaurs, trains, painting, building towers and chasing bubbles outside ',100),proud:[padded('helped to make a wonderful picnic for the whole family ',95),padded('is learning to swim and feeling braver with each little try ',95),padded('shared a sandwich and helped a friend with a tricky puzzle ',95)],growth:padded('listening the first time we ask and putting shoes on with a little less help ',90),wishes:Array.from({length:5},(_,i)=>padded(['new shoes ','a wooden telescope ','a beautiful sketchbook ','a garden journal ','a set of coloured pencils '][i],90)),promise:true});
}
