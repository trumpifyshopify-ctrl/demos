<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Bobblewake Bay</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#9fdcf7;color:#17324d;font-family:"Arial Rounded MT Bold","Nunito","Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-weight:700;user-select:none;-webkit-user-select:none;touch-action:none}
[hidden]{display:none!important}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
.b{border:3px solid #17324d;border-radius:16px;background:#fff;padding:9px 16px;min-height:46px;font-size:clamp(15px,2.2vmin,19px);box-shadow:0 4px 0 #17324d;transition:transform .06s}
.b:active{transform:translateY(3px);box-shadow:0 1px 0 #17324d}
.b.big{background:#ff9a2e;color:#fff;text-shadow:0 2px 0 rgba(23,50,77,.55);font-size:clamp(18px,3vmin,26px)}
.b.alt{background:#2fb6c9}.b.ghost{background:#fff8e8}.b.on{background:#ffd23a}
.b:focus-visible,.card:focus-visible,.swb:focus-visible,input:focus-visible{outline:4px solid #ffd23a;outline-offset:2px}
#ui{position:fixed;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;padding:10px}
#ui.on{display:flex}#ui>*{pointer-events:auto}
#ui.s-pause,#ui.s-results,#ui.s-psettings,#ui.s-phow{background:rgba(23,50,77,.35)}
.title{display:flex;flex-direction:column;align-items:center;justify-content:space-between;height:100%;width:100%;padding:clamp(4px,3vh,34px) 8px clamp(6px,4vh,40px);pointer-events:none!important}
.title>*{pointer-events:auto}
.logo{margin:0;text-align:center;font-size:clamp(34px,min(11.5vw,15vh),118px);line-height:.95;font-weight:900;letter-spacing:.01em;color:#ffb021}
.logo .w{display:inline-block;white-space:nowrap}
.logo .w:last-child{color:#fff;display:block}
.logo .w>span{display:inline-block;text-shadow:0 .035em 0 #e2661a,0 .09em 0 #17324d,.05em .09em 0 #17324d,-.05em .09em 0 #17324d,0 .16em .12em rgba(23,50,77,.35);-webkit-text-stroke:.035em #17324d;paint-order:stroke fill;animation:bob 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*-.17s)}
.logo .w:last-child>span{text-shadow:0 .035em 0 #7fd6ea,0 .09em 0 #17324d,.05em .09em 0 #17324d,-.05em .09em 0 #17324d,0 .16em .12em rgba(23,50,77,.35)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-.07em) rotate(2deg)}}
body.calm .logo .w>span,body.cover .logo .w>span{animation:none}
.tcol{display:flex;flex-direction:column;align-items:center;gap:clamp(4px,1.4vh,12px)}
.tag{margin:0;font-size:clamp(14px,2.6vmin,22px);color:#fff;text-shadow:0 2px 0 #17324d,0 0 8px rgba(23,50,77,.6);text-align:center}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(430px,92vw)}
.btns .wide{grid-column:1/-1;min-height:40px}
@media (max-height:520px){.title{flex-direction:row;justify-content:space-evenly;align-items:center;padding:8px;gap:3vw}.logo{font-size:clamp(26px,min(6.6vw,19vh),76px);flex:0 1 auto}.tcol{flex:none}.btns{width:min(360px,42vw);gap:8px}.b{min-height:40px;padding:6px 12px}}
.panel{background:rgba(255,248,232,.97);border:4px solid #17324d;border-radius:24px;box-shadow:0 8px 0 rgba(23,50,77,.45);padding:14px 20px 16px;width:min(760px,100%);max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch}
.panel{touch-action:pan-y;overscroll-behavior:contain}.panel.small{width:min(340px,100%)}
.panel h2{margin:2px 0 8px;font-size:clamp(20px,3.6vmin,30px);text-align:center}
.panel h3{margin:10px 0 4px;font-size:16px}
.panel p{margin:4px 0 8px;font-size:clamp(13px,2vmin,16px);font-weight:600;line-height:1.35}
.dim{opacity:.75;text-align:center}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.card{display:flex;flex-direction:column;gap:4px;text-align:start;border:3px solid #17324d;border-radius:16px;background:#fff;padding:8px 10px;min-height:64px}
.card b{font-size:clamp(14px,2.2vmin,18px)}.card span{font-size:clamp(11px,1.7vmin,14px);font-weight:600;line-height:1.25}
.card.sel{background:#ffd23a;box-shadow:0 4px 0 #17324d}
.card .sw{display:block;height:26px;border-radius:9px;border:2px solid #17324d}
@media (max-width:560px){.cards{grid-template-columns:1fr}.card{min-height:0;flex-direction:row;flex-wrap:wrap;align-items:center}.card .sw{width:40px;height:22px}.card span{flex-basis:100%}}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.col{display:flex;flex-direction:column;gap:10px}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:5px 0;font-size:clamp(14px,2.1vmin,17px);flex-wrap:wrap}
.set input[type=range]{width:min(260px,50vw);height:30px;accent-color:#ff9a2e}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg .b,.tog{min-height:38px;padding:4px 12px;box-shadow:0 3px 0 #17324d}
.how{margin:0 0 8px;padding-inline-start:20px;font-size:clamp(13px,2vmin,16px);font-weight:600;line-height:1.35}.how li{margin:3px 0}.how.keys{list-style:square;opacity:.85}
.cupl{margin:4px 0 8px;padding-inline-start:24px;font-size:clamp(13px,2vmin,16px);font-weight:600}.cupl .cur{color:#d9541a}.cupl .done{opacity:.5}
.tb{width:100%;border-collapse:collapse;font-size:clamp(12px,2vmin,16px)}
.tb th,.tb td{padding:4px 6px;text-align:start;border-bottom:2px solid rgba(23,50,77,.12)}
.tb tr.you td{background:#ffe9a8}.dot{display:inline-block;width:.8em;height:.8em;border-radius:50%;border:2px solid #17324d;margin-inline-end:6px;vertical-align:-1px}
.win{color:#d9541a}
.sws{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.swb{display:flex;flex-direction:column;align-items:center;gap:2px;border:3px solid #17324d;border-radius:14px;background:#fff;padding:6px 2px;font-size:clamp(10px,1.6vmin,13px);min-width:0}
.swb i{width:30px;height:30px;border-radius:50%;border:3px solid #17324d}.swb span{font-weight:600;opacity:.7;font-size:.9em}
.swb.sel{background:#ffd23a}.swb.lock{opacity:.5}.swb.lock i{filter:grayscale(.7)}
@media (max-width:480px){.sws{grid-template-columns:repeat(3,1fr)}}
#ui.s-podium{align-items:flex-end}.panel.pod{width:min(560px,100%);max-height:52%}
#hud{position:fixed;inset:0;pointer-events:none}
#scores{position:absolute;inset-inline-start:8px;top:8px;display:grid;gap:2px;font-size:clamp(10.5px,1.7vmin,20px);max-width:44vw}
.sc{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.84);border-radius:10px;padding:1px 8px 1px 4px;white-space:nowrap}
.sc i{flex:none;width:.95em;height:.95em;border-radius:50%;border:2px solid #17324d}.sc b{flex:1}.sc span{min-width:1.5em;text-align:end;color:#d9541a}
.sc.you{background:#fff3c4;outline:2px solid #ff9a2e}.sc.gone{opacity:.5}.sc.king b:after{content:" \265B";color:#c58a00}
#clock{position:absolute;left:50%;top:8px;transform:translateX(-50%);text-align:center;background:rgba(23,50,77,.82);color:#fff;border-radius:14px;padding:2px 14px 4px;white-space:nowrap}
#clockT{display:block;font-size:clamp(22px,4.4vmin,50px);line-height:1.05}#clockM{display:block;font-size:clamp(10px,1.6vmin,17px);font-weight:600}
#mini{position:absolute;inset-inline-end:8px;top:8px;width:clamp(84px,17vmin,176px);height:clamp(84px,17vmin,176px)}
#pauseBtn{position:absolute;inset-inline-end:8px;top:calc(clamp(84px,17vmin,176px) + 14px);pointer-events:auto;width:clamp(44px,5vmin,56px);height:clamp(44px,5vmin,56px);min-height:0;padding:0;font-size:16px;letter-spacing:2px}
#meter{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(clamp(250px,26vmin,340px),42vw);height:clamp(26px,3vmin,34px);border:3px solid #17324d;border-radius:14px;background:rgba(255,255,255,.8);overflow:hidden}
#meterFill{position:absolute;inset:0;background:#63d27a;transform-origin:left center}
#meterFill.low{background:#cfd6dd}#meterFill.chg{background:#ffd23a}#meterFill.full{background:#ff5a3c}#meterFill.wait{background:#9fb7c9}
#meterTxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(13px,1.6vmin,17px);white-space:nowrap}
#power{position:absolute;left:50%;bottom:calc(clamp(26px,3vmin,34px) + 20px);transform:translateX(-50%);background:#17324d;color:#ffd23a;border-radius:12px;padding:2px 12px;font-size:14px;white-space:nowrap}#power:empty{display:none}
.lab{position:absolute;left:0;top:0;display:none;font-size:clamp(10px,1.5vmin,17px);color:#fff;text-shadow:0 1px 0 #17324d,0 0 4px #17324d;white-space:nowrap;will-change:transform}.lab.you{color:#ffe36a}
#stick{position:fixed;display:none;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;border:3px solid rgba(255,255,255,.8);background:rgba(255,255,255,.18);pointer-events:none}
#stick i{position:absolute;left:50%;top:50%;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.85);border:3px solid #17324d;transform:translate(-50%,-50%)}
#dashBtn{display:none;position:absolute;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));width:108px;height:108px;border-radius:50%;border:4px solid #17324d;background:#ff9a2e;color:#fff;font-size:22px;font-weight:900;text-shadow:0 2px 0 rgba(23,50,77,.6);box-shadow:0 6px 0 #17324d;pointer-events:auto;touch-action:none}
#dashBtn.dn{transform:translateY(4px);box-shadow:0 2px 0 #17324d;background:#ff5a3c}
body.touch #dashBtn{display:block}body.left #dashBtn{right:auto;left:16px}
body.touch #meter{bottom:calc(132px + env(safe-area-inset-bottom));left:auto;right:16px;transform:none;width:108px;height:22px}body.touch.left #meter{right:auto;left:16px}
body.touch #meterTxt{font-size:10px}body.touch #power{bottom:calc(160px + env(safe-area-inset-bottom));left:auto;right:16px;transform:none}body.touch.left #power{right:auto;left:16px}
#big{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);width:92vw;text-align:center;color:#fff;font-size:clamp(34px,9vmin,92px);font-weight:900;text-shadow:0 .05em 0 #17324d,0 0 .3em rgba(23,50,77,.7);-webkit-text-stroke:.03em #17324d;paint-order:stroke fill;overflow-wrap:anywhere}
#big small{display:block;font-size:.34em;-webkit-text-stroke:0;margin-top:.2em}
#toasts{position:fixed;left:50%;top:clamp(64px,13vmin,130px);transform:translateX(-50%);width:min(clamp(520px,60vmin,700px),calc(100vw - 20px));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
@media (max-width:640px),(max-width:1000px) and (orientation:portrait){#toasts{top:calc(clamp(84px,17vmin,176px) + clamp(66px,8vmin,80px))}}
@media (max-width:520px){#clock{left:auto;right:calc(clamp(84px,17vmin,176px) + 14px);transform:none;padding:2px 9px 4px}#scores{max-width:42vw}}
.toast{background:rgba(23,50,77,.92);color:#fff;border-radius:16px;padding:7px 16px;font-size:clamp(13px,2.2vmin,23px);text-align:center;max-width:100%;overflow-wrap:anywhere;line-height:1.3;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}body.calm .toast{animation:none}
#caption{display:none;position:fixed;left:50%;bottom:9vh;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 28px);text-align:center;background:rgba(23,50,77,.88);color:#fff;border-radius:22px;padding:8px 22px;font-size:clamp(18px,4.2vmin,40px);line-height:1.2;overflow-wrap:anywhere;pointer-events:none}
#tourHint{display:none;position:fixed;inset-inline-end:10px;top:8px;background:rgba(255,255,255,.8);border-radius:12px;padding:3px 10px;font-size:clamp(11px,1.8vmin,14px);pointer-events:none}body.tour #tourHint{display:block}
.wincard{align-self:flex-start;margin-top:5vh;background:rgba(255,248,232,.97);border:5px solid #17324d;border-radius:28px;box-shadow:0 10px 0 rgba(23,50,77,.45);padding:18px 34px;text-align:center;max-width:calc(100vw - 24px)}
.wincard .win{font-size:clamp(28px,7vmin,64px);font-weight:900}.wincard p{margin:6px 0 0;font-size:clamp(14px,2.6vmin,22px)}
.crn{width:clamp(60px,12vmin,110px);height:clamp(36px,7vmin,64px);margin:8px auto 0;background:#ffd23a;border:4px solid #17324d;border-top:0;clip-path:polygon(0 100%,0 0,25% 45%,50% 0,75% 45%,100% 0,100% 100%)}
.coverT{position:fixed;inset-inline-start:4vw;top:5vh;display:flex;flex-direction:column;align-items:flex-start}.coverT .logo{text-align:start;font-size:min(10.5vw,19vh)}.coverT .tag{font-size:3.2vmin;margin-top:1vh}
body.st{overflow:auto;background:#e9f6fb;user-select:text;-webkit-user-select:text;touch-action:auto}body.st #ui{position:static;display:block}.stp{margin:10px auto;max-height:none;width:min(1000px,100%)}
.tb tr.ok td:first-child{color:#177a3a}.tb tr.bad td{background:#ffd5cc}.tb tr.bad td:first-child{color:#b3261e}p.ok{color:#177a3a}p.bad{color:#b3261e}
@media (max-height:520px){.panel.sets{display:grid;grid-template-columns:1fr 1fr;column-gap:26px;align-items:center}.panel.sets h2,.panel.sets .row{grid-column:1/-1}.panel.sets .set input[type=range]{width:min(180px,22vw)}.panel{padding:8px 16px 10px}.panel h2{margin:0 0 4px}.swb{flex-direction:row;justify-content:center;gap:6px;padding:3px 4px}.swb i{width:22px;height:22px}.swb span{display:none}.swb.sel{outline:3px solid #17324d}.panel h3{margin:4px 0 2px}}
@media (max-height:520px) and (min-aspect-ratio:13/10){#ui.s-podium{align-items:center;justify-content:flex-end}.panel.pod{width:min(420px,50vw);max-height:100%}}

</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud" hidden>
  <div id="labels"></div>
  <div id="scores"></div>
  <div id="clock"><span id="clockT">3:00</span><span id="clockM"></span></div>
  <canvas id="mini" aria-hidden="true"></canvas>
  <button id="pauseBtn" class="b" aria-label="Pause">II</button>
  <div id="power"></div>
  <div id="meter"><div id="meterFill"></div><span id="meterTxt"></span></div>
  <button id="dashBtn" aria-label="Dash">DASH</button>
  <div id="big"></div>
</div>
<div id="stick"><i></i></div>
<div id="toasts" aria-live="polite"></div>
<div id="caption"></div>
<div id="tourHint"></div>
<div id="ui"></div>
<script>
/* ============================================================
   Bobblewake Bay - one CONFIG object. Change a value, reload.
   Lengths are in units (a boat is 2 units wide in radius),
   times are in ticks (60 ticks = 1 second) unless a name says seconds.
   ============================================================ */
const CONFIG = {
  gameName: 'Bobblewake Bay',            // the title shown everywhere (never with "the" in front)
  saveKey: 'bobblewakeBay.save.v1',      // versioned localStorage key for settings, unlocks and best cup
  backupKey: 'bobblewakeBay.save.v1.damaged', // a damaged save is copied here before a fresh one starts
  rtl: false,                            // true mirrors menus and HUD for right-to-left text
  ticksPerSecond: 60,                    // fixed simulation rate; the screen may draw faster or slower
  maxCatchUpTicks: 30,                   // most ticks one slow frame may run (below 2 frames per second the clock slows)

  arenaRadius: 50,                       // radius of the safe water, in units
  boatRadius: 2,                         // every boat is a circle of this radius
  boatsPerMatch: 6,                      // you and five bots

  speed: {
    top: 12,                             // top speed, units per second
    accel: 36,                           // speeding up, units per second per second
    brake: 24,                           // slowing down, units per second per second
    turnAt100: 180,                      // degrees per second at weight 100
    turnLossPer10: 1                     // percent of turning lost per 10 weight above 100
  },
  weight: {
    start: 100,                          // weight at the start and after being washed out
    perWashOut: 10,                      // weight gained for each wash-out you cause
    max: 200                             // heaviest a boat can get
  },
  push: {
    base: 4,                             // push of a touch with no approach speed, units per second
    max: 60,                             // no push is ever above this
    fadeTicks: 30,                       // a push is a slide that fades evenly to zero over this many ticks
    pairCooldown: 20                     // the same two boats cannot bump again for this many ticks
  },
  dash: {
    minCharge: 12,                       // releasing earlier than this does nothing
    maxCharge: 60,                       // charging longer counts as this
    chargeSpeedPercent: 50,              // speed while charging, percent of top speed
    lungeSpeed: 24,                      // lunge speed, units per second
    lungeTicks: 20,                      // lunge length in ticks
    multMin: 150,                        // push multiplier in percent at the shortest charge
    multMax: 300,                        // push multiplier in percent at a full charge
    cooldown: 90                         // ticks after a lunge ends before the next charge can start
  },
  wake: {
    lifeTicks: 120,                      // a wake is alive for exactly this many ticks
    push: 20,                            // push across the line, units per second
    makerSafeTicks: 30                   // the maker cannot be pushed by its own wake this long
  },
  washOut: {
    awayTicks: 180,                      // a washed-out boat floats back after exactly this many ticks
    shieldTicks: 120,                    // shield after returning (takes no push, gives none)
    creditTicks: 180                     // a push counts for credit this long
  },
  powerUps: {
    everyTicks: 1200,                    // a mirrored pair appears this often if none is on the water
    pickRadius: 3.5,                     // centre distance at which a boat picks one up
    anchorTicks: 240,                    // Anchor: cannot be pushed for 4 seconds
    turboTicks: 300,                     // Turbo: 5 seconds of extra speed
    turboPercent: 130,                   // Turbo speed in percent
    bigWakePercent: 200,                 // Big Wake: wake length and life in percent
    kinds: ['anchor', 'bigwake', 'turbo']// the three kinds, picked by a seeded roll
  },
  hazards: {
    whirlRadius: 12,                     // whirlpool radius at the centre
    whirlPull: 3,                        // inward pull, units per second
    ferryRadius: 3.5,                    // a ferry is a circle of this radius
    ferryPush: 12,                       // push from a ferry, units per second (no credit)
    ferryX: 16,                          // ferries sail up and down at x = -16 and x = +16
    ferryReach: 30,                      // ...between y = -30 and y = +30
    ferryPeriod: 1200,                   // ticks for one trip there and back
    fountainRadius: 5,                   // fountain radius
    fountainEvery: 600,                  // fountains erupt every 10 seconds
    fountainLift: 60,                    // a lifted boat hangs for this many ticks (no push taken or given)
    fountainWarn: 120                    // bubbles show this many ticks before an eruption
  },
  modes: {
    classic: { name: 'Classic', ticks: 10800,            // 3 minutes
      blurb: 'Three minutes. Most wash-outs wins.' },
    last:    { name: 'Last Boat Floating', ticks: 18000,  // 5 minute cap
      returns: 3,                        // returns each boat has
      shrinkEvery: 1800,                 // the safe water shrinks at ticks 1800, 3600, ...
      shrinkBy: 4,                       // ...by this many units
      minRadius: 22,                     // ...down to this radius
      shrinkWarn: 180,                   // the next edge is drawn this many ticks before
      blurb: 'Three returns each. The water shrinks. Last boat wins.' },
    crown:   { name: 'Crown', ticks: 18000,               // 5 minute cap
      holdToWin: 2700,                   // 45 seconds of holding in total wins at once
      noRetake: 60,                      // a carrier who drops the crown cannot retake it this long
      pickRadius: 3.5,                   // centre distance at which a boat takes the crown
      blurb: 'Hold the crown for 45 seconds in total.' }
  },
  cup: {
    points: [10, 7, 5, 3, 2, 1],         // points for places 1 to 6
    matches: [                           // the five cup matches: mode and arena
      ['classic', 0], ['last', 1], ['crown', 2], ['classic', 1], ['last', 0]]
  },
  bots: {
    easy:   { name: 'Easy',   react: 36, maxCharge: 20, seesWakes: 0 }, // reaction delay, longest charge, wake sense
    normal: { name: 'Normal', react: 18, maxCharge: 40, seesWakes: 1 }, // 1 = steers around wakes
    hard:   { name: 'Hard',   react: 8,  maxCharge: 60, seesWakes: 2 }, // 2 = also lays wakes by the edge
    guardInset: 12,                      // the edge-guard patrols this far inside the markers
    dodgerHome: 9                        // the dodger circles this far from the middle
  },
  /* The six boats. Slot 0 is you. personality: rammer, dodger or guard. */
  boats: [
    { name: 'Marmalade', crew: 'Captain Pip', crewKind: 'otter', hull: [1.0, 0.56, 0.12], trim: [1.0, 0.93, 0.78], coat: [1.0, 0.84, 0.16],
      shape: 'tub', personality: 'guard', blurb: 'A round orange tub with a cheerful otter in a yellow raincoat.' },
    { name: 'Gruff Tug', crew: 'Bosun Brumble', crewKind: 'walrus', hull: [0.16, 0.24, 0.52], trim: [0.92, 0.9, 0.84], coat: [0.55, 0.4, 0.3],
      shape: 'tug', personality: 'rammer', blurb: 'Broad navy rammer with a grumpy walrus at the wheel.' },
    { name: 'Zippy Skiff', crew: 'Flip and Flap', crewKind: 'gulls', hull: [0.45, 0.9, 0.72], trim: [1, 1, 1], coat: [0.97, 0.97, 0.97],
      shape: 'skiff', personality: 'dodger', blurb: 'Slim mint dodger crewed by two giggling gulls.' },
    { name: 'Old Buoy Keeper', crew: 'Mister Nipper', crewKind: 'crab', hull: [0.86, 0.2, 0.2], trim: [1, 0.95, 0.85], coat: [0.95, 0.35, 0.25],

/* ============================================================
   SIM - the deterministic match simulation (integers only).

   ============================================================ */
const SIM = (function () {
  'use strict';
  const C = CONFIG, U = 15360, Q = 16384, V = 256;

  const tr = Math.trunc;

    let s = (Math.imul((seed | 0) ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul(salt | 0, 0xc2b2ae35)) >>> 0;
    if (s === 0) s = 0x1234567;

  const TOP = C.speed.top * V, ACC = Math.round(C.speed.accel * V / 60), BRK = Math.round(C.speed.brake * V / 60);
  const BR = C.boatRadius * U, PUSHMAX = C.push.max * V, LUNGE = C.dash.lungeSpeed * V;
  const HZ = C.hazards, FR = Math.round(HZ.ferryRadius * U), FOR = HZ.fountainRadius * U, WR = HZ.whirlRadius * U;
  const PICK = Math.round(C.powerUps.pickRadius * U), CPICK = Math.round(C.modes.crown.pickRadius * U);

      charge: 0, lunge: 0, lc: 0, lsx: 0, lsy: 0, cool: 0, pushes: [], lastBy: -1, lastTick: -99999, tp: 0,
      caused: 0, washed: 0, streak: 0, best: 0, returns: 0, anchor: 0, turbo: 0, big: 0, hold: 0, noCrown: 0, outOrd: 0,
      bot: null, inp: { dir: -1, thr: 0, dash: false } };

  /* opts: mode, arena, seed, ctrl[6] (null = human or idle, or {pers, diff}), layout [[x, y, headingDeg]...] (units), noPower */

      ferries: A.hazard === 'ferries' ? [{ x: -HZ.ferryX * U, y: ferryY(0) }, { x: HZ.ferryX * U, y: ferryY(0) }] : [],
      fountains: A.hazard === 'fountains' ? A.fountains.map(f => ({ x: f[0] * U, y: f[1] * U })) : [],

      if (c) { const d = C.bots[c.diff]; b.bot = { pers: c.pers, diff: c.diff, react: d.react, maxC: d.maxCharge, sees: d.seesWakes, timer: 1 + (i * 5) % d.react,
        minFire: c.pers === 'rammer' ? Math.min(d.maxCharge, 24) : C.dash.minCharge, tx: 0, ty: 0, thr: 256, dash: false, fire: false, vic: -1, kind: 'go', spin: s.rBot(2) ? 1 : -1, wa: s.rBot(36000) }; }

  }

  function endLunge(s, b) {

    if (ilen(bx - ax, by - ay) < U) return;
    if (b.big) { const k = C.powerUps.bigWakePercent - 100, ex = tr((bx - ax) * k / 200), ey = tr((by - ay) * k / 200); ax -= ex; ay -= ey; bx += ex; by += ey; life = tr(life * C.powerUps.bigWakePercent / 100); b.big = 0; big = true; }
    const w = { id: s.wakeId++, ax: ax, ay: ay, bx: bx, by: by, born: s.tick, life: life, owner: b.slot, crossed: 0, big: big };
    s.wakes.push(w); s.ev.push({ t: 'wake', w: w });
  }

  function step(s) {

    const B = s.boats, n = B.length, T = s.tick, pe = [];

      for (let k = 0; k < sp.length; k += 2) if (ilen(sp[k][0] * U, sp[k][1] * U) < s.R - 2 * U) ok.push(k);
      const pick = s.rPow(ok.length || 1);

    }

    for (let i = 0; i < n; i++) {
      const b = B[i]; if (b.state !== 0) continue;
      b.tp = 0; b.px = b.x; b.py = b.y;
      if (b.bot) botAct(s, b);
      if (b.lift > 0) { b.ovx = b.ovy = 0; continue; }

const SAVE = (function () {

  const aspect = () => { const s = GLR.size(); return s[0] / s[1]; };
  const baseDist = () => Math.hypot(C.camera.height, C.camera.back) * Math.max(1, 0.85 / aspect());
  let coverFrames = 0;
  function frame() {
    if (!cover || coverFrames++ < 8) requestAnimationFrame(frame); // the cover is a still: a few frames, then it rests
    const now = performance.now(); let dt = (now - last) / 1000; last = now; if (document.hidden) dt = 0; else if (dt > 0.5) dt = 0.5; // a stall longer than half a second is not replayed
    const c0 = performance.now(), rdt = dt; pollPad();
    for (let i = timers.length - 1; i >= 0; i--) { timers[i].t -= rdt; if (timers[i].t <= 0) { const f = timers[i].fn; timers.splice(i, 1); f(); } }
    const run = !cover && !(app === 'play' && paused);
    if (run) { acc += dt * C.ticksPerSecond; let n = Math.floor(acc); if (n > C.maxCatchUpTicks) { n = C.maxCatchUpTicks; acc = n; perf.slow++; } acc -= n;
      if (hold) { n = holdN; holdN = 0; acc = 0; dt = n / 60; }
      for (let i = 0; i < n; i++) {
        if (app === 'play') { if (match.ended) { /* the last frame stays */ } else if (pre > 0) { pre--; if (pre % 60 === 0) { big(pre ? String(pre / 60) : T.go, pre ? C.modes[match.mode].name + ' - ' + C.arenas[match.arena].name : '', pre ? 99 : 0.7); AUDIO.beep(!pre); } }
          else { playerInput(sim); SIM.step(sim); SCENE.onEvents(sim, save.quality !== 'high'); matchEvents(sim); if (sim.over) endMatch(); } }
        else if (app === 'tour') { if (!tour.done) tourTick(); }
        else if (app === 'title') { SIM.step(attract); SCENE.onEvents(attract, true); if (attract.over || attract.tick > 5400) newAttract(); }
      }
      time += dt; if (bigT > 0 && bigT < 90) { bigT -= dt; if (bigT <= 0) big(''); } }
    toastTick(hold ? dt : rdt);
    // camera
    const s = sim || attract, bd = baseDist();
    if (app === 'play' || (app === 'tour' && sim && SCENES[tour.ix].follow !== undefined && !SCENES[tour.ix].wide)) { const b = s.boats[0], hd = b.h / 100 * PI / 180, k = b.state === 0 ? C.camera.lookAhead * b.sp / SIM.TOP : 0;
      if (b.state === 0) { camT.x = (b.px + (b.x - b.px) * acc) / U + Math.cos(hd) * k; camT.z = -(b.py + (b.y - b.py) * acc) / U - Math.sin(hd) * k; } else { camT.x *= 0.985; camT.z *= 0.985; }
      camT.dist = bd * (b.charge > 0 && !save.reducedMotion ? 0.94 : 1) * (app === 'tour' ? 0.8 : 1); camT.tilt = Math.atan2(C.camera.height, C.camera.back); }
    else if (app === 'tour' && sim) { const w = SCENES[tour.ix].wide || SCENES[tour.ix - 1].wide; if (w) { camT.x = w[0]; camT.z = -w[1]; camT.dist = w[2] * Math.max(1, 0.85 / aspect()); camT.tilt = 0.95; } }
    else if (app === 'title') { camT.dist = 90 * Math.max(1, 1.1 / aspect()); camT.x = save.reducedMotion ? 0 : Math.sin(time * 0.12) * 8; }
    else if (app === 'cover') { cam.x = cover.x; cam.z = cover.z; cam.dist = 26; cam.tilt = 0.42; cam.ty = 1.2; cam.fov = 40; }
    if (app !== 'cover') { const f = Math.min(1, dt * 5); cam.x += (camT.x - cam.x) * f; cam.z += (camT.z - cam.z) * f; cam.dist += (camT.dist - cam.dist) * Math.min(1, dt * 3); cam.tilt += (camT.tilt - cam.tilt) * Math.min(1, dt * 3); }
    SCENE.draw(s, { alpha: run && !hold && !(app === 'play' && (pre > 0 || match.ended)) && !(tour && tour.done) ? acc : 1, t: time, dt: run ? dt : 0, cam: cam, you: app === 'play' || app === 'cover' || (app === 'tour' && sim && !SCENES[tour.ix].wide) ? 0 : -1, reduced: save.reducedMotion, q: save.quality, podium: app === 'podium' ? podium.order : null });
    if (app === 'play') drawHud(sim);
    // measurements
    const c1 = performance.now() - c0; perf.sum += c1; perf.fsum += dt; perf.frames++; if (c1 > perf.cpuMax) perf.cpuMax = c1;
    if (perf.frames >= 60) { perf.cpu = perf.sum / perf.frames; perf.fps = perf.fsum > 0 ? perf.frames / perf.fsum : 0; perf.max = perf.cpuMax; perf.calls = GLR.calls(); perf.n++; perf.sum = perf.fsum = perf.frames = perf.cpuMax = 0;
      if (!save.qualitySet && perf.n === 3 && app !== 'cover' && !tour) { save.qualitySet = true; if (perf.fps < 28 && save.quality === 'high') { save.quality = 'low'; applySettings(); toast(T.qualityAuto, 4); } persist(); } }
  }

  /* ---------- start ---------- */
  if (!GLR.init(cv, save.quality === 'high' || Q('cover'))) { ui.innerHTML = '<div class="panel"><h2>' + esc(C.gameName) + '</h2><p>This game needs WebGL 2. Please try a current browser.</p></div>'; ui.className = 'on'; return; }
  applySettings();
  if (Q('cover')) { GLR.resize('high'); startCover(); } else if (Q('tour')) startTour(); else { toTitle(); if (ld.recovered) toast(T.saveRecovered, 5); }
  window.__game = { get sim() { return sim; }, get attract() { return attract; }, get app() { return app; }, get screen() { return screen; }, get paused() { return paused; }, get pre() { return pre; }, perf: perf, inp: inp, get save() { return save; }, get cam() { return cam; },
    start: startMatch, pause: setPaused, clock: () => $('clockT').textContent, tris: GLR.tris, skipCountdown: () => { pre = 1; }, hold: v => { hold = v; }, step: n => { holdN += n; }, big: big, show: show, clearToasts: clearToasts, podium: () => { showPodium(); }, setCup: c => { cup = c; }, audio: () => AUDIO.state(), toast: toast, get tour() { return tour; } };
  requestAnimationFrame(frame);
})();

</script>
