<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="Plowville Nights: a 3D territory-claiming snowplow game. Six plows, one snowed-in town, claim the most ground.">
<title>Plowville Nights</title>
<style>
:root{--bg:#0d1426;--panel:rgba(16,24,46,.92);--panel2:rgba(28,40,70,.92);--ink:#f3f6ff;--muted:#a9b6d3;--accent:#ffb84d;--accent2:#ff5f4d;--good:#4fd38a;--line:rgba(255,255,255,.12);--radius:18px;--sa-top:env(safe-area-inset-top,0px);--sa-bottom:env(safe-area-inset-bottom,0px);--sa-left:env(safe-area-inset-left,0px);--sa-right:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;font-size:16px;touch-action:none;user-select:none;-webkit-user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none}
#ui>*{pointer-events:auto}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(16px + var(--sa-top)) calc(16px + var(--sa-right)) calc(16px + var(--sa-bottom)) calc(16px + var(--sa-left));overflow:hidden}
.screen.scroll{justify-content:flex-start;overflow-y:auto;overflow-x:hidden}
.hidden{display:none!important}
.dim{background:radial-gradient(ellipse at 50% 30%,rgba(13,20,38,.55),rgba(13,20,38,.9))}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;max-width:min(92vw,720px);width:100%;box-shadow:0 20px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(8px)}
.panel.wide{max-width:min(94vw,900px)}
h1,h2,h3{margin:0 0 10px;font-weight:800;letter-spacing:.3px}
h2{font-size:clamp(22px,4vw,32px)}
h3{font-size:clamp(16px,2.6vw,20px);color:var(--accent)}
p{margin:6px 0;line-height:1.45;color:var(--muted)}
.logo{font-size:clamp(40px,9vw,96px);font-weight:900;line-height:.95;letter-spacing:-1px;text-align:center;background:linear-gradient(180deg,#fff7e6 0%,#ffd27a 45%,#ff9f43 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(120,50,10,.55)) drop-shadow(0 14px 30px rgba(0,0,0,.6));position:relative;padding-top:10px}
.logo small{display:block;font-size:.32em;letter-spacing:6px;text-transform:uppercase;color:#cfe3ff;background:none;-webkit-text-fill-color:#cfe3ff;filter:none;margin-top:8px;font-weight:700}
.logo-wrap{text-align:center;margin-bottom:18px}
.tagline{color:#dbe6ff;font-size:clamp(14px,2.2vw,19px);text-align:center;max-width:620px;margin:10px auto 0;text-shadow:0 1px 2px #000,0 2px 6px #000,0 0 16px rgba(0,0,0,.9)}
.menu{display:flex;flex-direction:column;gap:10px;width:min(92vw,340px)}
.btn{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:800;font-size:clamp(15px,2.3vw,19px);color:#2b1a0a;background:linear-gradient(180deg,#ffd98a,#ffb347);border-radius:14px;padding:13px 18px;box-shadow:0 5px 0 #a65d12,0 10px 24px rgba(0,0,0,.4);transition:transform .08s,box-shadow .08s;text-align:center;min-height:48px;letter-spacing:.2px}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a65d12,0 6px 14px rgba(0,0,0,.4)}
.btn.secondary{background:linear-gradient(180deg,#3b4f82,#2a3a63);color:var(--ink);box-shadow:0 5px 0 #15203c,0 10px 24px rgba(0,0,0,.4)}
.btn.secondary:active{box-shadow:0 2px 0 #15203c}
.btn.danger{background:linear-gradient(180deg,#ff7a6b,#d9412f);color:#fff;box-shadow:0 5px 0 #7a1d12,0 10px 24px rgba(0,0,0,.4)}
.btn.small{padding:8px 14px;font-size:14px;min-height:38px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default;filter:grayscale(.4)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.row.center{justify-content:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.card.sel{outline:3px solid var(--accent);box-shadow:0 0 0 6px rgba(255,184,77,.15)}
.card h4{margin:0 0 4px;font-size:16px}
.card p{font-size:13px;margin:0}
.footer{position:absolute;left:0;right:0;bottom:calc(10px + var(--sa-bottom));text-align:center;color:var(--muted);font-size:12px;padding:0 16px;text-shadow:0 1px 4px #000}
.seg{display:inline-flex;background:rgba(0,0,0,.3);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;padding:8px 14px;border-radius:9px;cursor:pointer;min-height:38px}
.seg button.on{background:var(--accent);color:#2b1a0a}
label.opt{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-weight:700}
label.opt span.l{color:var(--ink)}
input[type=range]{width:min(46vw,200px);accent-color:var(--accent)}
.toggle{width:54px;height:30px;border-radius:15px;background:#2a3a63;position:relative;cursor:pointer;border:0;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on{background:var(--good)}
.toggle.on::after{left:27px}
table.res{width:100%;border-collapse:collapse;font-size:clamp(12px,1.8vw,15px)}
table.res th,table.res td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
table.res th:first-child,table.res td:first-child,table.res th:nth-child(2),table.res td:nth-child(2){text-align:left}
table.res tr.me td{color:var(--accent);font-weight:800}
.swatch{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px;border:1px solid rgba(255,255,255,.35)}
/* HUD */
#hud{justify-content:flex-start;align-items:stretch;padding:calc(10px + var(--sa-top)) calc(10px + var(--sa-right)) calc(10px + var(--sa-bottom)) calc(10px + var(--sa-left));pointer-events:none}
#hud *{pointer-events:none}
#hud button,#touch>*{pointer-events:auto}
.hud-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
#hud-timer{font-size:clamp(24px,4.5vw,40px);font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.6),0 6px 20px rgba(0,0,0,.6);background:rgba(10,16,32,.55);padding:4px 14px;border-radius:12px;min-width:92px;text-align:center;border:1px solid var(--line)}
#hud-timer.warn{color:#ff8a7a}
#hud-sub{font-size:12px;color:var(--muted);text-align:center;margin-top:2px}
#hud-shares{display:flex;flex-direction:column;gap:4px;background:rgba(10,16,32,.55);padding:8px 10px;border-radius:12px;border:1px solid var(--line);min-width:150px}
.share{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700}
.share .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:90px}
.share .bar{width:60px;height:8px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden}
.share .bar i{display:block;height:100%;border-radius:4px;transition:width .3s}
.share .pct{width:36px;text-align:right;font-variant-numeric:tabular-nums}
.share.dz{opacity:.55}
#minimap{position:absolute;right:calc(10px + var(--sa-right));bottom:calc(10px + var(--sa-bottom));width:124px;height:124px;border-radius:12px;border:2px solid rgba(255,255,255,.25);background:rgba(10,16,32,.6);image-rendering:pixelated}
.hud-bottom{position:absolute;left:calc(10px + var(--sa-left));bottom:calc(10px + var(--sa-bottom));display:flex;gap:10px;align-items:flex-end}
.meter{width:150px;background:rgba(10,16,32,.55);border:1px solid var(--line);border-radius:12px;padding:6px 10px}
.meter .lbl{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;justify-content:space-between}
.meter .bar{height:10px;background:rgba(255,255,255,.12);border-radius:5px;overflow:hidden;margin-top:4px}
.meter .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4fd0ff,#9df2ff);border-radius:5px}
.meter.ready .bar i{background:linear-gradient(90deg,#ffd98a,#ffb347)}
.pu{width:74px;height:58px;background:rgba(10,16,32,.55);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.pu b{font-size:14px;color:#fff;text-transform:none;letter-spacing:0}
.pu.has{border-color:var(--accent);box-shadow:0 0 18px rgba(255,184,77,.35)}
#btn-pause{position:absolute;z-index:5;top:calc(10px + var(--sa-top));left:50%;transform:translateX(-50%);width:46px;height:46px;border-radius:50%;background:rgba(10,16,32,.6);border:1px solid var(--line);color:#fff;font-size:18px;font-weight:900;cursor:pointer}
#touch{position:absolute;inset:0;display:none;pointer-events:auto;z-index:2}
body.touch #touch{display:block}
#joy{position:absolute;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);display:none}
#joy i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.45)}
.tbtn{position:absolute;width:84px;height:84px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(10,16,32,.5);color:#fff;font-weight:900;font-size:13px;letter-spacing:.5px;text-transform:uppercase;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1}
.tbtn:active,.tbtn.down{background:rgba(255,184,77,.6)}
#tb-boost{right:calc(22px + var(--sa-right));bottom:calc(150px + var(--sa-bottom))}
#tb-power{right:calc(116px + var(--sa-right));bottom:calc(60px + var(--sa-bottom))}
body.lefty #tb-boost{right:auto;left:calc(22px + var(--sa-left))}
body.lefty #tb-power{right:auto;left:calc(116px + var(--sa-left))}
body.lefty #minimap{right:auto;left:calc(10px + var(--sa-left))}
body.lefty .hud-bottom{left:auto;right:calc(10px + var(--sa-right));flex-direction:row-reverse}
/* captions, toasts, bubbles */
#captions{position:absolute;left:0;right:0;bottom:calc(150px + var(--sa-bottom));display:flex;justify-content:center;padding:0 16px;pointer-events:none}
.caption{background:rgba(10,16,32,.8);border:1px solid var(--line);border-radius:14px;padding:10px 18px;max-width:min(92vw,560px);text-align:center;font-weight:700;font-size:clamp(14px,2.2vw,18px);line-height:1.35;overflow-wrap:anywhere;animation:pop .25s ease-out}
#toasts{position:absolute;left:0;right:0;top:calc(66px + var(--sa-top));display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 16px;pointer-events:none}
.toast{background:rgba(255,184,77,.95);color:#2b1a0a;border-radius:12px;padding:8px 16px;font-weight:800;font-size:clamp(13px,2vw,16px);max-width:min(92vw,520px);text-align:center;overflow-wrap:anywhere;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:pop .2s ease-out}
.toast.bad{background:rgba(255,95,77,.95);color:#fff}
.toast.good{background:rgba(79,211,138,.95);color:#06251a}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
#bubbles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bubble{position:absolute;transform:translate(-50%,-100%);background:#fff;color:#1a1f33;font-weight:800;font-size:13px;padding:6px 10px;border-radius:12px;white-space:nowrap;max-width:60vw;overflow:hidden;text-overflow:ellipsis;box-shadow:0 4px 14px rgba(0,0,0,.4);animation:pop .2s ease-out}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0}
/* countdown + banner */
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;font-size:clamp(40px,10vw,110px);font-weight:900;text-shadow:0 4px 0 rgba(0,0,0,.5),0 12px 40px rgba(0,0,0,.7);color:#fff;letter-spacing:2px;padding:0 16px;overflow-wrap:anywhere}
/* podium */
.podium-wrap{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:10px 0 16px}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;width:min(26vw,140px)}
.pod .blk{width:100%;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,#5b6f9c,#33436b);display:flex;align-items:flex-start;justify-content:center;font-weight:900;font-size:28px;padding-top:6px;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.pod .nm{font-weight:800;font-size:14px;text-align:center;overflow-wrap:anywhere}
.pod .pts{font-size:12px;color:var(--muted)}
/* selftest */
table.st{width:100%;border-collapse:collapse;font-size:13px}
table.st td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.st td:first-child{font-weight:800;white-space:nowrap}
.ok{color:var(--good);font-weight:900}.bad{color:#ff8a7a;font-weight:900}
.coins{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.3);padding:6px 12px;border-radius:12px;font-weight:800;color:var(--accent)}
.coins::before{content:"";width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3c4,#ffb347 60%,#b86b12);display:inline-block}
.hint{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;max-height:min(44vh,360px);overflow-y:auto;padding-right:4px}
.item{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.item .sw{width:100%;height:26px;border-radius:8px;border:1px solid rgba(255,255,255,.2)}
.item .nm{font-weight:800;font-size:14px}
.item.eq{outline:2px solid var(--good)}
.item .btn{width:100%}
.kbd{display:inline-block;background:rgba(255,255,255,.12);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:12px;font-weight:800}
.howto-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;text-align:left}
#tapstart{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(60px + var(--sa-bottom));pointer-events:none;color:#fff;font-weight:800;text-shadow:0 2px 10px #000;animation:blink 1.6s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@media (max-width:600px){#btn-pause{left:calc(10px + var(--sa-left));transform:none;top:calc(78px + var(--sa-top));width:40px;height:40px}.panel{padding:16px 14px}.share .bar{width:40px}.share .nm{max-width:64px}#hud-shares{min-width:120px}.items{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}#toasts{top:calc(170px + var(--sa-top))}.hud-bottom{bottom:calc(10px + var(--sa-bottom))}#minimap{width:96px;height:96px}}
@media (max-width:1000px){body.touch #captions{bottom:calc(345px + var(--sa-bottom))}#tb-boost{right:calc(18px + var(--sa-right));bottom:calc(150px + var(--sa-bottom))}#tb-power{right:calc(18px + var(--sa-right));bottom:calc(248px + var(--sa-bottom))}body.lefty #tb-boost{right:auto;left:calc(18px + var(--sa-left))}body.lefty #tb-power{right:auto;left:calc(18px + var(--sa-left))}}

@media (max-height:500px){#captions,body.touch #captions{bottom:calc(116px + var(--sa-bottom))}.meter{width:110px}#hud-shares{display:none}#minimap{top:calc(10px + var(--sa-top));bottom:auto;width:96px;height:96px}#tb-boost{bottom:calc(22px + var(--sa-bottom));right:calc(22px + var(--sa-right))}#tb-power{bottom:calc(22px + var(--sa-bottom));right:calc(116px + var(--sa-right))}body.lefty #minimap{left:auto;right:calc(10px + var(--sa-right))}body.lefty #tb-boost{left:calc(22px + var(--sa-left))}body.lefty #tb-power{left:calc(116px + var(--sa-left))}}
@media (prefers-reduced-motion:reduce){.caption,.toast,.bubble{animation:none}}
/* compact title layout on short screens: the "press any key" hint and the credit line keep their own bottom zone */
@media (max-height:760px){#scr-title{padding-bottom:calc(50px + var(--sa-bottom))}#scr-title .logo{font-size:clamp(36px,7vw,72px);padding-top:6px}#scr-title .logo small{margin-top:6px}#scr-title .logo-wrap{margin-bottom:10px}#scr-title .tagline{margin-top:6px;font-size:clamp(13px,2vw,16px)}#scr-title .menu{gap:7px}#scr-title .menu .btn{min-height:42px;padding:9px 16px}#scr-title .menu .btn.small{min-height:34px;padding:6px 12px}#tapstart{padding-bottom:calc(30px + var(--sa-bottom));font-size:14px}}
@media (max-height:600px){#scr-title .logo{font-size:clamp(30px,6vw,54px)}#scr-title .logo-wrap{margin-bottom:6px}#scr-title .tagline{margin-top:4px;font-size:13px}#scr-title .menu{gap:6px}#scr-title .menu .btn{min-height:38px;padding:7px 14px;font-size:15px}#scr-title .menu .btn.small{min-height:32px}}
@media (max-height:430px){#scr-title .logo{font-size:clamp(28px,5vw,40px)}#scr-title .logo small,#scr-title .tagline{display:none}#scr-title .menu{gap:5px}#scr-title .menu .btn{min-height:34px;padding:5px 12px;font-size:14px}#scr-title .menu .btn.small{min-height:30px}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="ui">
  <div id="hud" class="screen hidden">
    <div class="hud-top">
      <div><div id="hud-timer">3:00</div><div id="hud-sub"></div></div>
      <div id="hud-shares"></div>
    </div>
    <button id="btn-pause" aria-label="Pause">II</button>
    <canvas id="minimap" width="60" height="60"></canvas>
    <div class="hud-bottom">
      <div class="meter" id="boost-meter"><div class="lbl"><span id="boost-lbl">Boost</span><span id="boost-key">Shift</span></div><div class="bar"><i></i></div></div>
      <div class="pu" id="pu-box"><span id="pu-lbl">Power-up</span><b id="pu-name">none</b></div>
    </div>
    <div id="touch"><div id="joy"><i></i></div><div class="tbtn" id="tb-boost">Boost</div><div class="tbtn" id="tb-power">Power</div></div>
  </div>
  <div id="bubbles"></div>
  <div id="banner" class="hidden"></div>
  <div id="captions"></div>
  <div id="toasts"></div>
  <div id="screens"></div>
  <div id="tapstart" class="hidden"></div>
</div>
<script>

/* =====================================================================
   CONFIG - everything tunable lives here. Every field has a short note.
   ===================================================================== */
var CONFIG = {
  game: {
    name: 'Plowville Nights',          // game title (used exactly as given, never with "the")
    version: '1.0.0',                   // shown in the menu footer
    saveKey: 'plowvilleNights.save',    // localStorage key (the version number is appended)
    saveVersion: 2,                     // bump when the save layout changes; older saves migrate
    credits: { text: 'Made in Claude Code with a snowplow prompt', show: true } // optional credit line in the menu
  },
  grid: {
    size: 60,          // the ground is size x size cells
    startPatch: 3      // every plow starts on a cleared patch this wide
  },
  plow: {
    speed: 6.4,                     // cells per second at normal speed
    boostMul: 1.55,                 // speed multiplier while boosting
    boostTime: 1.5,                 // seconds a boost lasts
    boostCooldown: 6,               // seconds before boost is ready again
    turnRate: [3.3, 2.75, 2.3],     // radians per second for blade width 1, 2, 3 (wider turns slower)
    radius: [0.55, 0.68, 0.8],      // body radius in cells per blade width (used for bumps)
    wallBounce: 0.35                // how strongly a wall turns a plow back into the arena
  },
  blade: {
    widthShares: [0.08, 0.20]       // blade becomes 2 cells wide at 8% share and 3 cells at 20%
  },
  bump: {
    cooldown: 0.6,                  // seconds before the same two plows can bump again
    shove: 1.0,                     // cells the smaller plow is pushed sideways
    nudge: 0.5                      // cells each plow moves when they are equal
  },
  lane: {
    refillAge: 12,                  // seconds before an open lane refills from its tail
    blizzardRefillMul: 2,           // refill speed multiplier in Blizzard weather
  },
  cut: {
    dizzyTime: 3,                   // seconds a cut plow spins before it respawns
    shieldTime: 2,                  // seconds of shield after respawn
    respawnMinDist: 6               // respawn at least this many cells from any rival
  },
  powerups: {
    max: 3,                         // most power-ups on the ground at once
    interval: 5,                    // seconds between spawns when there is room

/* =====================================================================
   SIMULATION - deterministic, fixed 60 Hz, integer-seeded random.
   No Math.random / Math.sin / Math.atan2: own polynomial trig so that
   the same seed gives the same match in every engine.
   ===================================================================== */
var TICK = 60, DT = 1 / TICK, PI = 3.141592653589793, TAU = PI * 2, HPI = PI / 2;

function Rng(seed) { this.s = (seed >>> 0) || 0x9e3779b9; }
Rng.prototype.nextU = function () { var x = this.s; x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0; this.s = x; return x; };
Rng.prototype.int = function (n) { return this.nextU() % n; };          // 0..n-1
Rng.prototype.f = function () { return this.nextU() / 4294967296; };    // 0..1 (exact division, deterministic)
Rng.prototype.range = function (a, b) { return a + this.f() * (b - a); };
Rng.prototype.pick = function (arr) { return arr[this.int(arr.length)]; };
Rng.prototype.shuffle = function (arr) { for (var i = arr.length - 1; i > 0; i--) { var j = this.int(i + 1); var t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; };

function taylorSin(x) {
  x = x - Math.floor((x + PI) / TAU) * TAU;
  if (x > HPI) x = PI - x; else if (x < -HPI) x = -PI - x;
  var x2 = x * x;
  return x * (1 + x2 * (-1 / 6 + x2 * (1 / 120 + x2 * (-1 / 5040 + x2 * (1 / 362880 - x2 / 39916800)))));
}
var SINN = 4096, SINT = new Float64Array(SINN + 2);
for (var _i = 0; _i <= SINN + 1; _i++) SINT[_i] = taylorSin(_i * TAU / SINN);
function dsin(x) { var t = x * (SINN / TAU); t = t - Math.floor(t / SINN) * SINN; var i = t | 0; var f = t - i; return SINT[i] + (SINT[i + 1] - SINT[i]) * f; }
function dcos(x) { return dsin(x + HPI); }
function datan2(y, x) {
  var ax = Math.abs(x), ay = Math.abs(y);
  if (ax === 0 && ay === 0) return 0;
  var a = ax > ay ? ay / ax : ax / ay, s = a * a;
  var r = ((-0.0464964749 * s + 0.15931422) * s - 0.327622764) * s * a + a;
  if (ay > ax) r = HPI - r;
  if (x < 0) r = PI - r;
  if (y < 0) r = -r;
  return r;
}
function wrapAngle(a) { return a - Math.floor((a + PI) / TAU) * TAU; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

/* Builds the static arena layout (blocked cells, ice, lamps, props) from CONFIG, mirrored left-right. */
function buildArena(cfg, arenaIndex) {
  var N = cfg.grid.size, a = cfg.arenas[arenaIndex];
  var flags = new Uint8Array(N * N); // 1 blocked, 2 ice, 4 track, 8 pond
  var props = [], lamps = [], mirrorX = function (x) { return N - 1 - x; };
  function addRect(p, mirrored) {
    var x = p.x, w = p.w || 1, h = p.h || 1;
    if (p.center) { if (mirrored) return null; }
    else if (mirrored) { x = mirrorX(p.x + w - 1); }
    return { t: p.t, x: x, y: p.y, w: w, h: h, c: p.c, r: p.r, cx: x + w / 2, cy: p.y + h / 2, mirrored: mirrored };
  }
  function place(q) {
    if (!q) return;
    var bit = (q.t === 'house' || q.t === 'shop' || q.t === 'church' || q.t === 'station') ? 17 : q.t === 'ice' ? 2 : q.t === 'track' ? 4 : q.t === 'pond' ? 8 : 0;
    if (q.t === 'tree' || q.t === 'lamp' || q.t === 'bonfire' || q.t === 'fountain') {
      if (q.t === 'tree') { var cx = Math.floor(q.cx), cy = Math.floor(q.cy); if (cx >= 0 && cx < N && cy >= 0 && cy < N) flags[cy * N + cx] |= 1; }
      if (q.t === 'bonfire' || q.t === 'fountain') { for (var by = Math.floor(q.cy - 1); by <= Math.floor(q.cy); by++) for (var bx = Math.floor(q.cx - 1); bx <= Math.floor(q.cx); bx++) if (bx >= 0 && bx < N && by >= 0 && by < N) flags[by * N + bx] |= 1; }
      if (q.t === 'lamp') lamps.push({ x: q.cx, y: q.cy });
      props.push(q); return;
    }
    if (bit) for (var yy = q.y; yy < q.y + q.h; yy++) for (var xx = q.x; xx < q.x + q.w; xx++) if (xx >= 0 && xx < N && yy >= 0 && yy < N) flags[yy * N + xx] |= bit;
    props.push(q);
  }
  for (var i = 0; i < a.props.length; i++) { var p = a.props[i]; place(addRect(p, false)); if (!p.center) place(addRect(p, true)); }
  for (var j = 0; j < (a.centerProps || []).length; j++) { var cp = a.centerProps[j]; place({ t: cp.t, x: cp.x, y: cp.y, w: 1, h: 1, cx: cp.x, cy: cp.y, center: true }); }
  var starts = [];
  for (var s = 0; s < a.starts.length; s++) starts.push([a.starts[s][0], a.starts[s][1]]);
  for (var s2 = 0; s2 < a.starts.length; s2++) starts.push([mirrorX(a.starts[s2][0]), a.starts[s2][1]]);
  var claimable = 0; for (var k = 0; k < N * N; k++) if (!(flags[k] & 1)) claimable++;
  return { index: arenaIndex, def: a, N: N, flags: flags, props: props, lamps: lamps, starts: starts, claimable: claimable, hazard: a.hazard, tram: a.tram || null, blizzard: a.blizzard || null };
}

      count: 0, sx: 0, sy: 0, width: 1, alive: true, dizzy: 0, shield: 0, boostT: 0, boostCd: 0, saltT: 0, lanternT: 0, iceT: 0, iceCd: 0, wobble: 0,

      stats: { cuts: 0, cut: 0, biggest: 0, cars: 0, bumps: 0, claims: 0 }, lastChange: 0, bestShare: 0, cars: 0, finishedTick: -1,

Sim.prototype.cellOf = function (x, y) { var N = this.N; var cx = Math.floor(x), cy = Math.floor(y); if (cx < 0 || cy < 0 || cx >= N || cy >= N) return -1; return cy * N + cx; };

Sim.prototype.touchCar = function (pi, c) {

Sim.prototype.widthFor = function (share) { var t = this.cfg.blade.widthShares; return share >= t[1] ? 3 : share >= t[0] ? 2 : 1; };

/* footprint cells of the blade for width w (center first) */

Sim.prototype.step = function (humanInput) {

Sim.prototype.movePlow = function (p) {

});
SelfTest.steps.push(function () { // pools bounded over a full Plow Cup
  var fx = new FX(1600), maxFx = 0, maxBubbles = 0, maxPu = 0, events = 0, roster = buildRoster(CONFIG, { seed: 11, difficulty: 'normal', human: true, count: 6 }); roster[0].autopilot = true;

    }

});
SelfTest.steps.push(function () { // saves load, migrate, recover from damage

  Save.store = prevStore; Save.data = prevData; Save.notice = prevNotice;
