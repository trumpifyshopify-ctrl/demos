<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Nibblefin Lagoon</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0c5f73;color:#fff;font-family:ui-rounded,system-ui,sans-serif;font-weight:700;user-select:none;-webkit-user-select:none;touch-action:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,rgba(0,60,80,0) 52%,rgba(0,46,66,.42) 100%)}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.hide{display:none!important}
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:44px;padding:.45em 1.2em;border-radius:999px;background:linear-gradient(#ffe680,#ffc233);color:#6b3200;font-weight:900;font-size:clamp(15px,2.3vmin,20px);box-shadow:0 4px 0 #c7811a,0 8px 14px rgba(0,40,60,.3);transition:transform .08s;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c7811a}
.btn:focus-visible,.chip:focus-visible,.item:focus-visible{outline:3px solid #fff;outline-offset:2px}
.btn.alt{background:linear-gradient(#5fe0d2,#1fb6b0);color:#06383f;box-shadow:0 4px 0 #0f7f80,0 8px 14px rgba(0,40,60,.3)}
.btn.red{background:linear-gradient(#ff9d8a,#ff6a5c);color:#5c0d0d;box-shadow:0 4px 0 #b83a34,0 8px 14px rgba(0,40,60,.3)}
.btn.big{font-size:clamp(20px,4.2vmin,32px);padding:.4em 2em}
.btn[disabled]{filter:grayscale(.7);opacity:.6;cursor:default}
/* ---------- title ---------- */
#s-title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:min(2.4vh,18px);padding:12px;text-align:center;background:radial-gradient(ellipse at 50% 40%,rgba(6,70,90,.1),rgba(4,50,70,.34))}
.logo{font-weight:900;line-height:.86;letter-spacing:.01em;font-size:clamp(40px,min(15.5vw,17vh),128px);transform:rotate(-3deg);filter:drop-shadow(0 8px 0 rgba(0,50,70,.35))}
.logo span{display:block;-webkit-text-stroke:.09em #0a4b63;paint-order:stroke fill}
.logo .l1{color:#ffd23c}.logo .l2{color:#ff7d5c;font-size:.82em;margin-inline-start:.9em}
.tag{font-size:clamp(14px,2.6vmin,22px);background:rgba(4,60,80,.6);padding:.25em 1em;border-radius:999px}
.row{display:flex;flex-wrap:wrap;gap:10px 12px;justify-content:center;align-items:center}
.coins{position:fixed;top:10px;inset-inline-end:12px;background:rgba(4,60,80,.72);padding:.3em .9em;border-radius:999px;font-size:clamp(14px,2.2vmin,18px)}
.coins b{color:#ffd23c}
@media (max-height:480px){#s-title{flex-direction:row;flex-wrap:wrap;gap:10px 28px;align-content:center}.logo{font-size:clamp(34px,19vh,72px)}#s-title .col{display:flex;flex-direction:column;gap:10px;align-items:center;max-width:52vw}.tag{font-size:13px}.btn{min-height:38px}}
#s-title .col{display:flex;flex-direction:column;gap:min(2.2vh,16px);align-items:center}
/* ---------- panels ---------- */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:10px;background:rgba(4,50,70,.45)}
.panel{width:min(760px,100%);max-height:100%;overflow-y:auto;background:linear-gradient(rgba(14,104,128,.96),rgba(8,76,100,.96));border:3px solid rgba(255,255,255,.28);border-radius:26px;padding:clamp(12px,2.4vmin,22px);box-shadow:0 14px 40px rgba(0,30,50,.5);touch-action:pan-y}
.panel.side{align-self:stretch;margin-inline-start:auto;width:min(430px,100%)}
#s-wardrobe{justify-content:flex-end;background:none}
@media (max-aspect-ratio:1/1){#s-wardrobe{align-items:flex-end;justify-content:center}#s-wardrobe .panel.side{align-self:flex-end;width:100%;max-height:56%;margin:0}}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
h2{font-size:clamp(20px,3.6vmin,30px);font-weight:900;color:#ffd23c}
h3{font-size:clamp(14px,2.2vmin,17px);margin:10px 0 6px;color:#aef3ea;font-weight:900}
p,li{font-size:clamp(13px,2.1vmin,16px);font-weight:600;line-height:1.35}
ul{padding-inline-start:1.2em;display:grid;gap:5px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.chip{display:block;width:100%;text-align:start;background:rgba(255,255,255,.12);border:3px solid transparent;border-radius:16px;padding:8px 12px;font-weight:800;font-size:clamp(14px,2.2vmin,17px)}
.chip small{display:block;font-weight:600;font-size:.8em;opacity:.88;white-space:normal;line-height:1.25}
.chip.on{background:rgba(255,210,60,.24);border-color:#ffd23c}
.seg{display:inline-flex;background:rgba(0,0,0,.22);border-radius:999px;padding:3px;flex-wrap:wrap}
.seg button{padding:.35em .9em;border-radius:999px;background:none;font-weight:800;font-size:clamp(13px,2vmin,16px);min-height:36px}
.seg button.on{background:#ffd23c;color:#6b3200}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.12);flex-wrap:wrap}
.set label{font-size:clamp(14px,2.2vmin,17px)}
input[type=range]{width:min(220px,46vw);accent-color:#ffd23c;height:28px}
table{width:100%;border-collapse:collapse;font-size:clamp(12px,2.1vmin,16px)}
td,th{padding:5px 6px;text-align:start;border-bottom:1px solid rgba(255,255,255,.14);font-weight:700}
th{color:#aef3ea;font-size:.85em}
tr.me td{color:#ffd23c}
td.n,th.n{text-align:end}
.dot{display:inline-block;width:.8em;height:.8em;border-radius:50%;margin-inline-end:.4em;vertical-align:-.05em;border:2px solid rgba(255,255,255,.7)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.item{background:rgba(255,255,255,.12);border:3px solid transparent;border-radius:14px;padding:8px;text-align:center;font-size:14px;font-weight:800}
.item small{display:block;font-weight:700;opacity:.9;margin-top:2px}
.item.on{border-color:#ffd23c;background:rgba(255,210,60,.24)}
.item.locked small{color:#ffd23c}
.sw{display:inline-block;width:22px;height:22px;border-radius:50%;border:2px solid #fff;vertical-align:middle;margin-inline-end:4px}
.big-result{font-size:clamp(24px,5vmin,42px);font-weight:900;color:#ffd23c;text-align:center;-webkit-text-stroke:.06em #0a4b63;paint-order:stroke fill}
.center{text-align:center}.mt{margin-top:12px}
#s-podium{align-items:flex-end;background:none;padding-bottom:max(10px,2vh)}
#s-podium .panel{width:min(600px,100%);max-height:47%;padding:10px 16px}
#s-podium td,#s-podium th{padding:2px 6px}
#s-selftest .panel{width:min(980px,100%)}
#s-selftest td{font-size:clamp(11px,1.7vmin,14px);font-weight:600;word-break:break-word}
.ok{color:#8dffb0;font-weight:900}.bad{color:#ffb0a0;font-weight:900}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none}
#hud .top{position:absolute;top:8px;left:50%;transform:translateX(-50%);text-align:center}
#timer{font-size:clamp(22px,4.4vmin,46px);font-weight:900;background:rgba(4,60,80,.72);padding:.05em .7em;border-radius:999px;display:inline-block;font-variant-numeric:tabular-nums}
#goal{font-size:clamp(11px,1.9vmin,19px);margin-top:3px;background:rgba(4,60,80,.6);padding:.1em .8em;border-radius:999px;display:inline-block}
#board{position:absolute;top:8px;inset-inline-start:8px;background:rgba(4,60,80,.66);border-radius:14px;padding:5px 9px;font-size:clamp(11px,1.9vmin,19px);min-width:9.5em}
#board div{display:flex;justify-content:space-between;gap:.8em;line-height:1.45;white-space:nowrap}
#board div.me{color:#ffd23c}
#board span:last-child{font-variant-numeric:tabular-nums}
#mapbox{position:absolute;top:8px;inset-inline-end:8px;display:flex;gap:6px;align-items:flex-start}
#map{width:clamp(72px,15vmin,116px);height:clamp(72px,15vmin,116px);border-radius:50%;background:rgba(4,60,80,.66);border:2px solid rgba(255,255,255,.4)}
#pauseBtn{pointer-events:auto;width:44px;height:44px;border-radius:50%;background:rgba(4,60,80,.8);font-size:18px;font-weight:900;border:2px solid rgba(255,255,255,.4)}
#status{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100vw - 16px)}
.stat{background:rgba(4,60,80,.72);border-radius:14px;padding:3px 10px;font-size:clamp(11px,1.9vmin,19px);text-align:center;line-height:1.25}
.stat b{display:block;font-size:1.35em;color:#ffd23c;font-variant-numeric:tabular-nums}
#mySize b{font-size:1.9em}
.stat.dim b{color:#9fc3cc}
.lab{position:absolute;left:0;top:0;transform:translate(-50%,-100%);font-size:clamp(11px,1.8vmin,19px);white-space:nowrap;text-shadow:0 1px 0 #053a4d,0 0 4px #053a4d,0 0 2px #053a4d;text-align:center;line-height:1.05;will-change:transform}
.lab b{display:block;font-size:1.2em;color:#ffe680}
#toasts{position:fixed;top:clamp(64px,13vh,96px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,520px)}
.toast{background:rgba(255,210,60,.95);color:#5c2c00;border-radius:16px;padding:.3em 1em;font-size:clamp(13px,2.2vmin,22px);font-weight:900;text-align:center;max-width:100%;overflow-wrap:anywhere;animation:pop .25s}
#caption{position:fixed;bottom:clamp(74px,17vh,150px);left:50%;transform:translateX(-50%);width:max-content;max-width:min(92vw,760px);background:rgba(4,60,80,.86);border:2px solid rgba(255,255,255,.35);border-radius:18px;padding:.4em 1em;font-size:clamp(14px,2.4vmin,24px);text-align:center;pointer-events:none;overflow-wrap:anywhere}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
/* ---------- touch ---------- */
#touch{position:fixed;inset:0;pointer-events:none}
#stick{position:absolute;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;background:rgba(255,255,255,.14);border:3px solid rgba(255,255,255,.5)}
#stick i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border-radius:50%;background:rgba(255,210,60,.9)}
.tbtn{position:absolute;pointer-events:auto;width:84px;height:84px;border-radius:50%;font-weight:900;font-size:15px;background:rgba(255,210,60,.88);color:#6b3200;border:3px solid rgba(255,255,255,.7);bottom:22px;inset-inline-end:16px;touch-action:none}
#tPow{bottom:118px;inset-inline-end:26px;width:70px;height:70px;background:rgba(95,224,210,.9);color:#06383f;font-size:12px;line-height:1.05}
.lefty .tbtn{inset-inline-end:auto;inset-inline-start:16px}.lefty #tPow{inset-inline-start:26px}
.touching #status{bottom:auto;top:clamp(52px,11vh,80px)}
@media (max-aspect-ratio:1/1){.touching #status{top:142px}.touching #toasts{top:200px}}
.touching #toasts{top:clamp(104px,22vh,150px)}
#cover{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;padding:4vmin 5vmin;gap:1.6vmin}
#cover .logo{font-size:clamp(40px,13vmin,150px)}
#cover .tag{font-size:clamp(14px,3vmin,30px)}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="vig"></div>
<div id="labels"></div>
<div id="hud" class="hide">
  <div id="board"></div>
  <div class="top"><div id="timer">3:00</div><br><div id="goal" class="hide"></div></div>
  <div id="mapbox"><canvas id="map" width="232" height="232"></canvas><button id="pauseBtn" aria-label="Pause">II</button></div>
  <div id="status">
    <div class="stat" id="stSchool"><span></span><b>0/10</b></div>
    <div class="stat" id="mySize"><span></span><b>100</b></div>
    <div class="stat" id="stDash"><span></span><b>-</b></div>
    <div class="stat" id="stPow"><span></span><b>-</b></div>
  </div>
</div>
<div id="touch" class="hide"><div id="stick" class="hide"><i></i></div><button class="tbtn" id="tDash"></button><button class="tbtn" id="tPow"></button></div>
<div id="screens"></div>
<div id="cover" class="hide"></div>
<div id="caption" class="hide"></div>
<div id="toasts"></div>
<script>
/* =====================================================================
   CONFIG - everything you may want to change lives here.
   Distances are in arena units, times in ticks (60 ticks = 1 second)
   unless a comment says otherwise. Colours are [red, green, blue] 0..1.
   ===================================================================== */
const CONFIG = {
  game: {
    name: 'Nibblefin Lagoon',            // game name, shown on the title screen and in the tab
    lang: 'en',                          // language code of every text below
    dir: 'ltr',                          // text direction: 'ltr' or 'rtl' (menus and HUD mirror with it)
    saveKey: 'nibblefin-lagoon.save.v1', // versioned localStorage key of the save
    backupKey: 'nibblefin-lagoon.save.damaged', // where a damaged save is kept
    tickRate: 60                         // simulation steps per second (fixed)
  },
  hero: {                                // the creature you play
    name: 'Mango',                       // hero name
    kind: 'pufferling',                  // what it is (used in the how-to text)
    look: { body: [1.0, 0.56, 0.16], belly: [1.0, 0.86, 0.6], fin: [1.0, 0.42, 0.1], stripe: [0.1, 0.78, 0.72], shape: [1.0, 0.94, 1.0], eye: 1.15, nubs: true } // colours, body stretch [length, height, width], eye scale, puffer nubs
  },
  rivals: [                              // the named rivals: they play in every match (slots 1 to 3)
    { name: 'Grumble', pers: 'hunter', look: { body: [0.55, 0.3, 0.78], belly: [0.8, 0.66, 0.95], fin: [0.4, 0.18, 0.62], stripe: [0.95, 0.75, 0.2], shape: [1.05, 0.9, 1.2], eye: 0.95, brows: true } },   // broad purple hunter
    { name: 'Zigzag', pers: 'trickster', look: { body: [0.74, 0.8, 0.86], belly: [0.95, 0.97, 1.0], fin: [0.35, 0.6, 0.9], stripe: [0.2, 0.45, 0.9], shape: [1.25, 0.82, 0.72], eye: 0.9, zig: true } },   // slim silver trickster
    { name: 'Auntie Frond', pers: 'shepherd', look: { body: [0.36, 0.72, 0.36], belly: [0.8, 0.94, 0.66], fin: [0.2, 0.55, 0.3], stripe: [1.0, 0.9, 0.4], shape: [1.0, 1.0, 1.02], eye: 1.05, frond: true } } // calm green shepherd
  ],
  extras: [                              // invented extras that fill the other slots, one per personality
    { name: 'Brisket', pers: 'hunter', look: { body: [0.86, 0.3, 0.3], belly: [1.0, 0.75, 0.7], fin: [0.62, 0.16, 0.2], stripe: [1.0, 0.85, 0.3], shape: [1.05, 0.9, 1.15], eye: 0.95, brows: true } },
    { name: 'Skitter', pers: 'trickster', look: { body: [0.3, 0.62, 0.9], belly: [0.82, 0.93, 1.0], fin: [0.16, 0.36, 0.72], stripe: [1.0, 1.0, 1.0], shape: [1.25, 0.82, 0.72], eye: 0.9, zig: true } },
    { name: 'Uncle Moss', pers: 'shepherd', look: { body: [0.93, 0.58, 0.72], belly: [1.0, 0.86, 0.9], fin: [0.8, 0.36, 0.56], stripe: [0.5, 0.86, 0.5], shape: [1.0, 1.0, 1.02], eye: 1.05, frond: true } }
  ],
  sizes: {
    start: 100,          // body size of every creature at the start of a match
    minReturn: 100,      // a gulped creature never returns below this body size
    radiusDiv: 5,        // radius in units = integer square root of body size, divided by this
    food: 3,             // body size gained per piece of plankton
    foodCount: 200,      // pieces of plankton on the field (100 mirrored pairs)
    foodRespawn: 1800,   // ticks before an eaten pair of plankton grows back at a new mirrored spot
    foodRadius: 0.4,     // touch radius of a piece of plankton
    arenaWidth: 120      // width of the round arena
  },
  tiers: {
    from: [0, 150, 300, 600, 1000],     // body size at which each tier starts
    speed: [40, 37, 34, 31, 29],        // swim speed per tier in 1/256 unit per tick (each 8% slower)
    names: ['Nibbler', 'Paddler', 'Cruiser', 'Bruiser', 'Lagoon Giant'], // tier names shown in results
    accel: 3                            // how quickly creatures reach their speed (sixteenths per tick)
  },
  gulp: {
    num: 115, den: 100,  // A gulps B when den x A's Size >= num x B's Size (1.15 times)
    gainDiv: 2,          // the gulper gains B's body size divided by this
    keepDiv: 2,          // the gulped creature returns with its body size divided by this
    bubbleTicks: 180,    // ticks a gulped creature floats in its bubble (exactly 3 seconds)
    shieldTicks: 120,    // shield after returning (2 seconds: cannot gulp or be gulped)
    startShield: 600,    // the player's shield at the start of a match on Easy and Normal (10 seconds; 0 = none)
    safeSpawn: 10        // never return within this many units of a rival that could gulp you
  },
  dash: {
    num: 9, den: 5,      // dash speed = normal speed x num / den (1.8 times)
    costEvery: 12,       // one body size is spent every this many dash ticks
    minBody: 60          // no dash at this body size or less
  },
  school: {
    fryName: 'minnow',   // the small fry of this setting (singular)
    fryNamePlural: 'minnows', // plural
    shoalSize: 5,        // small fry per wild shoal
    eatGain: 10,         // body size for eating a wild one
    spareRange: 6,       // keep it within this many units of your body's edge...
    spareTicks: 60,      // ...for this long without touching and it joins
    max: 10,             // most members a school can have
    bonus: 15,           // Size added by every member close enough
    nearRange: 10,       // a member counts only within this many units of your edge
    dashScatter: 5,      // a dashing bigger rival scatters members within this many units of it
    safeTicks: 120,      // a scattered small fry cannot be touched for this long
    respawn: 1800,       // ticks before an eaten small fry grows back in its shoal
    fryRadius: 0.45,     // body radius of a small fry
    wildSpeed: 12        // drift speed of wild small fry in 1/256 unit per tick
  },
  powerups: {
    maxOnField: 3,       // most power-ups lying in the arena at once
    spawnEvery: 420,     // ticks between new power-ups
    radius: 1.2,         // pick-up radius
    types: [             // id, name and effect length in ticks
      { id: 'shield', name: 'Pearl Shell', ticks: 300, info: 'Nobody can gulp you or scatter your school for 5 seconds.' },
      { id: 'call', name: 'Conch Call', range: 15, info: 'Every wild minnow nearby joins your school.' },
      { id: 'rush', name: 'Swift Tide', ticks: 240, info: 'Free dash for 4 seconds.' }
    ]
  },
  bots: {
    difficulties: ['easy', 'normal', 'hard'], // difficulty ids, in order
    // nine profiles: three personalities at three difficulties.
    // react = ticks between decisions, sight = how far it sees, dashChase / dashEscape = may it dash to chase / to escape
    profiles: {
      hunter:    { easy: { react: 36, sight: 20, dashChase: false, dashEscape: false }, normal: { react: 18, sight: 30, dashChase: true, dashEscape: false }, hard: { react: 8, sight: 40, dashChase: true, dashEscape: true } },
      shepherd:  { easy: { react: 36, sight: 20, dashChase: false, dashEscape: false }, normal: { react: 18, sight: 30, dashChase: false, dashEscape: false }, hard: { react: 8, sight: 40, dashChase: false, dashEscape: true } },
      trickster: { easy: { react: 36, sight: 20, dashChase: false, dashEscape: false }, normal: { react: 18, sight: 30, dashChase: true, dashEscape: false }, hard: { react: 8, sight: 40, dashChase: true, dashEscape: true } }
    },
    fleeGap: 12,         // a bot runs when a rival that can gulp it is this close (edge to edge)
    chaseGiveUp: 300,    // a hunter gives up on one target after this many ticks
    hunterFryTaste: 1,   // 1: hunters go out of their way to eat small fry, 0: they do not
    shepherdHold: 3,     // the gap a shepherd keeps to a small fry it is sparing
    shepherdCare: 5,     // shepherds start fleeing this many units earlier, to keep their school
    shepherdReach: 10,   // a shepherd only goes for a gulp when the smaller one is this close
    startGrace: 1800     // on Easy and Normal no bot hunts the player for this many ticks after the start (30 seconds; contact still gulps)
  },
  modes: {
    classic:  { name: 'Classic',  ticks: 10800, info: '3 minutes. The biggest Size at the whistle wins.' },                      // match length in ticks
    survival: { name: 'Survival', bubbles: 3, info: 'Five rivals that return forever. Your run ends at your third bubble.' },    // bubbles until the run ends
    feast:    { name: 'Feast',    target: 600, ticks: 18000, info: 'The first to reach Size 600 wins at once.' }                 // winning Size and time limit
  },
  cup: {
    name: 'Lagoon Cup',                              // cup name
    matches: [['classic', 0], ['feast', 1], ['classic', 2], ['feast', 0], ['classic', 1]], // [mode, arena] of the 5 matches
    points: [10, 7, 5, 3, 2, 1]                      // points for places 1 to 6
  },
  coins: { place: [30, 20, 14, 10, 7, 5], perGulp: 3, perMember: 1, survivalDiv: 10, cupBonus: [60, 35, 20] }, // coins per placing, per gulp, per largest-school member, Survival score divider, cup podium bonus
  arenas: [
    // every arena: list only the LEFT half (x < 0) and the middle (x = 0); the right half is mirrored for you.
    { id: 'cove', name: 'Coral Arch Cove', info: 'A current runs down the middle and carries everyone along.',
      water: [0.1, 0.62, 0.72], sand: [0.95, 0.85, 0.6],      // water tint and sand colour

/* =====================================================================
   SIMULATION - deterministic, fixed 60 Hz, integers only.
   Positions are fixed-point: 256 = one arena unit. No Math.random,
   no Math.sin, no floats in anything the self test compares.
   ===================================================================== */
const FP = 256;
function U(v) { return Math.round(v * FP); }            // config units -> fixed-point (config values are exact halves/tenths; rounding is IEEE-exact)
function isqrt(n) {                                      // integer square root for 0 <= n < 2^32
  if (n < 1) return 0;
  let x = n >= 2147483648 ? 65536 : 1 << ((33 - Math.clz32(n)) >> 1);
  for (;;) { const y = (x + ((n / x) | 0)) >> 1; if (y >= x) return x; x = y; }
}
function makeRng(seed) {                                 // xorshift32: integer only
  let s = (seed >>> 0) || 0x9E3779B9;
  return {
    next() { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s; },
    int(n) { return this.next() % n; }
  };
}
function mixSeed(seed, k) {
  let h = ((seed >>> 0) ^ Math.imul(k, 0x9E3779B1)) >>> 0;
  h = Math.imul(h ^ (h >>> 16), 0x85EBCA6B) >>> 0;
  h = Math.imul(h ^ (h >>> 13), 0xC2B2AE35) >>> 0;
  return (h ^ (h >>> 16)) >>> 0;
}
function radiusOf(body) { return (isqrt(body * 65536) / CONFIG.sizes.radiusDiv) | 0; }
function tierOf(body) { const f = CONFIG.tiers.from; let t = 0; for (let i = 1; i < f.length; i++) if (body >= f[i]) t = i; return t; }
function canGulp(sa, sb) { return CONFIG.gulp.den * sa >= CONFIG.gulp.num * sb; }

const SPREAD = [[256, 0], [241, 88], [241, -88], [196, 165], [196, -165]];   // cos, sin x256 of 0, 20 and 40 degrees either way
const HEX = [[0, -1024], [887, -512], [887, 512], [0, 1024], [-887, 512], [-887, -512]]; // hexagon corners x1024 (integer table)
const RING_R = 11, PILLAR_R = 2, SMALL_CAP = U(3.2), BIG_MIN = U(3.7);

function buildArena(index) {
  const d = CONFIG.arenas[index];
  const A = { index, def: d, R: (CONFIG.sizes.arenaWidth / 2) * FP, rocks: [], nooks: [], starts: [], spawns: [], shoals: [], powerSpots: [], kelp: [], current: null, cows: null };
  const mir = (list, fn) => { for (const p of list) { fn(U(p[0]), U(p[1]), p); if (p[0] !== 0) fn(-U(p[0]), U(p[1]), p); } };
  mir(d.rings, (x, y) => {
    for (const h of HEX) A.rocks.push({ x: x + ((h[0] * RING_R * FP / 1024) | 0), y: y + ((h[1] * RING_R * FP / 1024) | 0), r: PILLAR_R * FP, kind: 'pillar', ring: A.nooks.length });
    A.nooks.push({ x, y, r: U(RING_R - PILLAR_R), R: RING_R * FP });
  });
  mir(d.posts, (x, y) => A.rocks.push({ x, y, r: PILLAR_R * FP, kind: 'post', ring: -1 }));
  if (d.nook) A.nooks.push({ x: U(d.nook[0]), y: U(d.nook[1]), r: U(d.nook[2]), R: U(d.nook[2] + 3) });
  // start slots and return points are listed left then right so index parity tells the side
  mir(d.starts, (x, y) => A.starts.push({ x, y }));
  mir(d.spawns, (x, y) => A.spawns.push({ x, y }));
  mir(d.shoals, (x, y) => A.shoals.push({ x, y, side: x < 0 ? -1 : 1 }));
  mir(d.powerSpots, (x, y) => A.powerSpots.push({ x, y }));
  const hz = d.hazard;
  if (hz.type === 'current') A.current = { hw: U(hz.halfWidth), y0: U(hz.from), y1: U(hz.to), push: hz.push };
  if (hz.type === 'kelp') mir(hz.patches, (x, y, p) => A.kelp.push({ x, y, r: U(p[2]) }));
  if (hz.type === 'cows') {
    const path = hz.path.map(p => ({ x: U(p[0]), y: U(p[1]) }));
    A.cows = { r: U(hz.radius), speed: hz.speed, path, list: [{ x: path[0].x, y: path[0].y, px: path[0].x, py: path[0].y, seg: 0, sign: 1 }, { x: -path[0].x, y: path[0].y, px: -path[0].x, py: path[0].y, seg: 0, sign: -1 }] };
  }
  return A;
}

const PERS = ['hunter', 'trickster', 'shepherd'];

/* opts: { arena, mode, seed, diff, allBots, diffs[6], scripted, events } */
function createSim(opts) {
  const C = CONFIG, S = C.school, G = C.gulp;
  const A = buildArena(opts.arena | 0);
  const seed = opts.seed >>> 0;
  const rSlots = makeRng(mixSeed(seed, 1)), rBots = makeRng(mixSeed(seed, 2)), rFood = makeRng(mixSeed(seed, 3)), rPow = makeRng(mixSeed(seed, 4));
  const FR = U(S.fryRadius), FOODR = U(C.sizes.foodRadius);
  const NEAR = U(S.nearRange), SPARE = U(S.spareRange), DSCAT = U(S.dashScatter), LAT = U(1.5), ROW0 = U(1.3), ROW = U(1.5);
  const sim = {
    arena: A, mode: opts.mode || 'classic', seed, tick: 0, over: false, winner: -1, ranking: null,
    creatures: [], fry: [], food: [], pups: [], events: opts.events ? [] : null, cows: A.cows ? A.cows.list : [],
    limit: opts.mode === 'feast' ? C.modes.feast.ticks : opts.mode === 'survival' ? 0 : C.modes.classic.ticks,
    human: opts.allBots ? -1 : 0, powTimer: C.powerups.spawnEvery, scripted: !!opts.scripted
  };
  const ev = (o) => { if (sim.events) sim.events.push(o); };

  // ---- roster: slot 0 you, 1-3 the named rivals, 4-5 extras ----
  const extraOf = {}; for (const e of C.extras) extraOf[e.pers] = e;
  const rRoster = opts.rosterSeed === undefined ? rBots : makeRng(mixSeed(opts.rosterSeed, 2));   // a cup keeps one roster for all its matches
  const a = rRoster.int(3), b = (a + 1 + rRoster.int(2)) % 3;
  const c3 = 3 - a - b;
  const roster = [opts.allBots ? extraOf[PERS[c3]] : { name: C.hero.name, pers: null, look: C.hero.look }, C.rivals[0], C.rivals[1], C.rivals[2], extraOf[PERS[a]], extraOf[PERS[b]]];
  // ---- start slots from their own stream ----
  const order = [0, 1, 2, 3, 4, 5];
  for (let i = 5; i > 0; i--) { const j = rSlots.int(i + 1); const t = order[i]; order[i] = order[j]; order[j] = t; }
  for (let s = 0; s < 6; s++) {
    const st = A.starts[order[s]], who = roster[s];
    const diff = opts.diffs ? opts.diffs[s] : (opts.diff || 'normal');
    const cr = {
      slot: s, name: who.name, look: who.look, pers: who.pers, diff, prof: who.pers ? C.bots.profiles[who.pers][diff] : null,
      ctrl: opts.scripted ? 'script' : (who.pers ? 'bot' : 'human'),
      x: st.x, y: st.y, px: st.x, py: st.y, vx: 0, vy: 0, hx: st.x < 0 ? 256 : -256, hy: 0, fx: st.x < 0 ? 256 : -256, fy: 0,
      body: C.sizes.start, r: radiusOf(C.sizes.start), tier: 0, size: C.sizes.start, near: 0,
      bubbleT: 0, shield: 0, puShield: 0, puRush: 0, pu: 0, dashT: 0, dashing: false, inKelp: -1,
      school: [], gulps: 0, gulped: 0, food: 0, fryEaten: 0, bestSize: C.sizes.start, maxSchool: 0, startLeft: st.x < 0,
      in: { dx: 0, dy: 0, dash: false, use: false },
      trail: new Int32Array(128), trailI: 0, bx: 0, by: 0, lastGulper: -1,
      ai: { t: s * 3, mode: 0, tx: 0, ty: 0, dash: false, fry: -1, prey: -1, chaseT: 0, ignore: -1, ignoreT: 0, sx: st.x, sy: st.y, stuck: 0, wander: 0, puHold: 0 }
    };
    for (let i = 0; i < 64; i++) { cr.trail[2 * i] = cr.x; cr.trail[2 * i + 1] = cr.y; }
    sim.creatures.push(cr);
  }
  const CR = sim.creatures;

  // ---- food grid ----
  const CELL = 8 * FP, GW = 16, GOFF = 64 * FP;
  const grid = []; for (let i = 0; i < GW * GW; i++) grid.push([]);
  const cellOf = (x, y) => (((y + GOFF) / CELL) | 0) * GW + (((x + GOFF) / CELL) | 0);
  function foodSpot() {                                   // a free spot on the left half, from the food stream
    for (let tries = 0; tries < 60; tries++) {
      const x = -(U(1.5) + rFood.int(U(56))), y = rFood.int(U(114)) - U(57);
      if (x * x + y * y > U(57) * U(57)) continue;
      let ok = true;
      for (const k of A.rocks) { const dx = x - k.x, dy = y - k.y, m = k.r + FP; if (dx * dx + dy * dy < m * m) { ok = false; break; } }
      if (ok) return [x, y];
    }
    return [-U(20), 0];
  }
  function inNook(x, y) { for (let i = 0; i < A.nooks.length; i++) { const n = A.nooks[i], dx = x - n.x, dy = y - n.y; if (dx * dx + dy * dy < n.R * n.R) return i; } return -1; }
  function putFood(f, x, y) { f.x = x; f.y = y; f.alive = true; f.nook = inNook(x, y) >= 0; f.cell = cellOf(x, y); grid[f.cell].push(f.id); ev({ t: 'food', id: f.id }); }
  function takeFood(f) { f.alive = false; const g = grid[f.cell], i = g.indexOf(f.id); g[i] = g[g.length - 1]; g.pop(); }
  if (!opts.scripted) for (let p = 0; p < C.sizes.foodCount / 2; p++) {
    const sp = foodSpot();
    for (let k = 0; k < 2; k++) { const f = { id: sim.food.length, x: 0, y: 0, alive: false, nook: false, cell: 0, pair: p }; sim.food.push(f); putFood(f, k ? -sp[0] : sp[0], sp[1]); }
  }
  const pairT = new Int32Array(C.sizes.foodCount / 2);   // respawn countdown per mirrored pair

  // ---- small fry: mirrored shoals of five ----
  const OFFS = [[0, 0], [-U(2.2), U(1.4)], [U(1.8), U(2.2)], [U(2.4), -U(1.6)], [-U(1.6), -U(2.4)]];
  function addFry(x, y, shoal, k) {
    const f = { id: sim.fry.length, x, y, px: x, py: y, alive: true, owner: -1, court: -1, courtT: 0, safeT: 0, dartT: 0, dvx: 0, dvy: 0, respawnT: 0, shoal, k, hx: 256, hy: 0, free: shoal < 0 };
    sim.fry.push(f); return f;
  }
  if (!opts.scripted) for (let s = 0; s < A.shoals.length; s++) for (let k = 0; k < S.shoalSize; k++) { const sh = A.shoals[s]; addFry(sh.x + OFFS[k][0] * sh.side, sh.y + OFFS[k][1], s, k); }
  function tri(t, p, amp) { const ph = t % p, h = p >> 1, v = ph < h ? ph : p - ph; return ((v * 2 * amp / h) | 0) - amp; }
  function fryHome(f, out) {
    if (f.shoal < 0) { out[0] = f.x; out[1] = f.y; return; }
    const sh = A.shoals[f.shoal];
    out[0] = sh.x + (OFFS[f.k][0] + tri(sim.tick + f.shoal * 97, 1500, U(4))) * sh.side;
    out[1] = sh.y + OFFS[f.k][1] + tri(sim.tick + 400 + (f.shoal >> 1) * 211, 1100, U(3));
  }

  // ---- helpers ----
  function refresh(c) { c.tier = tierOf(c.body); c.r = radiusOf(c.body); }
  function release(f, fromX, fromY) {
    const o = CR[f.owner]; if (o) { const i = o.school.indexOf(f.id); if (i >= 0) o.school.splice(i, 1); }
    f.owner = -1; f.safeT = S.safeTicks; f.court = -1; f.courtT = 0; f.dartT = 30;
    let dx = f.x - fromX, dy = f.y - fromY; const d = isqrt(dx * dx + dy * dy);
    if (d === 0) { dx = 256; dy = 0; } else { dx = (dx * 256 / d) | 0; dy = (dy * 256 / d) | 0; }
    const sp = SPREAD[f.id % 5], rx = (dx * sp[0] - dy * sp[1]) >> 8, ry = (dx * sp[1] + dy * sp[0]) >> 8;   // fan out
    f.dvx = (rx * 120) >> 8; f.dvy = (ry * 120) >> 8; ev({ t: 'free', x: f.x, y: f.y });
  }
  function join(f, c) { f.owner = c.slot; f.court = -1; f.courtT = 0; c.school.push(f.id); if (c.school.length > c.maxSchool) c.maxSchool = c.school.length; ev({ t: 'join', slot: c.slot, n: c.school.length, x: f.x, y: f.y }); }
  function computeSize(c) {
    let n = 0;
    if (c.bubbleT === 0) { const lim = c.r + NEAR + FR; for (let i = 0; i < c.school.length; i++) { const f = sim.fry[c.school[i]], dx = f.x - c.x, dy = f.y - c.y; if (dx * dx + dy * dy <= lim * lim) n++; } }
    c.near = n; c.size = c.body + S.bonus * n; if (c.size > c.bestSize) c.bestSize = c.size;
  }
  function hiddenFrom(t, o) { return t.inKelp >= 0 && t.tier <= 1 && o.inKelp !== t.inKelp; } // t hidden from observer o
  function rankList() {
    const l = CR.slice();
    l.sort((p, q) => (q.size - p.size) || (q.gulps - p.gulps) || (p.gulped - q.gulped) || (q.food - p.food) || (p.slot - q.slot));

      if (f.dartT > 0) { f.x += (f.dvx * f.dartT / 30) | 0; f.y += (f.dvy * f.dartT / 30) | 0; f.dartT--; f.hx = f.dvx; f.hy = f.dvy; }
      else if (f.shoal >= 0) { fryHome(f, tmp); const dx = tmp[0] - f.x, dy = tmp[1] - f.y, d = isqrt(dx * dx + dy * dy); if (d > 48) { f.x += (dx * S.wildSpeed / d) | 0; f.y += (dy * S.wildSpeed / d) | 0; f.hx = (dx * 256 / d) | 0; f.hy = (dy * 256 / d) | 0; } }
      if (A.current && f.x > -A.current.hw && f.x < A.current.hw && f.y > A.current.y0 && f.y < A.current.y1) f.y += A.current.push >> 1;
      { const lim = A.R - FP, d2 = f.x * f.x + f.y * f.y; if (d2 > lim * lim) { const d = isqrt(d2); f.x = (f.x * lim / d) | 0; f.y = (f.y * lim / d) | 0; } }

    let any = false;
    for (let i = 0; i < ord.length; i++) {

      if (sim.pups.length < C.powerups.maxOnField) { const free = A.powerSpots.filter(p => !sim.pups.some(q => q.x === p.x && q.y === p.y)); const sp = free[rPow.int(free.length)]; sim.pups.push({ x: sp.x, y: sp.y, type: 1 + rPow.int(3), born: sim.tick }); ev({ t: 'pup', x: sp.x, y: sp.y }); }
    }

      const p = sim.pups[i];

  sim.computeSize = computeSize; sim.release = release; sim.finish = finish;
  return sim;
}

/* ---- cup scoring ---- */
function cupStandings(results) {                         // results: array of rankings (arrays of slots)
  const P = CONFIG.cup.points, rows = [];
  for (let s = 0; s < 6; s++) rows.push({ slot: s, points: 0, wins: 0, gulps: 0 });
  for (const r of results) { r.ranking.forEach((slot, i) => { rows[slot].points += P[i]; if (i === 0) rows[slot].wins++; }); r.gulps.forEach((g, s) => { rows[s].gulps += g; }); }
  rows.sort((p, q) => (q.points - p.points) || (q.wins - p.wins) || (q.gulps - p.gulps) || (p.slot - q.slot));
  return rows;
}

/* ---- save: versioned key, damaged saves are kept under a backup key ---- */
const Save = {
  fresh() {
    const own = {}, eq = {}; for (const k in CONFIG.cosmetics) { own[k] = CONFIG.cosmetics[k].filter(i => i.price === 0).map(i => i.id); eq[k] = CONFIG.cosmetics[k][0].id; }
    return { v: 1, coins: 0, owned: own, equip: eq, top: [], hints: {}, cups: 0, settings: { music: 70, sfx: 80, diff: 'normal', reduced: false, cb: false, quality: '', lefty: false } };
  },
  valid(d) { return !!d && typeof d === 'object' && d.v === 1 && typeof d.coins === 'number' && d.coins >= 0 && !!d.owned && !!d.equip && Array.isArray(d.top) && !!d.settings && typeof d.settings === 'object'; },
  load(store) {
    let raw = null; try { raw = store.getItem(CONFIG.game.saveKey); } catch (e) { return { data: Save.fresh(), recovered: false }; }
    if (raw === null || raw === undefined) return { data: Save.fresh(), recovered: false };
    let d = null; try { d = JSON.parse(raw); } catch (e) { d = null; }
    if (!Save.valid(d)) { try { store.setItem(CONFIG.game.backupKey, raw); } catch (e) {} const f = Save.fresh(); Save.store(store, f); return { data: f, recovered: true }; }
    const f = Save.fresh(); for (const k in f.settings) if (!(k in d.settings)) d.settings[k] = f.settings[k]; for (const k in f.owned) { if (!Array.isArray(d.owned[k])) d.owned[k] = f.owned[k]; if (!d.equip[k]) d.equip[k] = f.equip[k]; } if (!d.hints) d.hints = {};
    return { data: d, recovered: false };
  },
  store(store, d) { try { store.setItem(CONFIG.game.saveKey, JSON.stringify(d)); return true; } catch (e) { return false; } },
  addScore(d, size) { d.top.push({ size: size | 0 }); d.top.sort((p, q) => q.size - p.size); if (d.top.length > 10) d.top.length = 10; }
};
function memoryStore(init) { const m = Object.assign({}, init || {}); return { getItem: k => (k in m ? m[k] : null), setItem: (k, v) => { m[k] = String(v); }, removeItem: k => { delete m[k]; } }; }

    s.events.length = 0; s.human = 0;
    return { name, sim: s, drive, t: 0 };
  }
  function runStage(name, cap) { const st = mkStage(name); G.stage = st; G.sim = st.sim; G.focus = 0; G.playing = false; G.paused = false; G.podium = null; G.acc = 0; G.cam.ready = false; lastBoard = ''; Scene.reset(st.sim); show('', ''); showHud(true); Snd.music(CONFIG.arenas[st.sim.arena.index].music); caption(cap || ''); return st; }
  function stageAt(name, ticks) { const st = runStage(name); for (let i = 0; i < ticks; i++) { st.drive(st.t++); st.sim.step(); handleEvents(st.sim, false); } return st; }
  function samplePodium() { const s = createSim({ arena: 0, mode: 'classic', seed: 4, rosterSeed: 4 }); const names = s.creatures.map(c => c.name), looks = s.creatures.map((c, i) => i === 0 ? null : c.look); const res = [[0, 1, 3, 2, 4, 5], [1, 0, 2, 3, 5, 4], [0, 3, 1, 2, 4, 5], [3, 0, 1, 4, 2, 5], [0, 1, 3, 2, 5, 4]].map((r, i) => ({ ranking: r, gulps: [3, 4, 1, 1, 0, 1].map((g, k) => (g + i * k) % 5) })); podiumScreen(cupStandings(res), names, looks, 0); }

  const Tour = {
    on: false, i: -1, until: 0, list: [['title', 5], ['school', 9], ['gulp', 7], ['scatter', 8], ['powerup', 7], ['current', 6], ['kelp', 6], ['cows', 6], ['podium', 6]],
    start() { Tour.on = true; Tour.i = -1; Tour.until = 0; Tour.t0 = performance.now(); },
    step(now) { if (!Tour.on || now < Tour.until) return; Tour.i++; if (Tour.i >= Tour.list.length) { Tour.stop(false); return; } const [n, secs] = Tour.list[Tour.i]; Tour.until = (Tour.i === 0 ? now : Tour.until) + secs * 1000; if (n === 'title') { titleScreen(); caption(''); } else if (n === 'podium') { samplePodium(); caption(''); } else runStage(n, T.tour[Tour.i]); },
    stop(byUser) { if (!Tour.on) return; Tour.on = false; G.stage = null; caption(''); G.sim = G.bgSim; if (G.sim) Scene.reset(G.sim); G.cam.ready = false; titleScreen(); if (byUser) toast(T.tourStop); window.__tourDone = true; }
  };

  // ---------- drawing and the main loop ----------
  const env = { fog: [0, 0, 0], fogA: 80, fogB: 300, t: 0, q: 1, R: 60, sand: [1, 1, 1], water: [0, 0, 0], cur: [0, 0, 0, 0], kelp: new Float32Array(12), nook: new Float32Array(9) };
  const qt = [0, 0, 0, 1], Q0 = [0, 0, 0, 1];
  function setEnv(sim, dist) {
    const A = sim.arena, d = A.def; env.sand = d.sand; env.water = d.water; env.fog = [d.water[0] * 0.9 + 0.05, d.water[1] * 0.95 + 0.05, d.water[2] * 0.95 + 0.06]; env.fogA = dist * 1.4; env.fogB = dist * 4.2; env.R = A.R / FP; env.q = save.settings.quality === 'high' ? 1 : 0; env.t = save.settings.reduced ? Scene.time * 0.3 : Scene.time;
    env.cur[3] = A.current ? 1 : 0; if (A.current) { env.cur[0] = A.current.hw / FP; env.cur[1] = A.current.y0 / FP; env.cur[2] = A.current.y1 / FP; }
    env.kelp.fill(0); A.kelp.forEach((k, i) => { if (i < 4) { env.kelp[i * 3] = k.x / FP; env.kelp[i * 3 + 1] = k.y / FP; env.kelp[i * 3 + 2] = k.r / FP; } });
    env.nook.fill(0); A.nooks.forEach((k, i) => { if (i < 3) { env.nook[i * 3] = k.x / FP; env.nook[i * 3 + 1] = k.y / FP; env.nook[i * 3 + 2] = k.r / FP; } });
  }
  function drawFrame(dt, al) {
    const sim = G.sim, aspect = innerWidth / Math.max(1, innerHeight), pf = aspect < 1 ? 1 + (1 - aspect) * 1.1 : 1, cam = G.cam;
    GLR.resize(save.settings.quality === 'high' ? Math.min(window.devicePixelRatio || 1, 2) : Math.min(window.devicePixelRatio || 1, 1));
    let eye, tgt, dist = 60;
    const equip = save.equip;
    if (G.showroom) { const sx = aspect > 1 ? 2.6 : 0, sy = aspect > 1 ? 0 : -2.6; eye = [sx, 41 + sy, 13 * pf]; tgt = [sx, 40 + sy, 0]; dist = 30; }
    else if (G.podium) { eye = [0, 8, 34 * pf]; tgt = [0, aspect > 1 ? -0.4 : -4.5 * pf, 0]; dist = 40; }
    else if (G.cover) { eye = [-7.5, 11, 39]; tgt = [-14, 2.0, 14]; dist = 36; }
    else {
      let tx = 0, tz = 0, h = 66;
      if (G.focus >= 0) { const c = sim.creatures[G.focus], v = Scene.views[G.focus]; if (c.bubbleT > 0 && v) { tx = v.sx; tz = v.sz + 2; } else { tx = (c.px + (c.x - c.px) * al) / FP; tz = (c.py + (c.y - c.py) * al) / FP; } h = 30 + 12 * (c.r / FP); }
      else { let bd = 1e18, bx = 0, bz = 0; for (let i = 0; i < 6; i++) for (let j = i + 1; j < 6; j++) { const p = sim.creatures[i], q = sim.creatures[j]; if (p.bubbleT > 0 || q.bubbleT > 0) continue; const d = (p.x - q.x) * (p.x - q.x) + (p.y - q.y) * (p.y - q.y); if (d < bd) { bd = d; bx = (p.x + q.x) / 2 / FP; bz = (p.y + q.y) / 2 / FP; } } tx = bx * 0.85 + (aspect > 1.2 ? 15 : 0); tz = bz * 0.85 + (aspect > 1.2 ? 2 : 13); const tl = Math.hypot(tx, tz); if (tl > 26) { tx *= 26 / tl; tz *= 26 / tl; } h = aspect > 1 ? 46 : 56; }   // the title follows the closest chase
      h *= pf;
      if (!cam.ready) { cam.x = tx; cam.z = tz; cam.h = h; cam.ready = true; }
      const k = Math.min(1, dt * (G.focus >= 0 ? 7 : 0.6)); cam.x += (tx - cam.x) * k; cam.z += (tz - cam.z) * k; cam.h += (h - cam.h) * Math.min(1, dt * 2);
      eye = [cam.x, cam.h, cam.z + cam.h * 0.62]; tgt = [cam.x, 0, cam.z]; dist = cam.h * 1.18;
    }
    GLR.setCamera(eye, tgt, aspect); setEnv(sim, dist);
    Scene.draw({ sim, alpha: al, dt, focus: (G.playing || G.stage) ? G.focus : -1, equip, showRings: (G.playing || !!G.stage) });
    if (G.showroom) { const t = Scene.time; Scene.creature({ x: 0, y: 40 + Math.sin(t * 2) * 0.15, z: 0, r: 2.05, yaw: -Math.PI / 2 + 0.5 + Math.sin(t * 0.6) * 0.9, roll: 0, look: playerLook(), swim: 0.5, mouth: 0.15, squash: 0, blink: (t % 3.4), t, eq: equip, alpha: 1 }); for (let i = 0; i < 4; i++) { const a = t * 0.8 + i * 1.57; Scene.spawn(1, Math.cos(a) * 4, 37 + (i * 1.7 + t) % 6, Math.sin(a) * 2 - 1, 0, 0.8, 0, 0.05, 0.16, [0.9, 1, 1]); } }
    if (G.podium) {
      const P = G.podium, t = Scene.time, hs = [4.6, 3.2, 2.2], xs = [0, -7.2, 7.2]; P.t += dt;
      for (let i = 0; i < 3; i++) {
        const h = hs[i], x = xs[i]; GLR.put('box', 0, x, h / 2, 0, 6.6, h, 5.4, Q0, [[1.0, 0.82, 0.3], [0.78, 0.86, 0.92], [0.95, 0.62, 0.42]][i], 1, 0, 0); GLR.put('box', 0, x, h + 0.12, 0, 7.0, 0.3, 5.8, Q0, [0.2, 0.62, 0.6], 1, 0, 0);
        for (let k = 0; k <= i; k++) GLR.put('ball', 0, x + (k - i / 2) * 0.9, h * 0.55, 2.75, 0.3, 0.3, 0.14, Q0, [1, 1, 1], 1, 0.6, 0);
        const row = P.rows[i]; if (!row) continue; const look = row.slot === 0 ? playerLook() : P.looks[row.slot], hop = i === 0 ? Math.abs(Math.sin(t * 4)) * 0.9 : Math.abs(Math.sin(t * 2.4 + i)) * 0.25;
        Scene.creature({ x, y: h + 2.3 + hop, z: 0.2, r: 2.1, yaw: -Math.PI / 2 + Math.sin(t * 1.5 + i) * 0.25, roll: 0, look, swim: 0.8, mouth: i === 0 ? 0.7 : 0.2, squash: 0, blink: (t + i) % 3.1, t: t + i, eq: row.slot === 0 ? equip : null, alpha: 1 });
      }
      if (!save.settings.reduced && P.t > 0.2) { P.t = 0; Scene.rain(5); }
    }
    GLR.render(env);
  }
  let slowFrames = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const real = Math.min(G.stage ? 0.25 : 0.1, Math.max(0, (now - G.last) / 1000));   // a slow frame may catch up a little; scripted scenes a bit more G.last = now; G.frame++;
    if (document.hidden || !gfxOk) return;
    const t0 = performance.now(); Tour.step(now); const pad = pollPad(); let dt = real, sim = G.sim; if (!sim) return;
    if (G.cover || G.paused) dt = 0;
    else {
      G.acc += G.hold ? 0 : real; let n = 0;
      const cap = G.stage ? 16 : 7;
      while (G.acc >= 1 / 60 && n < cap) {
        G.acc -= 1 / 60; n++;
        if (G.stage) { G.stage.drive(G.stage.t++); sim.step(); handleEvents(sim, true); }
        else if (G.playing) { applyInput(sim.creatures[0], pad); sim.step(); G.matchT += 1 / 60; handleEvents(sim, true); hintsTick(sim); if (sim.over && !G.endT) { G.endT = now + 1500; caption(sim.mode === 'survival' ? T.runOver : T.timeUp, 1.4); } }
        else if (G.podium || G.screen === 'results') { /* a still stage */ }
        else { sim.step(); handleEvents(sim, false); if (sim.over) { newBg(); sim = G.sim = G.bgSim; } }
      }
      if (n === cap) G.acc = 0;
    }
    if (G.playing && G.endT && now > G.endT) { G.endT = 0; endMatch(); sim = G.sim; }
    const al = (sim.over || G.paused || G.cover) ? 1 : Math.min(1, G.acc * 60);
    drawFrame(dt, al);
    const hudOn = (G.playing || G.stage) && !G.cover; if (hudOn) updateHud();
    const touchOn = In.mode === 'touch' && G.playing && !G.paused; $('touch').classList.toggle('hide', !touchOn); document.body.classList.toggle('touching', touchOn);
    const cpu = performance.now() - t0; stats.cpuMs += (cpu - stats.cpuMs) * 0.05; stats.frameMs += (real * 1000 - stats.frameMs) * 0.05; stats.drawCalls = GLR.stats.drawCalls; stats.instances = GLR.stats.instances; stats.frames++;
    if (save.settings.qualityAuto && save.settings.quality === 'high' && G.playing && !G.paused) { slowFrames = real > 0.04 ? slowFrames + 1 : Math.max(0, slowFrames - 2); if (slowFrames > 150) { save.settings.quality = 'low'; persist(); applySettings(); toast(fmt(T.qualityAuto, { q: T.low })); slowFrames = 0; } }
  }

  // ---------- self test page ----------
  function selftestScreen() {
    show('selftest', '<div class="panel"><h2>' + esc(CONFIG.game.name) + ' - ' + esc(T.selftest) + '</h2><table id="stt"></table><p class="mt" id="stline">' + esc(T.running) + '</p></div>');
    const tb = $('stt'), res = { done: false, pass: 0, total: SelfTest.checks.length, lines: [] }; window.__selftest = res; let i = 0;
    const next = () => {
      if (i >= SelfTest.checks.length) { res.done = true; res.line = 'SELFTEST ' + res.pass + '/' + res.total + ' passed'; $('stline').textContent = res.line; $('stline').className = 'mt ' + (res.pass === res.total ? 'ok' : 'bad'); return; }
      const c = SelfTest.checks[i++]; let r; try { r = c.run(); } catch (e) { r = { pass: false, detail: 'ERROR ' + e.message }; }
      if (r.pass) res.pass++; res.lines.push((r.pass ? 'PASS' : 'FAIL') + ' | ' + c.name + ' | ' + r.detail);
      const tr = document.createElement('tr'); tr.innerHTML = '<td class="' + (r.pass ? 'ok' : 'bad') + '">' + (r.pass ? esc(T.pass) : esc(T.fail)) + '</td><td>' + esc(c.name) + '</td><td>' + esc(r.detail) + '</td>'; tb.appendChild(tr); tr.scrollIntoView({ block: 'nearest' });
      setTimeout(next, 20);
    };
    setTimeout(next, 50);
  }

  // ---------- boot ----------
  window.NL = { G, stats, In, Tour, runStage, stageAt, samplePodium, toast, caption, save: () => save, startMatch, version: 1 };
  if (params.get('selftest')) { selftestScreen(); return; }
  if (!gfxOk) { show('title', '<div class="logo"><span class="l1">' + esc(CONFIG.game.name) + '</span></div><div class="tag">' + esc(T.noGl) + '</div>'); return; }
  if (params.get('cover')) {
    G.cover = true; const st = mkStage('cover'); G.sim = st.sim; G.focus = -1; Scene.reset(st.sim); showHud(false);
    const nm = CONFIG.game.name, i = nm.lastIndexOf(' '); const cvr = $('cover'); cvr.classList.remove('hide'); cvr.innerHTML = '<div class="logo"><span class="l1">' + esc(i > 0 ? nm.slice(0, i) : nm) + '</span>' + (i > 0 ? '<span class="l2">' + esc(nm.slice(i + 1)) + '</span>' : '') + '</div><div class="tag">' + esc(T.tagline) + '</div>';
  } else {
    titleScreen();
    if (loaded.recovered) toast(T.saveDamaged);
    if (params.get('tour')) Tour.start(); else if (firstRunToast) toast(firstRunToast);
  }
  G.last = performance.now(); requestAnimationFrame(frame);
})();

</script>
