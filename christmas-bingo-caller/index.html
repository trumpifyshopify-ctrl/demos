function icon(i,cls=''){return `<svg class="${cls}" viewBox="0 0 104 104" role="img" aria-label="${esc(labels[i])}"><g stroke-linecap="round" stroke-linejoin="round" stroke-width="3">${paths[i]}</g></svg>`}
const patterns={line:'Single line',two:'Two lines',corners:'Four corners',x:'X pattern',frame:'Frame',blackout:'Blackout'};
function hash(str){let h=2166136261;for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=hash(seed);return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,r){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function parseCode(s){if(typeof s!=='string')throw Error('Enter a set code.');const code=s.trim().toUpperCase();const m=/^FL1-([PWN])([345])([FZ])-([A-Z0-9]{6})$/.exec(code);if(!m||m[2]==='4'&&m[3]==='F')throw Error('Use a code like FL1-P5F-WINTER. A 4×4 card has no centre.');return{code,type:m[1],size:+m[2],free:m[3]==='F',seed:m[4]}}
function pool(code){return Array.from({length:parseCode(code).type==='N'?75:labels.length},(_,i)=>i)}
function card(code,num){const c=parseCode(code);if(!Number.isInteger(num)||num<1||num>80)throw Error('Choose a card number from 1 to 80.');const seen=new Set();let cells;for(let k=1;k<=num;k++){let retry=0,key;do{const r=rng(c.code+'|card|'+k+'|'+retry++);if(c.type==='N'){const cols=c.size===5?[0,1,2,3,4]:c.size===4?[0,1,3,4]:[0,2,4];const columns=cols.map(col=>shuffle(Array.from({length:15},(_,i)=>col*15+i),r).slice(0,c.size));cells=Array.from({length:c.size*c.size},(_,i)=>columns[i%c.size][Math.floor(i/c.size)])}else cells=shuffle(pool(code),r).slice(0,c.size*c.size);if(c.free)cells[Math.floor(cells.length/2)]=-1;key=cells.join(',')}while(seen.has(key));seen.add(key)}return cells}
function lines(n){let a=[];for(let r=0;r<n;r++)a.push(Array.from({length:n},(_,c)=>r*n+c));for(let c=0;c<n;c++)a.push(Array.from({length:n},(_,r)=>r*n+c));a.push(Array.from({length:n},(_,i)=>i*n+i),Array.from({length:n},(_,i)=>i*n+n-1-i));return a}
function evaluate(cells,called,n,pattern){if(!patterns[pattern]||cells.length!==n*n)throw Error('Unknown pattern or card.');let marked=cells.map(x=>x===-1||called.includes(x));let candidates;if(pattern==='line'||pattern==='two')candidates=lines(n);else if(pattern==='corners')candidates=[[0,n-1,n*(n-1),n*n-1]];else if(pattern==='x')candidates=[[...new Set([...lines(n).at(-2),...lines(n).at(-1)])]];else if(pattern==='frame')candidates=[cells.map((_,i)=>i).filter(i=>i<n||i>=n*(n-1)||i%n===0||i%n===n-1)];else candidates=[cells.map((_,i)=>i)];const complete=candidates.filter(a=>a.every(i=>marked[i]));const valid=complete.length>=(pattern==='two'?2:1);return{valid,marked,winning:valid?[...new Set(complete.slice(0,pattern==='two'?2:1).flat())]:[]}}
function deck(s){return shuffle(pool(s.code),rng(s.code+'|round|'+s.round))}
const defaultState=()=>({version:1,code:'FL1-P5F-WINTER',count:12,pattern:'line',round:1,called:[],mute:false,interval:5});
function validate(o){if(!o||typeof o!=='object'||Array.isArray(o))throw Error('This is not a Frostlume backup.');if(o.version!==1)throw Error('Unsupported backup version.');const c=parseCode(o.code);if(!Number.isInteger(o.count)||o.count<1||o.count>80||!patterns[o.pattern]||!Number.isInteger(o.round)||o.round<1||o.round>100000||typeof o.mute!=='boolean'||!Number.isInteger(o.interval)||o.interval<3||o.interval>30||!Array.isArray(o.called))throw Error('Invalid settings in this backup.');const p=pool(c.code);if(o.called.length>p.length||new Set(o.called).size!==o.called.length||o.called.some(x=>!Number.isInteger(x)||!p.includes(x)))throw Error('Invalid or repeated calls in backup.');const s={version:1,code:c.code,count:o.count,pattern:o.pattern,round:o.round,called:[...o.called],mute:o.mute,interval:o.interval};if(s.called.some((x,i)=>deck(s)[i]!==x))throw Error('The saved calls do not match this round.');return s}

function caller(){const c=parseCode(state.code),last=state.called.at(-1),len=pool(state.code).length;return title('Gather round, get cosy','A little luck. A lot of wonder.', 'Find your card, settle in, and let the winter magic begin.',`Round ${state.round}`)+`<div class="callergrid"><section class="stage" aria-label="Current call">${scene}<div class="stagecontent" id="reveal"><div class="eyebrow">${last===undefined?'YOUR WINTER NIGHT STARTS HERE':`CALL ${state.called.length} OF ${len}`}</div>${last===undefined?icon(22,'callart'):itemMarkup(last,true)}<div class="callname ${c.type==='W'&&last!==undefined?'wordcall':''}">${last===undefined?'Shall we begin?':c.type==='N'?'':esc(labels[last])}</div><div class="subline">${last===undefined?'Press Next call when everyone is ready.':state.called.length===len?'All calls are in. Time to check those cards.':'One call closer to a little celebration.'}</div></div></section><aside class="side"><div class="panel"><div class="eyebrow muted">Still to come</div><div class="metric"><strong>${len-state.called.length}</strong><span>of ${len} calls</span></div><div class="progress"><i style="width:${state.called.length/len*100}%"></i></div></div><div class="panel"><div class="eyebrow muted">Tonight’s pattern</div><div class="patternrow">${patternMini(state.pattern)}<div><strong>${patterns[state.pattern]}</strong><div><small class="muted">${c.size} × ${c.size}${c.free?' · free centre':''}</small></div></div></div><button class="secondary" data-view="check" style="width:100%;margin-top:15px">Check a winner</button></div><div class="panel setpanel"><div class="setinner"><div><div class="eyebrow muted">Your shared set</div><div class="code">${state.code}</div><small class="muted">${state.count} cards · ${c.type==='P'?'Picture':c.type==='W'?'Christmas word':'75-number'} bingo</small></div></div></div></aside><div class="controlbar"><button class="next" data-action="next" ${state.called.length===len?'disabled':''}>Next call <span aria-hidden="true">→</span></button><button class="secondary" data-action="undo" ${state.called.length?'':'disabled'}>Undo</button><div class="timerbox"><label for="interval">Every</label><select id="interval" aria-label="Auto-call interval">${Array.from({length:28},(_,i)=>i+3).map(x=>`<option value="${x}" ${state.interval===x?'selected':''}>${x} sec</option>`).join('')}</select><button class="secondary" data-action="auto" id="autobtn">${timer?'Pause auto':'Start auto'}</button><small class="muted" id="countdown">${timer?remaining+'s':''}</small></div><span class="spacer"></span><button class="secondary" data-action="mute" aria-pressed="${state.mute}">${state.mute?'Sound off':'Sound on'}</button><button class="secondary" data-action="round">New round</button><button class="secondary" data-action="fullscreen">TV view</button></div></div><p class="shortcut"><kbd>Space</kbd> / <kbd>→</kbd> next &nbsp; <kbd>U</kbd> undo &nbsp; <kbd>M</kbd> sound &nbsp; <kbd>A</kbd> auto &nbsp; <kbd>Esc</kbd> pause</p><div class="historyhead"><h3>The whole winter collection</h3><span class="muted"><small>${state.called.length} called · marked in green</small></span></div><div class="historyboard" aria-label="Full call history">${pool(state.code).map(i=>`<div class="historyitem ${state.called.includes(i)?'called':''} ${last===i?'latest':''}" aria-label="${esc(labelItem(i))}: ${state.called.includes(i)?'called '+(state.called.indexOf(i)+1):'not called'}">${c.type==='P'?icon(i):''}<span>${esc(labelItem(i))}</span>${state.called.includes(i)?'<em>'+ (state.called.indexOf(i)+1)+'</em>':''}</div>`).join('')}</div>`}
function setup(){const c=parseCode(state.code);return title('Make it your night','Small setup. Big smiles.','Choose your game, then share one set code with your players.')+`<div class="twocol"><section class="panel"><h3>Tonight’s game</h3><form id="setupform"><div class="formgrid" style="margin-top:20px"><label class="field">Game type<select id="type">${[['P','Picture bingo'],['W','Christmas word bingo'],['N','Classic 75-number bingo']].map(([v,t])=>`<option value="${v}" ${c.type===v?'selected':''}>${t}</option>`).join('')}</select></label><label class="field">Card size<select id="size">${[3,4,5].map(n=>`<option value="${n}" ${c.size===n?'selected':''}>${n} × ${n}</option>`).join('')}</select></label><label class="field">Winning pattern<select id="pattern">${Object.entries(patterns).map(([v,t])=>`<option value="${v}" ${state.pattern===v?'selected':''}>${t}</option>`).join('')}</select></label><label class="field">Number of cards<input id="count" type="number" min="1" max="80" step="1" value="${state.count}" required></label><label class="checklabel wide"><input id="free" type="checkbox" ${c.free?'checked':''} ${c.size===4?'disabled':''}>Free centre (3 × 3 and 5 × 5)</label><small id="freehelp" class="muted wide">${c.size===4?'A 4 × 4 card has no single centre; free centre is off.':'The centre is already marked for everyone.'}</small><label class="field wide">Six-character seed<input id="seed" class="code" value="${c.seed}" maxlength="6" pattern="[A-Za-z0-9]{6}" required aria-describedby="seedhelp"></label><small class="muted wide" id="seedhelp">Six letters or numbers, such as WINTER. Same code, same cards, every time.</small></div><div id="setuperror" class="error" role="status"></div><div class="formactions"><button class="red" type="submit">Save game & go to caller</button><button type="button" class="secondary" data-action="randomseed">Surprise seed</button></div></form><hr class="divider"><h3>Joining an existing set?</h3><label class="field" style="margin-top:12px">Shared set code<input id="loadcode" class="code" value="${state.code}" maxlength="20"></label><button class="secondary" data-action="loadcode" style="margin-top:12px">Use this set code</button><div id="codeerror" class="error" role="status"></div></section><aside class="panel"><div class="eyebrow muted">The first-minute guide</div><h2 style="margin-top:10px">From printer<br>to party.</h2><div class="steps"><div class="step"><b>1</b><div><h3>Choose & print</h3><p>Pick your game and print a numbered card for each player. Everyone uses the same set code.</p></div></div><div class="step"><b>2</b><div><h3>Call & mark</h3><p>Put the caller on your TV. Players mark their paper cards as each item appears.</p></div></div><div class="step"><b>3</b><div><h3>Check & cheer</h3><p>Someone shouts bingo? Enter their card number. We’ll check the saved calls for you.</p></div></div></div><div class="note">Changing just the card count or pattern keeps your calls and cards. Changing the set asks before starting fresh.</div></aside></div>`}
function cardHTML(num,result=null){const c=parseCode(state.code),cells=card(state.code,num);return `<article class="bcard" aria-label="Bingo card ${num}"><div class="bcardhead"><strong>Frostlume Bingo</strong><span>Card ${num}</span></div><div class="bgrid" style="--n:${c.size}">${cells.map((id,i)=>`<div class="cell ${id===-1?'free':c.type==='W'?'word':c.type==='N'?'number':''} ${result?.marked[i]?'marked':''} ${result?.winning.includes(i)?'winning':''}" aria-label="${id===-1?'Free centre':esc(labelItem(id))}${result?.marked[i]?', marked':''}${result?.winning.includes(i)?', winning cell':''}">${id===-1?'<span aria-hidden="true" style="font-size:24px">✦</span><span>FREE</span>':c.type==='P'?icon(id)+'<span>'+esc(labels[id])+'</span>':c.type==='N'?`<small>${'BINGO'[Math.floor(id/15)]}</small><span>${id+1}</span>`:esc(labels[id])}</div>`).join('')}</div><div class="bcardfoot"><span class="code">${state.code}</span><br>Card ${num} · Keep the same set code for everyone.</div></article>`}
function cards(){return title('A place at the table','Cards made for your gathering.','A unique little patch of winter for every player.',`${state.count} unique cards`)+`<div class="twocol"><section class="panel"><h3>The print studio</h3><p class="muted" style="margin-top:8px;font-size:14px">Choose your paper and layout. Preview every page before printing.</p><div class="formgrid" style="margin-top:22px"><label class="field">Paper size<select id="paper"><option value="A4">A4 · 210 × 297 mm</option><option value="Letter" ${printSpec.paper==='Letter'?'selected':''}>US Letter · 8.5 × 11 in</option></select></label><label class="field">Cards per page<select id="perpage">${[1,2,4].map(n=>`<option value="${n}" ${printSpec.per===n?'selected':''}>${n} per page</option>`).join('')}</select></label></div><div class="formactions"><button class="red" data-print="cards">Preview cards</button><button class="secondary" data-print="checklist">Caller checklist</button><button class="secondary" data-print="slips">Call slips</button></div><div class="note">Print at 100% scale, with browser headers and footers off. Choose the matching paper size. Cut on the dashed lines. For younger players, try one or two cards per page.</div><hr class="divider"><label class="field">Preview a card<select id="previewnum">${Array.from({length:state.count},(_,i)=>`<option value="${i+1}" ${selected===i+1?'selected':''}>Card ${i+1}</option>`).join('')}</select></label><div class="note">Set code <span class="code">${state.code}</span><br>Cards remain the same when you add players or start a new round.</div></section><div class="previewcard" id="samplecard">${cardHTML(selected)}</div></div>`}
function check(){return title('A little moment of truth','Did someone say bingo?','We check the saved calls. No guessing, no accidental marks.')+`<div class="twocol"><section class="panel"><h3>Find the lucky card</h3><div class="formgrid" style="margin-top:20px"><label class="field">Card number<input id="cardnum" type="number" min="1" max="${state.count}" step="1" value="${selected}" inputmode="numeric"></label><label class="field">Winning pattern<select id="checkpattern">${Object.entries(patterns).map(([v,t])=>`<option value="${v}" ${state.pattern===v?'selected':''}>${t}</option>`).join('')}</select></label></div><button class="red" data-action="check" style="margin-top:18px">Check this card</button><div id="checkerror" class="error" role="status"></div><div id="checkresult" aria-live="polite"></div><hr class="divider"><p class="muted" style="font-size:13px;margin-bottom:12px">Or choose a card below:</p><div class="cardlist" aria-label="Choose card">${Array.from({length:state.count},(_,i)=>`<button class="secondary ${selected===i+1?'selected':''}" data-card="${i+1}" aria-label="Check card ${i+1}">${i+1}</button>`).join('')}</div><div class="note"><strong>${state.called.length} calls recorded.</strong> Green cells are called; outlined green cells complete the winning pattern. Free centres count automatically.</div></section><div class="previewcard" id="checkedcard">${cardHTML(selected)}</div></div>`}
function help(){return title('Keep the good times going','A calm little hosting guide.','Everything stays on your device. No account, no internet, just you and your guests.')+`<div class="helpgrid"><section class="panel"><h3>One shared code, unique cards</h3><p>The code includes the game type, size, free-centre setting and seed. Use it in Set up to rebuild a set. Card number 1 always has the same layout for that code, even when you add more cards. Pick a six-letter seed to make a new set.</p><h3 style="margin-top:20px">Patterns, simply put</h3><p><strong>Single line:</strong> any full row, column or diagonal. <strong>Two lines:</strong> any two different lines; they may cross. <strong>Four corners:</strong> all four corner cells. <strong>X:</strong> both diagonals. <strong>Frame:</strong> every edge cell. <strong>Blackout:</strong> every cell.</p><h3 style="margin-top:20px">Three ways to play</h3><p>Picture and word games have ${labels.length} calls. Number bingo uses all 75 numbers. Five-column cards use B, I, N, G, O. Four-column cards use B, I, G, O; three-column cards use B, N, O. A 4 × 4 card has no single free centre.</p></section><section class="panel"><h3>A backup for peace of mind</h3><p>Calls and settings save automatically when your browser allows it. Reload always pauses the caller. File-based saving depends on your browser; export a backup before closing for the night.</p><div class="formactions"><button data-action="export">Export JSON backup</button><button class="secondary" data-action="import">Import JSON backup</button></div><input type="file" id="importfile" accept=".json,application/json" hidden><div id="backuperror" class="error" role="status"></div><div id="backupstatus" class="note" hidden></div><hr class="divider"><h3>A fresh round, same cards</h3><p>New round clears only the calls and advances the round number. Shuffle order changes; cards stay the same. Set up asks before changing your printed set.</p><div class="formactions"><button class="secondary" data-action="round">New round</button><button class="secondary" data-action="reset">Reset everything</button></div></section><section class="panel"><h3>Print without surprises</h3><p>Choose A4 or US Letter and one, two or four cards per page in Cards & print. You can also print a caller checklist or cut-out call slips. In the browser print dialog choose the matching paper, 100% scale and no headers or footers. Use printer-safe margins; actual printers vary.</p><h3 style="margin-top:20px">On a TV or tablet</h3><p>Use TV view for fullscreen if available, or use your browser’s fullscreen control. Auto-call pauses when you leave Caller, open a check, switch away from the page or finish the deck. It never restarts by itself.</p></section><section class="panel"><h3>Keyboard & comfort</h3><p><kbd>Space</kbd> or <kbd>→</kbd> next call. <kbd>U</kbd> undo. <kbd>M</kbd> mute. <kbd>A</kbd> start or pause auto-call. <kbd>Esc</kbd> close confirmation or pause. Shortcuts stay out of your way while typing.</p><p>Sound is a short original chime, generated on your device after a click. Sound off stays off. Your system’s reduced-motion preference removes movement and falling confetti. Buttons work with touch or keyboard; focus is always visible.</p><p>Keep this single HTML file to play offline. Upload it as index.html to any static web host for a shareable demo. There are no external requests, tracking or accounts.</p></section></div>`}
function render(){const active=document.activeElement?.dataset?.action;$('#main').innerHTML=({caller,setup,cards,check,help}[view])();if(view==='setup')$('#setupform').addEventListener('submit',setupSubmit);if(view==='help')$('#importfile').addEventListener('change',importFile);if(active&&view==='caller')$(`[data-action="${active}"]`)?.focus({preventScroll:true})}
function chime(win=false){if(state.mute)return;try{context??=new(window.AudioContext||window.webkitAudioContext)();if(context.state==='suspended')context.resume().catch(()=>{});let t=context.currentTime;for(let i=0;i<(win?4:2);i++){const o=context.createOscillator(),g=context.createGain();o.type='sine';o.frequency.value=(win?[523.25,659.25,783.99,1046.5]:[659.25,880])[i];g.gain.setValueAtTime(0,t+i*.12);g.gain.linearRampToValueAtTime(.1,t+i*.12+.015);g.gain.exponentialRampToValueAtTime(.001,t+i*.12+.3);o.connect(g);g.connect(context.destination);o.start(t+i*.12);o.stop(t+i*.12+.32)}}catch(e){announce('Sound is unavailable in this browser. You can keep playing.')}}
function next(){if(view!=='caller'||$('#confirm').open)return;const d=deck(state);if(state.called.length>=d.length){pause();return}state.called.push(d[state.called.length]);save();chime();render();$('#reveal')?.classList.add('reveal');announce('Call '+state.called.length+': '+labelItem(state.called.at(-1)));if(state.called.length===d.length){pause();render()}}
function pause(){if(timer){clearInterval(timer);timer=null}remaining=0;const b=$('#autobtn');if(b)b.textContent='Start auto';if($('#countdown'))$('#countdown').textContent=''}
function auto(){if(timer){pause();return}if(view!=='caller'||state.called.length===pool(state.code).length)return;remaining=state.interval;timer=setInterval(()=>{remaining--;if(remaining<=0){next();remaining=state.interval}if($('#countdown'))$('#countdown').textContent=timer?remaining+'s':''},1000);$('#autobtn').textContent='Pause auto';$('#countdown').textContent=remaining+'s';announce('Auto-call started. Every '+state.interval+' seconds.')}
function undo(){pause();if(state.called.length){state.called.pop();save();render();announce('Last call undone. It will be called next.')}}
let confirmAction=null,restoreFocus=null;
function confirmPage(name,text,fn){pause();restoreFocus=document.activeElement;$('#confirmtitle').textContent=name;$('#confirmtext').textContent=text;confirmAction=fn;$('#confirm').showModal();$('#cancelconfirm').focus()}
$('#confirm').addEventListener('close',()=>{const fn=confirmAction;confirmAction=null;if($('#confirm').returnValue==='ok'&&fn)fn();else restoreFocus?.isConnected&&restoreFocus.focus()});$('#confirm').addEventListener('cancel',()=>{confirmAction=null});
function applySet(nextState){const different=nextState.code!==state.code;const apply=()=>{pause();state=different?{...nextState,called:[],round:1}:nextState;selected=Math.min(selected,state.count);save();go('caller');announce('Your game is ready.')};if(different&&state.called.length)confirmPage('Change your printed set?','This starts a fresh set and clears the current calls. Your existing paper cards will use a different code.',apply);else apply()}
function setupSubmit(e){e.preventDefault();try{const n=+$('#size').value,count=+$('#count').value,seed=$('#seed').value.trim().toUpperCase();if(!Number.isInteger(count)||count<1||count>80)throw Error('Choose 1 to 80 whole cards.');const code=`FL1-${$('#type').value}${n}${n!==4&&$('#free').checked?'F':'Z'}-${seed}`;parseCode(code);applySet({...state,code,count,pattern:$('#pattern').value})}catch(e){$('#setuperror').textContent=e.message}}
function loadCode(){try{const c=parseCode($('#loadcode').value);applySet({...state,code:c.code})}catch(e){$('#codeerror').textContent=e.message}}
function newRound(){confirmPage('Another round of wonder?','Clear this round’s calls and shuffle a new call order? Your printed cards stay exactly the same.',()=>{state.called=[];state.round++;save();go('caller')})}
function celebrate(){document.querySelectorAll('.celebrate,.celebrationtitle').forEach(x=>x.remove());const wrap=document.createElement('div');wrap.className='celebrate';wrap.setAttribute('aria-hidden','true');if(!matchMedia('(prefers-reduced-motion: reduce)').matches)wrap.innerHTML=Array.from({length:50},(_,i)=>`<i class="confetti" style="left:${(i*37)%100}%;background:${['#e7b866','#b53d4e','#2d6b65','#c5dfe7'][i%4]};animation-delay:${i%7*.09}s;transform:rotate(${i*13}deg)"></i>`).join('');const text=document.createElement('div');text.className='celebrationtitle';text.textContent='A little winter winner!';document.body.append(wrap,text);setTimeout(()=>{wrap.remove();text.remove()},3400);chime(true)}
function runCheck(showCelebration=true){pause();const num=Number($('#cardnum').value);if(!Number.isInteger(num)||num<1||num>state.count){$('#checkerror').textContent='Choose a whole card number from 1 to '+state.count+'.';$('#checkresult').innerHTML='';return}$('#checkerror').textContent='';selected=num;state.pattern=$('#checkpattern').value;save();const c=parseCode(state.code),r=evaluate(card(state.code,num),state.called,c.size,state.pattern);$('#checkedcard').innerHTML=cardHTML(num,r);$('#checkresult').innerHTML=`<div class="result ${r.valid?'valid':''}"><span aria-hidden="true" style="font-size:30px">${r.valid?'✓':'○'}</span><div><strong>${r.valid?'Bingo — valid winner!':'Not quite yet'}</strong><p>Card ${num} · ${patterns[state.pattern]} · ${state.called.length} calls checked.</p></div></div>`;document.querySelectorAll('[data-card]').forEach(x=>x.classList.toggle('selected',+x.dataset.card===num));checkShown=true;announce(r.valid?'Valid winner. Card '+num:'Not yet valid. Card '+num);if(r.valid&&showCelebration)celebrate()}
function exportBackup(){pause();const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a'),url=URL.createObjectURL(b);a.href=url;a.download='Frostlume_Bingo_Backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);$('#backupstatus').hidden=false;$('#backupstatus').textContent='Backup download prepared. Keep it somewhere safe.'}
async function importFile(e){const file=e.target.files[0];if(!file)return;try{if(file.size>100000)throw Error('Choose a backup smaller than 100 KB.');const incoming=validate(JSON.parse(await file.text()));confirmPage('Restore this bingo night?','Replace the current set and calls with the selected backup? Auto-call stays paused.',()=>{state=incoming;selected=1;save();go('caller');announce('Backup restored. Caller is paused.')})}catch(e){$('#backuperror').textContent='Could not import: '+e.message}finally{e.target.value=''}}
function sheetHTML(content,page,total,kind){const letter=printSpec.paper==='Letter',w=letter?215.9:210,h=letter?279.4:297;return `<section class="sheet" style="width:${w}mm;height:${h-.4}mm"><div class="sheettitle"><strong>Frostlume Bingo · ${kind}</strong><span>${state.code} · ${page} / ${total}</span></div>${content}</section>`}
function makePrint(){let chunks=[],kind=printSpec.kind;if(kind==='cards'){for(let i=1;i<=state.count;i+=printSpec.per){chunks.push(`<div class="printcards ${printSpec.per===1?'one':printSpec.per===2?'two':'four'}">${Array.from({length:Math.min(printSpec.per,state.count-i+1)},(_,j)=>cardHTML(i+j)).join('')}</div>`)}}else if(kind==='checklist'){const items=pool(state.code);for(let i=0;i<items.length;i+=45)chunks.push(`<div class="checksheet">${items.slice(i,i+45).map(id=>`<div class="checkrow"><i class="box"></i>${parseCode(state.code).type==='P'?icon(id):''}<span>${esc(labelItem(id))}</span></div>`).join('')}</div>`)}else{const items=pool(state.code);for(let i=0;i<items.length;i+=15)chunks.push(`<div class="slips">${items.slice(i,i+15).map(id=>`<div class="slip">${parseCode(state.code).type==='P'?icon(id):''}<span class="${parseCode(state.code).type==='N'?'big':''}">${esc(labelItem(id))}</span></div>`).join('')}</div>`)}return chunks.map((x,i)=>sheetHTML(x,i+1,chunks.length,kind==='cards'?'Cards':kind==='checklist'?'Caller checklist':'Call slips')).join('')}
function printPreview(kind){pause();printSpec={kind,paper:$('#paper')?.value||printSpec.paper,per:+($('#perpage')?.value||printSpec.per)};priorView=view;view='print';nav();$('#papersize').textContent=`@page{size:${printSpec.paper==='A4'?'A4':'Letter'};margin:0}`;$('#printroot').innerHTML=makePrint();$('#printroot').hidden=true;const pages=$('#printroot').children.length;$('#main').innerHTML=title('The print studio','A little paper magic.',`${pages} ${pages===1?'page':'pages'} · ${printSpec.paper==='A4'?'A4':'US Letter'} · print at 100% with headers and footers off.`)+`<div class="printtools"><button class="red" data-action="print">Print ${kind==='cards'?'cards':kind==='slips'?'call slips':'checklist'}</button><button class="secondary" data-action="backprint">Back to cards</button><span class="muted"><small>Preview is scaled to fit your screen. Print uses the true paper size.</small></span></div><div class="printviewport" id="printviewport"><div id="sheetscreen">${$('#printroot').innerHTML}</div></div>`;scalePrint();window.scrollTo(0,0)}
function scalePrint(){const screen=$('#sheetscreen');if(!screen)return;const wrap=$('#printviewport'),sheet=screen.firstElementChild;const width=sheet.offsetWidth,avail=wrap.clientWidth-36,height=sheet.offsetHeight;let scale=Math.min(1,avail/width,(wrap.clientHeight-36)/height);screen.style.width=width+'px';screen.style.zoom=scale;screen.style.margin='auto'}
window.addEventListener('resize',scalePrint);
